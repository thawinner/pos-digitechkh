<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - កំណត់ហេតុប្រព័ន្ធ</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ផ្ទាំងតួលេខ៖ 4 ជួរលើកុំព្យូទ័រ 2 ជួរលើទូរស័ព្ទ (custom.css បង្ខំ .grid-cols-2 ទៅ 1 ជួរ ដូច្នេះប្រើថ្នាក់ផ្ទាល់) */
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .ctl-meter { height: 6px; border-radius: 9999px; background: #f4f4f4; overflow: hidden; }
        html.dark .ctl-meter { background: #292929; }
    </style>
</head>
<body id="controlPortal" data-role-root="../.." data-active="audit" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="កំណត់ហេតុ"
             data-subtitle="រាល់សកម្មភាពរបស់អ្នកគ្រប់គ្រងប្រព័ន្ធ · មិនអាចកែ ឬលុបបាន"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <div id="tabs" class="flex flex-wrap gap-1"></div>
                    <label class="relative w-full sm:w-[240px]">
                        <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="search" oninput="renderList()" type="text" placeholder="ស្វែងរកហាង ឬសកម្មភាព"
                            class="sm-td w-full h-9 pl-8 pr-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none">
                    </label>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div id="list" class="divide-y divide-slate-100"></div>
                    <div data-pager="ctl-log" id="pager"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/control-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* កំណត់ហេតុប្រព័ន្ធ៖ ការបង់ប្រាក់ កញ្ចប់ ផ្អាក ចូលមើលដើម្បីជួយ បង្កើតហាង · 50 ជួរក្នុងមួយទំព័រ */
        let tab = 'all';
        let listReady = false;

        function setTab(id) { tab = id; renderAll(); }

        function renderTabs() {
            const all = ctlLog();
            const tabs = [{ id: 'all', label: 'ទាំងអស់', n: all.length }].concat(Object.keys(CTL_LOG_TYPES).map(k => ({ id: k, label: CTL_LOG_TYPES[k].label, n: all.filter(x => x.type === k).length })));
            document.getElementById('tabs').innerHTML = tabs.map(t => `<button type="button" onclick="setTab('${t.id}')"
                class="sm-badge h-9 px-3.5 rounded-xl transition inline-flex items-center gap-2 ${tab === t.id ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">${t.label}
                <span class="text-[12px] sm-figure ${tab === t.id ? 'text-blue-100' : 'text-slate-400'}">${t.n}</span></button>`).join('');
        }

        function renderList() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            if (listReady) saveListState('ctl-audit', { tab, q: document.getElementById('search').value });
            const all = ctlLog().filter(x => tab === 'all' || x.type === tab)
                .filter(x => !q || x.note.toLowerCase().includes(q) || (x.companyId && companyName(x.companyId).toLowerCase().includes(q)));
            const pg = pagerSlice('ctl-log', all, { size: 50, render: 'renderList', sig: tab + '|' + q });
            document.getElementById('list').innerHTML = all.length ? pg.rows.map(x => `
                <div class="px-5 py-3 flex gap-3 ${x.companyId ? 'hover:bg-slate-50 cursor-pointer' : ''}" ${x.companyId ? `onclick="openCompany('${x.companyId}')"` : ''}>
                    <span class="w-9 h-9 rounded-lg border border-slate-200 text-slate-400 flex items-center justify-center flex-shrink-0"><i class="fas ${(CTL_LOG_TYPES[x.type] || CTL_LOG_TYPES.company).icon} text-[13px]"></i></span>
                    <div class="min-w-0 flex-1">
                        <p class="sm-td text-slate-800">${x.companyId ? `<span class="font-semibold">${escapeText(companyName(x.companyId))}</span> · ` : ''}${escapeText(x.note)}</p>
                        <p class="sm-td-sub text-slate-400"><span class="sm-figure">${fmtDate(x.at)} ${fmtTime(x.at)}</span> · ${personName(x.by)} · ${(CTL_LOG_TYPES[x.type] || CTL_LOG_TYPES.company).label}</p>
                    </div>
                </div>`).join('') : emptyState('fa-clock-rotate-left', 'គ្មានសកម្មភាព', 'សូមសាកល្បងផ្ទាំង ឬពាក្យស្វែងរកផ្សេង');
            document.getElementById('pager').innerHTML = pg.html;
        }

        function renderAll() { renderTabs(); renderList(); }

        function init() {
            const saved = loadListState('ctl-audit') || {};
            if (saved.tab && (saved.tab === 'all' || CTL_LOG_TYPES[saved.tab])) tab = saved.tab;
            if (saved.q) document.getElementById('search').value = saved.q;
            listReady = true;
            renderAll();
        }

        window.onStoreChanged = renderAll;
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
