<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - ការបង់ប្រាក់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ផ្ទាំងតួលេខ៖ 4 ជួរលើកុំព្យូទ័រ 2 ជួរលើទូរស័ព្ទ (custom.css បង្ខំ .grid-cols-2 ទៅ 1 ជួរ ដូច្នេះប្រើថ្នាក់ផ្ទាល់) */
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .ctl-meter { height: 6px; border-radius: 9999px; background: #f4f4f4; overflow: hidden; }
        html.dark .ctl-meter { background: #292929; }
    </style>
</head>
<body id="controlPortal" data-role-root="../.." data-active="billing" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ការបង់ប្រាក់"
             data-subtitle="ហាងដែលត្រូវបង់ និងប្រវត្តិការទទួលប្រាក់"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div id="kpis" class="ctl-kpis"></div>
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <div id="tabs" class="flex flex-wrap gap-1"></div>
                    <label id="searchBox" class="relative w-full sm:w-[240px]">
                        <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="search" oninput="renderList()" type="text" placeholder="ស្វែងរកហាង ឬលេខយោង"
                            class="sm-td w-full h-9 pl-8 pr-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none">
                    </label>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div id="list"></div>
                    <div data-pager="ctl-payments" id="pager"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/control-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ការបង់ប្រាក់ (P8-07)៖ «ត្រូវប្រមូល» = ផុតកំណត់ក្នុង 14 ថ្ងៃ ហួសកំណត់ ឬសាកល្បងជិតចប់ · «បានទទួល» = ប្រវត្តិ */
        let tab = 'due';
        let listReady = false;

        function renderKpis() {
            const month = isoDate(new Date()).slice(0, 7);
            const pays = ctlPayments();
            const thisMonth = pays.filter(p => p.at.startsWith(month));
            const due = ctlDueList().filter(c => !c.trial);
            const overdue = due.filter(c => c.status === 'overdue');
            const amt = list => list.reduce((s, c) => s + (c.cycle === 'year' ? priceFor(c.plan, 12) : priceFor(c.plan, 1)), 0);
            document.getElementById('kpis').innerHTML = [
                kpiCard('ទទួលបានខែនេះ', fmtUSD(thisMonth.reduce((s, p) => s + p.amount, 0)), `${thisMonth.length} ការបង់`),
                kpiCard('ត្រូវប្រមូលក្នុង 14 ថ្ងៃ', fmtUSD(amt(due)), `${due.length} ហាង`, due.length ? 'text-amber-700' : ''),
                kpiCard('ហួសកំណត់បង់', fmtUSD(amt(overdue)), overdue.length ? `${overdue.length} ហាង · ផ្អាកក្រោយ ${SUB_GRACE_DAYS} ថ្ងៃ` : 'គ្មាន', overdue.length ? 'text-amber-700' : ''),
                kpiCard('ចំណូលប្រចាំខែ', fmtUSD(ctlMrr()), 'ហាងបង់ប្រាក់ដែលនៅប្រើ', '', '../plans/plans.html')
            ].join('');
        }

        function setTab(id) { tab = id; renderAll(); }

        function renderTabs() {
            const tabs = [{ id: 'due', label: 'ត្រូវប្រមូល', n: ctlDueList().length }, { id: 'paid', label: 'បានទទួល', n: ctlPayments().length }];
            document.getElementById('tabs').innerHTML = tabs.map(t => `<button type="button" onclick="setTab('${t.id}')"
                class="sm-badge h-9 px-3.5 rounded-xl transition inline-flex items-center gap-2 ${tab === t.id ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">${t.label}
                <span class="text-[12px] sm-figure ${tab === t.id ? 'text-blue-100' : 'text-slate-400'}">${t.n}</span></button>`).join('');
        }

        function dueHtml(list) {
            if (!list.length) return emptyState('fa-circle-check', 'គ្មានហាងត្រូវបង់ក្នុង 14 ថ្ងៃ', 'ហាងទាំងអស់បានបង់ទុកជាមុន');
            return `<div class="divide-y divide-slate-100">${list.map(c => {
                const amount = c.cycle === 'year' ? priceFor(c.plan, 12) : priceFor(c.plan, 1);
                return `<div data-row-id="${c.id}" class="px-5 py-3.5 flex flex-wrap items-center gap-x-4 gap-y-2">
                    <a href="../companies/view-company.html?id=${c.id}" class="min-w-0 flex-1 basis-[220px]">
                        <span class="block sm-td-strong text-slate-800 truncate hover:underline">${escapeText(c.nameKh)}</span>
                        <span class="block sm-td-sub text-slate-500 truncate">${escapeText(c.ownerName)} · <span class="sm-figure">${escapeText(c.ownerPhone)}</span> · ${planById(c.plan).name}</span>
                    </a>
                    <span class="text-right">
                        <span class="block sm-td-sub font-semibold ${c.status === 'overdue' || c.status === 'expiring' ? 'text-amber-700' : 'text-slate-600'}">${attentionText(c)}</span>
                        <span class="block sm-td-sub text-slate-400 sm-figure">${fmtDate(c.endsOn)}${reminderText(c) ? ` · ${reminderText(c)}` : ''}</span>
                    </span>
                    <span class="w-24 text-right sm-td sm-figure font-semibold text-slate-800">${fmtUSD(amount)}<span class="block sm-td-sub font-normal text-slate-400">${c.cycle === 'year' ? '12 ខែ' : '1 ខែ'}</span></span>
                    <button type="button" onclick="ctlRemindDialog('${c.id}').then(ok => ok && renderAll())" aria-label="រំលឹក" class="sm-badge h-9 w-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-500 inline-flex items-center justify-center"><i class="fas fa-bell"></i></button>
                    <button type="button" onclick="ctlOpenPayment('${c.id}')" class="sm-badge h-9 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold whitespace-nowrap"><i class="fas fa-receipt mr-1.5 text-slate-400"></i>កត់ត្រាការបង់</button>
                </div>`;
            }).join('')}</div>`;
        }

        function paidHtml(rows) {
            return `<div class="max-md:hidden overflow-x-auto"><table class="w-full">
                <thead><tr class="border-b border-slate-100 bg-slate-50/60">
                    <th class="sm-th py-2.5 px-5 text-left text-slate-500">ថ្ងៃបង់</th>
                    <th class="sm-th py-2.5 px-3 text-left text-slate-500">ហាង</th>
                    <th class="sm-th py-2.5 px-3 text-left text-slate-500">រយៈពេល</th>
                    <th class="sm-th py-2.5 px-3 text-left text-slate-500">វិធីបង់</th>
                    <th class="sm-th py-2.5 px-3 text-left text-slate-500">កត់ត្រាដោយ</th>
                    <th class="sm-th py-2.5 px-5 text-right text-slate-500">ចំនួន</th>
                </tr></thead>
                <tbody class="divide-y divide-slate-100">${rows.map(p => `<tr data-row-id="${p.id}" class="hover:bg-slate-50 cursor-pointer" onclick="openCompany('${p.companyId}')">
                    <td class="py-2.5 px-5 sm-td sm-figure text-slate-700">${fmtDate(p.at)}</td>
                    <td class="py-2.5 px-3 sm-td text-slate-800 font-medium">${escapeText(companyName(p.companyId))}</td>
                    <td class="py-2.5 px-3 sm-td text-slate-700"><span class="sm-figure">${fmtDate(p.periodFrom)} – ${fmtDate(p.periodTo)}</span><span class="block sm-td-sub text-slate-400">${p.months} ខែ</span></td>
                    <td class="py-2.5 px-3 sm-td text-slate-700">${PAY_METHODS[p.method].label}${p.ref ? `<span class="block sm-td-sub text-slate-400 sm-figure">${escapeText(p.ref)}</span>` : ''}</td>
                    <td class="py-2.5 px-3 sm-td text-slate-600">${personName(p.by)}</td>
                    <td class="py-2.5 px-5 sm-td sm-figure text-right font-medium text-slate-800">${fmtUSD(p.amount)}</td>
                </tr>`).join('')}</tbody></table></div>
                <div class="md:hidden divide-y divide-slate-100">${rows.map(p => `<div class="p-4 flex justify-between gap-3" onclick="openCompany('${p.companyId}')">
                    <div class="min-w-0"><p class="sm-value text-slate-800 truncate">${escapeText(companyName(p.companyId))}</p>
                    <p class="sm-td-sub text-slate-500"><span class="sm-figure">${fmtDate(p.at)}</span> · ${PAY_METHODS[p.method].label} · ${p.months} ខែ</p></div>
                    <span class="sm-value sm-figure text-slate-800">${fmtUSD(p.amount)}</span></div>`).join('')}</div>`;
        }

        function renderList() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            if (listReady) saveListState('ctl-billing', { tab, q: document.getElementById('search').value });
            if (tab === 'due') {
                const list = ctlDueList().filter(c => !q || c.nameKh.toLowerCase().includes(q) || c.ownerName.toLowerCase().includes(q));
                document.getElementById('list').innerHTML = dueHtml(list);
                document.getElementById('pager').innerHTML = '';
                return;
            }
            const all = ctlPayments().filter(p => !q || companyName(p.companyId).toLowerCase().includes(q) || (p.ref || '').toLowerCase().includes(q));
            const pg = pagerSlice('ctl-payments', all, { size: 25, render: 'renderList', sig: q });
            document.getElementById('list').innerHTML = all.length ? paidHtml(pg.rows) : emptyState('fa-receipt', 'រកមិនឃើញការបង់ប្រាក់', 'សូមសាកល្បងពាក្យស្វែងរកផ្សេង');
            document.getElementById('pager').innerHTML = pg.html;
        }

        function renderAll() {
            renderKpis(); renderTabs(); renderList();
            if (typeof updatePortalBadges === 'function') updatePortalBadges();
        }

        function init() {
            const saved = loadListState('ctl-billing') || {};
            const urlTab = new URLSearchParams(location.search).get('tab');
            tab = ['due', 'paid'].includes(urlTab) ? urlTab : ['due', 'paid'].includes(saved.tab) ? saved.tab : 'due';
            if (saved.q && !urlTab) document.getElementById('search').value = saved.q;
            listReady = true;
            renderAll();
            flashViewedRow();
        }

        window.onStoreChanged = renderAll;
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
