<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - កញ្ចប់ និងតម្លៃ</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ផ្ទាំងតួលេខ៖ 4 ជួរលើកុំព្យូទ័រ 2 ជួរលើទូរស័ព្ទ (custom.css បង្ខំ .grid-cols-2 ទៅ 1 ជួរ ដូច្នេះប្រើថ្នាក់ផ្ទាល់) */
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .ctl-meter { height: 6px; border-radius: 9999px; background: #f4f4f4; overflow: hidden; }
        html.dark .ctl-meter { background: #292929; }
    </style>
</head>
<body id="controlPortal" data-role-root="../.." data-active="plans" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="កញ្ចប់ និងតម្លៃ"
             data-subtitle="តម្លៃប្រចាំខែ ដែនកំណត់ និងចំនួនហាងតាមកញ្ចប់"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div id="plans" class="grid gap-5 lg:grid-cols-3"></div>
                <p class="sm-td-sub text-slate-500 px-1"><i class="fas fa-circle-info mr-1 text-slate-400"></i>ប្រចាំឆ្នាំ = តម្លៃ 10 ខែ · សាកល្បង 14 ថ្ងៃ ឥតគិតថ្លៃ · តម្លៃថ្មីគិតពីការបង់លើកក្រោយ មិនប៉ះពាល់ការបង់រួច</p>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/control-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* កញ្ចប់ (P8-06)៖ តម្លៃ និងដែនកំណត់ · កែដោយអ្នកគ្រប់គ្រងប្រព័ន្ធ · មិនអាចបន្ថយដែនកំណត់ក្រោមការប្រើប្រាស់របស់ហាងណាមួយ */
        function renderAll() {
            const all = ctlCompanies();
            document.getElementById('plans').innerHTML = ctlPlans().map(p => {
                const list = all.filter(c => c.plan === p.id);
                const paying = list.filter(c => !c.trial && ['active', 'expiring', 'overdue'].includes(c.status));
                const full = list.filter(c => usageLines(c).some(l => l.key !== 'branches' && l.used >= l.limit));
                return `<section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col">
                    <div class="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-3">
                        <div class="min-w-0"><h3 class="sm-card-title text-slate-800">${p.name}</h3><p class="sm-card-sub text-slate-500">${escapeText(p.note)}</p></div>
                        <button type="button" onclick="location.href='edit-plan.html?id=${p.id}'" class="sm-badge h-9 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold whitespace-nowrap"><i class="fas fa-pen mr-1.5 text-slate-400"></i>កែ</button>
                    </div>
                    <div class="px-5 py-4">
                        <p class="sm-figure"><span class="text-[30px] font-bold text-slate-900">${fmtUSD(p.price)}</span><span class="sm-td text-slate-500"> / ខែ</span></p>
                        <p class="sm-td-sub text-slate-500 sm-figure">${fmtUSD(p.price * YEAR_PAID_MONTHS)} / ឆ្នាំ</p>
                        <div class="mt-4 divide-y divide-slate-100">
                            ${[['បញ្ជរ', p.registers], ['បុគ្គលិក', p.staff], ['សាខា', p.branches]].map(([l, n]) => `<div class="flex justify-between py-2"><span class="sm-td text-slate-600">${l}</span><span class="sm-td sm-figure font-semibold text-slate-800">${n}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="mt-auto px-5 py-4 border-t border-slate-100 grid grid-cols-3 gap-2 text-center">
                        <a href="../companies/companies.html" class="block rounded-xl hover:bg-slate-50 py-1"><span class="block sm-value sm-figure text-slate-800">${list.length}</span><span class="block sm-td-sub text-slate-500">ហាង</span></a>
                        <div class="py-1"><span class="block sm-value sm-figure text-slate-800">${fmtUSD(ctlMrr(paying))}</span><span class="block sm-td-sub text-slate-500">ចំណូល/ខែ</span></div>
                        <div class="py-1"><span class="block sm-value sm-figure text-slate-800">${full.length}</span><span class="block sm-td-sub text-slate-500">ប្រើពេញ</span></div>
                    </div>
                </section>`;
            }).join('');
        }

        window.onStoreChanged = renderAll;
        document.addEventListener('DOMContentLoaded', renderAll);
    </script>
</body>
</html>
