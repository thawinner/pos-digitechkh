<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - កែកញ្ចប់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="controlPortal" data-role-root="../.." data-active="plans" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="កែកញ្ចប់"
             data-subtitle="តម្លៃ និងដែនកំណត់ · តម្លៃថ្មីគិតពីការបង់លើកក្រោយ" data-back="plans.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <form id="form" onsubmit="return submitForm(event)" novalidate class="w-full grid gap-5 xl:grid-cols-3">
                <div class="xl:col-span-2 space-y-5">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">តម្លៃ</h3><p class="sm-card-sub text-slate-500">ប្រចាំឆ្នាំ = តម្លៃ 10 ខែ</p></div>
                        <div class="px-5 py-5 grid gap-x-4 md:grid-cols-2">
                            <label class="block "><span class="sm-td font-semibold text-slate-700">តម្លៃប្រចាំខែ ($)</span>
                                <input id="price" type="text" inputmode="decimal" placeholder="ឧ. 29" class="f-input mt-1.5"><span id="priceErr" class="f-err"></span></label>
                            <div id="yearly" class="pt-8 sm-td text-slate-600"></div>
                        </div>
                    </section>
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">ដែនកំណត់</h3><p class="sm-card-sub text-slate-500">មិនអាចតិចជាងការប្រើប្រាស់របស់ហាងណាមួយ</p></div>
                        <div class="px-5 py-5 grid gap-x-4 md:grid-cols-3">
                            <label class="block "><span class="sm-td font-semibold text-slate-700">បញ្ជរ</span>
                                <input id="registers" type="text" inputmode="numeric" placeholder="" class="f-input mt-1.5"><span id="registersErr" class="f-err"></span></label>
                            <label class="block "><span class="sm-td font-semibold text-slate-700">បុគ្គលិក</span>
                                <input id="staff" type="text" inputmode="numeric" placeholder="" class="f-input mt-1.5"><span id="staffErr" class="f-err"></span></label>
                            <label class="block "><span class="sm-td font-semibold text-slate-700">សាខា</span>
                                <input id="branches" type="text" inputmode="numeric" placeholder="" class="f-input mt-1.5"><span id="branchesErr" class="f-err"></span></label>
                        </div>
                    </section>
                </div>
                <div class="space-y-5">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm px-5 py-4 space-y-3">
                        <p id="summary" class="sm-td-sub text-slate-600 leading-relaxed"></p>
                        <button type="submit" class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white sm-td font-semibold inline-flex items-center justify-center gap-2"><i class="fas fa-check"></i> រក្សាទុក</button>
                    </section>
                </div>
            </form>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/control-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* កែកញ្ចប់ (អ្នកគ្រប់គ្រងប្រព័ន្ធ) — ទំព័រពេញ (.ai/ui-rules §2) */
        function setErr(id, msg) {
            document.getElementById(id).classList.toggle('is-error', !!msg);
            document.getElementById(id + 'Err').textContent = msg || '';
            return msg ? 1 : 0;
        }
        function val(id) { return document.getElementById(id).value.trim(); }
        function wireInputs(onChange) {
            document.querySelectorAll('.f-input').forEach(i => i.addEventListener('input', () => { setErr(i.id, ''); if (onChange) onChange(); }));
        }
        const ID = new URLSearchParams(location.search).get('id');
        const plan = ctlPlans().find(p => p.id === ID);
        const users = ctlCompanies().filter(c => c.plan === ID);
        const maxUse = k => Math.max(0, ...users.map(c => c.usage[k]));
        const LABEL = { registers: 'បញ្ជរ', staff: 'បុគ្គលិក', branches: 'សាខា' };

        function renderYearly() {
            const n = Number(val('price'));
            document.getElementById('yearly').innerHTML = n > 0 ? `ប្រចាំឆ្នាំ <b class="sm-figure text-slate-800">${fmtUSD(n * YEAR_PAID_MONTHS)}</b>` : '';
        }

        function submitForm(e) {
            e.preventDefault();
            const next = { price: Number(val('price')), registers: Number(val('registers')), staff: Number(val('staff')), branches: Number(val('branches')) };
            let bad = setErr('price', !(next.price > 0) ? 'តម្លៃត្រូវធំជាង 0' : '');
            ['registers', 'staff', 'branches'].forEach(k => {
                bad += setErr(k, !(Number.isInteger(next[k]) && next[k] >= 1) ? 'លេខគត់ យ៉ាងតិច 1'
                    : next[k] < maxUse(k) ? `មិនអាចតិចជាង ${maxUse(k)} (ហាងកំពុងប្រើ)` : '');
            });
            if (bad) { document.querySelector('.f-input.is-error').focus(); return false; }
            const changes = [['price', 'តម្លៃ', fmtUSD], ['registers', 'បញ្ជរ', String], ['staff', 'បុគ្គលិក', String], ['branches', 'សាខា', String]]
                .filter(([k]) => next[k] !== plan[k]).map(([k, l, f]) => `${l} ${f(plan[k])} → ${f(next[k])}`);
            if (!changes.length) { showToast('មិនមានការកែប្រែ', 'info'); return false; }
            posWrite('pos_ctl_plans', ctlPlans().map(x => x.id === ID ? Object.assign({}, x, next) : x));
            ctlSyncStatus(posRead('pos_ctl_companies', []));
            ctlAddLog('', 'plan', `កែកញ្ចប់${plan.name} · ${changes.join(' · ')}`);
            flashToast(`បានរក្សាទុកកញ្ចប់${plan.name}`);
            location.href = 'plans.html';
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!plan) { location.replace('plans.html'); return; }
            setPortalTitle(`កែកញ្ចប់${plan.name}`);
            ['price', 'registers', 'staff', 'branches'].forEach(k => { document.getElementById(k).value = plan[k]; });
            ['registers', 'staff', 'branches'].forEach(k => {
                const err = document.getElementById(k + 'Err');
                err.insertAdjacentHTML('afterend', `<span class="block sm-td-sub text-slate-500 -mt-1 mb-2">ហាងប្រើច្រើនបំផុត ${maxUse(k)}</span>`);
            });
            document.getElementById('summary').innerHTML = `<i class="fas fa-circle-info text-slate-400 mr-1.5"></i>${users.length} ហាងប្រើកញ្ចប់នេះ · តម្លៃថ្មីគិតពីការបង់លើកក្រោយ មិនប៉ះពាល់ការបង់រួច · ដែនកំណត់ថ្មីមានប្រសិទ្ធភាពភ្លាម`;
            renderYearly();
            wireInputs(renderYearly);
        });
    </script>
</body>
</html>
