<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - បន្ថែមហាង</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ផ្ទាំងតួលេខ៖ 4 ជួរលើកុំព្យូទ័រ 2 ជួរលើទូរស័ព្ទ (custom.css បង្ខំ .grid-cols-2 ទៅ 1 ជួរ ដូច្នេះប្រើថ្នាក់ផ្ទាល់) */
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .ctl-meter { height: 6px; border-radius: 9999px; background: #f4f4f4; overflow: hidden; }
        html.dark .ctl-meter { background: #292929; }
        .ctl-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .ctl-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .ctl-input.is-error { border-color: #fb7185; }
        html.dark .ctl-input { background: #171717; border-color: #404040; color: #e7e7e7; }
        .ctl-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        /* custom.css §17 ពង្រីកប៊ូតុងក្នុងទម្រង់មាន submit · ជម្រើសខេត្តត្រូវនៅតូចដដែល */
        @media (max-width: 767px) { .ctl-form #cityPick button { width: auto !important; } }
    </style>
</head>
<body id="controlPortal" data-role-root="../.." data-active="companies" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បន្ថែមហាង"
             data-subtitle="បង្កើតហាងថ្មី និងគណនីម្ចាស់ហាង · សាកល្បង 14 ថ្ងៃ ឥតគិតថ្លៃ" data-back="companies.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <form id="form" onsubmit="return submitForm(event)" novalidate class="ctl-form w-full grid gap-5 xl:grid-cols-3">
                <div class="xl:col-span-2 space-y-5">
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">ហាង</h3><p class="sm-card-sub text-slate-500">ឈ្មោះដែលបង្ហាញលើអេក្រង់ វិក្កយបត្រ និងកូដ KHQR</p></div>
                        <div class="px-5 py-5 grid gap-4 md:grid-cols-2">
                            <label class="block"><span class="sm-td font-semibold text-slate-700">ឈ្មោះហាង</span>
                                <input id="nameKh" type="text" placeholder="ឧ. ម៉ាតមីនី សុខសាន្ត" class="ctl-input mt-1.5"><span id="nameKhErr" class="ctl-err"></span></label>
                            <label class="block"><span class="sm-td font-semibold text-slate-700">ឈ្មោះសម្រាប់ KHQR</span>
                                <input id="nameLatin" type="text" placeholder="ឧ. SOKHSAN MART" autocapitalize="characters" class="ctl-input mt-1.5"><span id="nameLatinErr" class="ctl-err"></span>
                                <span class="block sm-td-sub text-slate-500 mt-1">អក្សរឡាតាំងធំ · ធនាគារបង្ហាញឈ្មោះនេះពេលអតិថិជនស្កេន</span></label>
                            <div class="block"><span class="sm-td font-semibold text-slate-700">ខេត្ត ឬក្រុង</span>
                                <div id="cityPick" class="mt-1.5 flex flex-wrap gap-1.5"></div></div>
                            <label class="block"><span class="sm-td font-semibold text-slate-700">សាខា ឬទីតាំង</span>
                                <input id="branch" type="text" placeholder="ឧ. សាខាសែនសុខ" class="ctl-input mt-1.5"><span id="branchErr" class="ctl-err"></span></label>
                        </div>
                    </section>
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">ម្ចាស់ហាង</h3><p class="sm-card-sub text-slate-500">មនុស្សម្នាក់ គណនីមួយ · បើម្ចាស់មានគណនីរួចហើយ ប្រើលេខដដែលមិនបាន</p></div>
                        <div class="px-5 py-5 grid gap-4 md:grid-cols-2">
                            <label class="block md:col-span-2"><span class="sm-td font-semibold text-slate-700">ឈ្មោះពេញ</span>
                                <input id="ownerName" type="text" placeholder="ឧ. សុខ សាន្ត" class="ctl-input mt-1.5"><span id="ownerNameErr" class="ctl-err"></span></label>
                            <label class="block"><span class="sm-td font-semibold text-slate-700">លេខទូរស័ព្ទ</span>
                                <input id="ownerPhone" type="tel" inputmode="tel" placeholder="ឧ. 012 345 678" class="ctl-input mt-1.5"><span id="ownerPhoneErr" class="ctl-err"></span></label>
                            <label class="block"><span class="sm-td font-semibold text-slate-700">អ៊ីមែល <span class="font-normal text-slate-400">មិនចាំបាច់</span></span>
                                <input id="ownerEmail" type="email" placeholder="ឧ. owner@gmail.com" class="ctl-input mt-1.5"><span id="ownerEmailErr" class="ctl-err"></span></label>
                        </div>
                    </section>
                </div>
                <div class="space-y-5">
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">កញ្ចប់</h3><p class="sm-card-sub text-slate-500">សាកល្បង 14 ថ្ងៃ ឥតគិតថ្លៃ · ប្តូរបានពេលក្រោយ</p></div>
                        <div id="planPick" class="px-5 py-4 space-y-2.5"></div>
                    </section>
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm px-5 py-4 space-y-3">
                        <div id="summary" class="sm-td-sub text-slate-600 leading-relaxed"></div>
                        <button id="submitBtn" type="submit" class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white sm-td font-semibold inline-flex items-center justify-center gap-2"><i class="fas fa-store"></i> បង្កើតហាង</button>
                    </section>
                </div>
            </form>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/control-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* បន្ថែមហាង (P8-02)៖ ហាង + គណនីម្ចាស់ហាង + កញ្ចប់ · ចាប់ផ្តើមជាសាកល្បង 14 ថ្ងៃ
           លេខទូរស័ព្ទ និងអ៊ីមែលត្រូវមិនជាន់គ្នាទូទាំងប្រព័ន្ធ (ctlContactTaken) */
        let city = 'ភ្នំពេញ';
        let plan = 'basic';

        function renderPicks() {
            document.getElementById('cityPick').innerHTML = CITIES.map(c => `<button type="button" onclick="city='${c}'; renderPicks()"
                class="sm-badge h-9 px-3 rounded-xl border transition ${city === c ? 'bg-blue-600 border-blue-600 text-white font-semibold' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${c}</button>`).join('');
            document.getElementById('planPick').innerHTML = ctlPlans().map(p => `<button type="button" onclick="plan='${p.id}'; renderPicks()"
                class="w-full text-left px-4 py-3 rounded-xl border transition flex items-start gap-3 ${plan === p.id ? 'border-blue-600 ring-1 ring-blue-600 bg-blue-50/40' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                <span class="mt-0.5 w-4 h-4 rounded-full border-2 flex-shrink-0 ${plan === p.id ? 'border-blue-600 bg-blue-600 ring-2 ring-inset ring-white' : 'border-slate-300'}"></span>
                <span class="min-w-0 flex-1"><span class="flex items-baseline justify-between gap-2"><span class="sm-td font-semibold text-slate-800">${p.name}</span><span class="sm-td sm-figure font-semibold text-slate-800">${fmtUSD(p.price)}<span class="sm-td-sub font-normal text-slate-400">/ខែ</span></span></span>
                <span class="block sm-td-sub text-slate-500 mt-0.5">${p.registers} បញ្ជរ · ${p.staff} បុគ្គលិក · ${p.branches} សាខា · ${escapeText(p.note)}</span></span></button>`).join('');
            const p = planById(plan);
            document.getElementById('summary').innerHTML = `<i class="fas fa-circle-info text-slate-400 mr-1.5"></i>សាកល្បងដល់ <b class="sm-figure text-slate-800">${fmtDate(addDaysIso(TRIAL_DAYS))}</b> · បន្ទាប់មក <b class="sm-figure text-slate-800">${fmtUSD(p.price)}</b>/ខែ ឬ <b class="sm-figure text-slate-800">${fmtUSD(p.price * YEAR_PAID_MONTHS)}</b>/ឆ្នាំ។ ម្ចាស់ហាងទទួលសារមានតំណកំណត់ពាក្យសម្ងាត់ ហើយរៀបចំហាងពេលចូលលើកដំបូង។`;
        }

        function setErr(id, msg) {
            document.getElementById(id).classList.toggle('is-error', !!msg);
            document.getElementById(id + 'Err').textContent = msg || '';
            return msg ? 1 : 0;
        }

        function val(id) { return document.getElementById(id).value.trim(); }

        function submitForm(e) {
            e.preventDefault();
            const v = { nameKh: val('nameKh'), nameLatin: val('nameLatin').toUpperCase(), branch: val('branch'), ownerName: val('ownerName'), ownerPhone: val('ownerPhone'), ownerEmail: val('ownerEmail').toLowerCase(), city, plan };
            const taken = ctlContactTaken(v.ownerPhone, v.ownerEmail);
            let bad = 0;
            bad += setErr('nameKh', v.nameKh.length < 2 ? 'សូមវាយឈ្មោះហាង' : posRead('pos_ctl_companies', []).some(c => c.nameKh === v.nameKh) ? 'មានហាងឈ្មោះនេះរួចហើយ' : '');
            bad += setErr('nameLatin', !/^[A-Z0-9 &'.-]{3,25}$/.test(v.nameLatin) ? 'អក្សរឡាតាំងធំ ឬលេខ 3 ដល់ 25 តួ' : '');
            bad += setErr('branch', v.branch.length < 2 ? 'សូមវាយសាខា ឬទីតាំង' : '');
            bad += setErr('ownerName', v.ownerName.length < 2 ? 'សូមវាយឈ្មោះម្ចាស់ហាង' : /[A-Za-z]/.test(v.ownerName) ? 'សូមវាយឈ្មោះជាអក្សរខ្មែរ' : '');
            bad += setErr('ownerPhone', normPhone(v.ownerPhone).length < 9 ? 'លេខទូរស័ព្ទមិនគ្រប់ខ្ទង់ · ឧ. 012 345 678' : taken.startsWith('លេខ') ? taken : '');
            bad += setErr('ownerEmail', v.ownerEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.ownerEmail) ? 'ទម្រង់អ៊ីមែលមិនត្រឹមត្រូវ' : taken.startsWith('អ៊ីមែល') ? taken : '');
            if (bad) { document.querySelector('.ctl-input.is-error').focus(); return false; }
            const c = ctlCreateCompany(v);
            showToast(`បានបង្កើត ${c.nameKh} · សាកល្បងដល់ ${fmtDate(c.endsOn)}`, 'success');
            setTimeout(() => { location.href = `view-company.html?id=${c.id}`; }, 500);
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPicks();
            document.querySelectorAll('.ctl-input').forEach(i => i.addEventListener('input', () => setErr(i.id, '')));
        });
    </script>
</body>
</html>
