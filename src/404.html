<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - រកមិនឃើញទំព័រ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #121212; color: #e7e7e7; font-family: 'Kantumruy Pro', sans-serif; padding: 16px; }
        .card { max-width: 420px; text-align: center; }
        h1 { font-size: 64px; margin: 0; color: #34d399; }
        p { color: #a2a2a2; line-height: 1.7; }
        a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 14px; background: #047857; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <p>រកមិនឃើញទំព័រនេះទេ។ ប្រហែលជាតំណភ្ជាប់ខុស ឬទំព័រត្រូវបានផ្លាស់ទី។</p>
        <a id="home" href="index.html">ត្រឡប់ទៅទំព័រចូលប្រើ</a>
    </div>
    <script>
        /* ទំព័រ 404 អាចបង្ហាញនៅផ្លូវណាក៏បាន ដូច្នេះប្រើផ្លូវពីឫសគេហទំព័រ */
        document.getElementById('home').href = '/index.html';
    </script>
</body>
</html>
