<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - តម្លៃស្តុកសរុប</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            @page { size: A4; margin: 12mm; }
        }
    </style>
</head>
<body id="adminPortal" data-role-root="../.." data-active="stock-value" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="តម្លៃស្តុកសរុប"
             data-subtitle="តម្លៃស្តុកជាក់ស្តែងតាមថ្លៃដើមទិញចូល · តាមមុខទំនិញ និងប្រភេទទំនិញ"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">

            <div class="w-full space-y-5">
                <!-- របារចម្រាញ់ និងបោះពុម្ព -->
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3 no-print">
                    <div id="viewTabs" class="flex flex-wrap gap-1"></div>
                    <div class="flex items-center gap-2">
                        <label class="relative w-full sm:w-[240px]">
                            <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input id="search" oninput="renderAll()" type="text" placeholder="ស្វែងរកមុខទំនិញ..."
                                class="sm-td w-full h-9 pl-8 pr-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none">
                        </label>
                        <button onclick="window.print()" type="button" class="sm-badge h-9 px-3.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold inline-flex items-center gap-2">
                            <i class="fas fa-print"></i> បោះពុម្ព
                        </button>
                    </div>
                </div>

                <!-- KPI សង្ខេប -->
                <div id="kpiRow" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 kpi-2up"></div>

                <!-- ក្រាហ្វ និងតារាង -->
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <p id="viewTitle" class="sm-card-title text-slate-800">តម្លៃស្តុកតាមប្រភេទទំនិញ</p>
                            <p id="viewSub" class="sm-card-sub text-slate-500">គិតតាមថ្លៃដើមមិនរួមអាករ</p>
                        </div>
                        <p class="sm-td-sub text-slate-400">ចំនួនក្នុងស្តុកជាក់ស្តែង × ថ្លៃដើមក្នុងមួយឯកតា</p>
                    </div>

                    <!-- ក្រាហ្វ ECharts -->
                    <div class="px-5 pt-4 pb-2 border-b border-slate-100 no-print">
                        <div id="chart" class="w-full h-[240px]"></div>
                    </div>

                    <!-- តារាងទិន្នន័យ -->
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[720px]">
                            <thead id="thead"></thead>
                            <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
                            <tfoot id="tfoot" class="border-t-2 border-slate-200 bg-slate-50/70 font-semibold sm-td"></tfoot>
                        </table>
                    </div>
                    <div id="empty" class="hidden"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/admin-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script src="../../shared/scripts/charts.js"></script>
    <script>
        let currentView = 'category'; // 'category' | 'product'

        function renderTabs() {
            const tabs = [
                { id: 'category', label: 'តាមប្រភេទទំនិញ' },
                { id: 'product', label: 'តាមមុខទំនិញ' }
            ];
            document.getElementById('viewTabs').innerHTML = tabs.map(t => {
                const on = currentView === t.id;
                return `<button type="button" onclick="currentView='${t.id}'; renderTabs(); renderAll()"
                    class="sm-badge h-9 px-3.5 rounded-xl transition ${on ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">
                    ${t.label}
                </button>`;
            }).join('');
        }

        function renderKpis(stats) {
            document.getElementById('kpiRow').innerHTML =
                kpiCard('តម្លៃស្តុកសរុប (ថ្លៃដើម)', fmtUSD(stats.totalValue), 'គិតតាមថ្លៃដើមទិញចូល', 'text-emerald-700') +
                kpiCard('ចំនួនឯកតាក្នុងស្តុក', `${stats.totalUnits}`, 'ឯកតាទំនិញជាក់ស្តែងទាំងអស់') +
                kpiCard('មុខទំនិញសរុប', `${stats.productCount}`, `${stats.byCategory.length} ប្រភេទទំនិញ`) +
                kpiCard('ថ្លៃដើមមិនទាន់បញ្ជាក់', `${stats.unconfirmedCount}`, stats.unconfirmedCount ? 'មុខទំនិញប្រើថ្លៃដើមបឋម' : 'បានបញ្ជាក់គ្រប់មុខ', stats.unconfirmedCount ? 'text-amber-600' : '');
        }

        function renderChart(stats) {
            const chartData = stats.byCategory.filter(c => c.value > 0);
            posChart('chart', {
                grid: { left: 8, right: 16, top: 20, bottom: 8, containLabel: true },
                xAxis: chartCategoryAxis(chartData.map(c => c.label)),
                yAxis: chartValueAxis(v => '$' + v),
                tooltip: {
                    formatter: ps => {
                        const d = chartData[ps[0].dataIndex];
                        return chartTipTitle(d.label) +
                            chartTipRow(CHART_TONE.accent, 'តម្លៃស្តុក', fmtUSD(d.value)) +
                            chartTipRow(CHART_TONE.slate, 'ចំនួនឯកតា', `${d.units} ឯកតា`) +
                            chartTipRow(CHART_TONE.slate, 'មុខទំនិញ', `${d.products} មុខ`);
                    }
                },
                series: [{
                    name: 'តម្លៃស្តុក',
                    type: 'bar',
                    barMaxWidth: 40,
                    itemStyle: { color: CHART_TONE.accent, borderRadius: [4, 4, 0, 0] },
                    data: chartData.map(c => +c.value.toFixed(2))
                }]
            });
        }

        function renderTable(stats) {
            const q = document.getElementById('search').value.trim().toLowerCase();
            const thead = document.getElementById('thead');
            const tbody = document.getElementById('tbody');
            const tfoot = document.getElementById('tfoot');
            const emptyEl = document.getElementById('empty');

            if (currentView === 'category') {
                document.getElementById('viewTitle').textContent = 'តម្លៃស្តុកតាមប្រភេទទំនិញ';
                document.getElementById('viewSub').textContent = 'ការបែងចែកទំហំស្តុកគិតជាថ្លៃដើម តាមប្រភេទនីមួយៗ';

                thead.innerHTML = `<tr class="border-b border-slate-100 bg-slate-50/60">
                    <th class="sm-th py-2.5 px-5 text-left text-slate-500">ប្រភេទទំនិញ</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">មុខទំនិញ</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">ចំនួនក្នុងស្តុក</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">តម្លៃស្តុកសរុប</th>
                    <th class="sm-th py-2.5 px-5 text-left text-slate-500 w-[24%]">ភាគរយនៃតម្លៃស្តុក</th>
                </tr>`;

                const filtered = stats.byCategory.filter(c => !q || c.label.toLowerCase().includes(q));
                emptyEl.classList.toggle('hidden', !!filtered.length);
                emptyEl.innerHTML = filtered.length ? '' : emptyState('fa-layer-group', 'គ្មានប្រភេទទំនិញត្រូវនឹងពាក្យស្វែងរក', '');

                tbody.innerHTML = filtered.map(c => {
                    const pct = stats.totalValue > 0 ? (c.value / stats.totalValue * 100) : 0;
                    return `<tr>
                        <td class="py-2.5 px-5 sm-td font-medium text-slate-800">${escapeText(c.label)}</td>
                        <td class="py-2.5 px-3 text-right sm-td sm-figure text-slate-600">${c.products} មុខ</td>
                        <td class="py-2.5 px-3 text-right sm-td sm-figure text-slate-700">${c.units}</td>
                        <td class="py-2.5 px-3 text-right sm-td-strong sm-figure text-emerald-700">${fmtUSD(c.value)}</td>
                        <td class="py-2.5 px-5">
                            <div class="flex items-center gap-2.5">
                                <div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                                    <div class="h-full bg-blue-600 rounded-full" style="width:${Math.min(pct, 100)}%"></div>
                                </div>
                                <span class="sm-td-sub sm-figure w-12 text-right font-medium text-slate-600">${pct.toFixed(1)}%</span>
                            </div>
                        </td>
                    </tr>`;
                }).join('');

                tfoot.innerHTML = `<tr>
                    <td class="py-2.5 px-5 text-slate-800">សរុបទាំងអស់</td>
                    <td class="py-2.5 px-3 text-right text-slate-800">${stats.productCount} មុខ</td>
                    <td class="py-2.5 px-3 text-right text-slate-800">${stats.totalUnits}</td>
                    <td class="py-2.5 px-3 text-right text-emerald-700 sm-figure">${fmtUSD(stats.totalValue)}</td>
                    <td class="py-2.5 px-5 text-slate-600 sm-figure">100.0%</td>
                </tr>`;

            } else {
                document.getElementById('viewTitle').textContent = 'តម្លៃស្តុកតាមមុខទំនិញ';
                document.getElementById('viewSub').textContent = 'ព័ត៌មានលម្អិតនៃស្តុក និងថ្លៃដើមសម្រាប់មុខទំនិញនីមួយៗ';

                thead.innerHTML = `<tr class="border-b border-slate-100 bg-slate-50/60">
                    <th class="sm-th py-2.5 px-5 text-left text-slate-500">ទំនិញ</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">ក្នុងស្តុក</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">ថ្លៃដើម/ឯកតា</th>
                    <th class="sm-th py-2.5 px-3 text-right text-slate-500">តម្លៃស្តុកសរុប</th>
                    <th class="sm-th py-2.5 px-5 text-left text-slate-500 w-[20%]">ភាគរយនៃតម្លៃស្តុក</th>
                </tr>`;

                const filtered = stats.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.includes(q));
                emptyEl.classList.toggle('hidden', !!filtered.length);
                emptyEl.innerHTML = filtered.length ? '' : emptyState('fa-box-open', 'គ្មានទំនិញត្រូវនឹងពាក្យស្វែងរក', '');

                const thumb = (p) => `<span class="w-9 h-9 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0 inline-flex items-center justify-center">${productImgHtml(p)}</span>`;

                tbody.innerHTML = filtered.map(p => {
                    const pct = stats.totalValue > 0 ? (p.value / stats.totalValue * 100) : 0;
                    const st = STOCK_STATUS[p.status] || STOCK_STATUS.ok;
                    const unconfBadge = !p.confirmed
                        ? '<span class="sm-badge ml-1.5 px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200 text-[10px]">មិនទាន់បញ្ជាក់</span>'
                        : '';

                    return `<tr>
                        <td class="py-2.5 px-5">
                            <div class="flex items-center gap-3">
                                ${thumb(p)}
                                <div class="min-w-0">
                                    <p class="sm-td-strong text-slate-800 truncate">${p.name}</p>
                                    <p class="sm-td-sub text-slate-400"><span class="sm-figure">${p.sku}</span> · ${categoryLabel(p.category)}</p>
                                </div>
                            </div>
                        </td>
                        <td class="py-2.5 px-3 text-right">
                            <span class="sm-td-strong sm-figure text-slate-800">${p.qty}</span> <span class="text-slate-400 text-xs">${p.unit}</span>
                            <span class="block sm-td-sub text-[11px] font-medium ${p.status === 'out' ? 'text-rose-600' : p.status === 'low' ? 'text-amber-600' : 'text-emerald-700'}">${st.label}</span>
                        </td>
                        <td class="py-2.5 px-3 text-right sm-td sm-figure text-slate-600">
                            ${fmtUSD(p.cost)}${unconfBadge}
                        </td>
                        <td class="py-2.5 px-3 text-right sm-td-strong sm-figure text-emerald-700">
                            ${fmtUSD(p.value)}
                        </td>
                        <td class="py-2.5 px-5">
                            <div class="flex items-center gap-2.5">
                                <div class="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                                    <div class="h-full bg-blue-600 rounded-full" style="width:${Math.min(pct * 2, 100)}%"></div>
                                </div>
                                <span class="sm-td-sub sm-figure w-12 text-right font-medium text-slate-600">${pct.toFixed(1)}%</span>
                            </div>
                        </td>
                    </tr>`;
                }).join('');

                const sumFilteredUnits = filtered.reduce((s, p) => s + p.qty, 0);
                const sumFilteredVal = filtered.reduce((s, p) => s + p.value, 0);

                tfoot.innerHTML = `<tr>
                    <td class="py-2.5 px-5 text-slate-800">សរុបមុខទំនិញ (${filtered.length})</td>
                    <td class="py-2.5 px-3 text-right text-slate-800">${sumFilteredUnits}</td>
                    <td class="py-2.5 px-3 text-right text-slate-500">—</td>
                    <td class="py-2.5 px-3 text-right text-emerald-700 sm-figure">${fmtUSD(sumFilteredVal)}</td>
                    <td class="py-2.5 px-5 text-slate-600 sm-figure">${stats.totalValue > 0 ? (sumFilteredVal / stats.totalValue * 100).toFixed(1) : 0}%</td>
                </tr>`;
            }
        }

        function renderAll() {
            const stats = totalStockValueAtCost();
            renderKpis(stats);
            renderChart(stats);
            renderTable(stats);
        }

        window.onStoreChanged = () => renderAll();
        window.onThemeChanged = () => renderAll();
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderAll();
        });
    </script>
</body>
</html>
