    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>

    <script>

        /* ផ្ទាំងគ្រប់គ្រងម្ចាស់ហាង (ឯកសាររចនាលេខ 03 ផ្នែក 3) — ចំណូល ប្រាក់ចំណេញ និងហានិភ័យសាច់ប្រាក់ */

        const PERIODS = [
            { id: 'today', label: 'ថ្ងៃនេះ', days: 1 },
            { id: 'week', label: '7 ថ្ងៃ', days: 7 },
            { id: 'all', label: '14 ថ្ងៃ', days: 14 }
        ];
        let period = 'today';
        let picked = null;
        const DAYS = adminDays(14);
        const BY_DAY = {};
        mgrAllSales().forEach(s => { const d = saleBizDate(s); (BY_DAY[d] = BY_DAY[d] || []).push(s); });

        function periodDates(id, back) {
            const n = PERIODS.find(p => p.id === id).days;
            const off = back ? n : 0;
            return DAYS.slice(Math.max(0, DAYS.length - n - off), DAYS.length - off).map(d => d.date);
        }

        /* ថ្ងៃនេះមិនទាន់ចប់ — ប្រៀបធៀបជាមួយថ្ងៃដូចគ្នាសប្តាហ៍មុន ត្រឹមម៉ោងដូចគ្នា ដើម្បីកុំឱ្យតួលេខធ្លាក់ខុសការពិត */
        function sinceStart(s, d) {
            return new Date(s.time) - new Date(d + 'T00:00');
        }

        function stats(dates, cutoff) {
            const set = new Set(dates);
            const sales = dates.flatMap(d => (BY_DAY[d] || []).filter(s => cutoff == null || sinceStart(s, d) <= cutoff));
            const acc = profitOf(sales);
            acc.variance = DAYS.filter(d => set.has(d.date)).reduce((t, d) => t + d.variance, 0);
            acc.counted = mgrAllShifts().filter(s => set.has(s.date) && s.countedUSD != null).length;
            acc.sales = sales;
            return acc;
        }

        function current() {
            const today = businessDate();
            if (period === 'today') {
                const cutoff = Date.now() - new Date(today + 'T00:00');
                const lastWeek = isoDate(addDays(new Date(today + 'T12:00'), -7));
                return { now: stats([today]), before: stats([lastWeek], cutoff), note: 'ប្រៀបធៀបនឹងថ្ងៃដូចគ្នាសប្តាហ៍មុន ត្រឹមម៉ោងនេះ' };
            }
            if (period === 'week') return { now: stats(periodDates('week')), before: stats(periodDates('week', true)), note: 'ប្រៀបធៀបនឹង 7 ថ្ងៃមុននោះ' };
            return { now: stats(periodDates('all')), before: null, note: 'ទិន្នន័យទាំងអស់ដែលមាន' };
        }

        function delta(now, before, invert) {
            const pct = before ? pctChange(now, before) : null;
            if (pct == null || !isFinite(pct)) return '<span class="text-slate-400">គ្មានទិន្នន័យប្រៀបធៀប</span>';
            const up = pct >= 0;
            const good = invert ? !up : up;
            return `<span class="inline-flex items-center gap-1 font-semibold ${Math.abs(pct) < 0.5 ? 'text-slate-500' : good ? 'text-emerald-700' : 'text-rose-600'}">
                <i class="fas ${up ? 'fa-arrow-up' : 'fa-arrow-down'} text-[10px]"></i>${Math.abs(pct).toFixed(1)}%</span>`;
        }

        function kpi(label, value, sub, extra, href) {
            const tag = href ? `a href="${href}"` : 'div';
            return `<${tag} class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm min-w-0 ${href ? 'block group hover:border-slate-300 transition' : ''}">
                <span class="sm-kpi-label text-slate-500 flex items-center justify-between gap-2">${label}${href ? '<i class="fas fa-arrow-right text-[10px] text-slate-300 group-hover:text-slate-600 transition"></i>' : ''}</span>
                <h3 class="sm-kpi-value text-slate-800 mt-1 sm-figure">${value}</h3>
                <p class="sm-kpi-sub text-slate-500 mt-1 flex flex-wrap items-center gap-x-2">${sub}</p>
                ${extra || ''}
            </${href ? 'a' : 'div'}>`;
        }

        function renderKpis(c) {
            const a = c.now;
            const b = c.before || {};
            const tol = Number(posSettings().varianceTolerance) || 5;
            const v = a.variance;
            document.getElementById('kpiRow').innerHTML =
                kpi('ចំណូលលក់', fmtUSD(a.gross), `${delta(a.gross, b.gross)}<span>${a.tx} វិក្កយបត្រ</span>`, '', '../reports/profit-report.html') +
                kpi('ប្រាក់ចំណេញដុល', fmtUSD(a.profit), `${delta(a.profit, b.profit)}<span>អត្រា ${a.margin.toFixed(1)}%</span>`,
                    `<div class="h-1.5 rounded-full bg-slate-100 mt-3 overflow-hidden"><div class="h-full bg-blue-600" style="width:${Math.min(Math.max(a.margin, 0), 100)}%"></div></div>`, '../reports/profit-report.html') +
                kpi('មធ្យមក្នុងមួយវិក្កយបត្រ', fmtUSD(a.avg), `${delta(a.avg, b.avg)}<span>លុបចោល ${a.voids}</span>`, '', '../reports/profit-report.html') +
                (a.counted ? kpi('ខុសគ្នាសាច់ប្រាក់', `<span class="${Math.abs(v) > tol ? (v < 0 ? 'text-rose-600' : 'text-amber-600') : 'text-slate-800'}">${v > 0.005 ? '+' : ''}${fmtUSD(v)}</span>`,
                    `<span>${v < -0.005 ? 'ខ្វះ' : v > 0.005 ? 'លើស' : 'ត្រូវគ្នា'} · ${a.counted} វេនដែលបានរាប់</span>`, '', '../../manager/shifts/shifts.html')
                    : kpi('ខុសគ្នាសាច់ប្រាក់', '<span class="text-slate-400">—</span>', '<span>មិនទាន់មានវេនបិទ និងរាប់ប្រាក់</span>'));
        }

        /* ក្រាហ្វជង់៖ ថ្លៃដើម (ប្រផេះ) + ប្រាក់ចំណេញដុល (បៃតង) = ចំណូលមិនរួមអាករ · ចុចលើជួរឈរដើម្បីមើលថ្ងៃនោះ */
        function renderChart() {
            const today = businessDate();
            if (!picked) picked = today;
            const isDark = typeof chartIsDark === 'function' ? chartIsDark() : false;
            const label = d => d.date === today ? 'ថ្ងៃនេះ' : String(new Date(d.date + 'T12:00').getDate());
            const chart = posChart('chart', {
                grid: { left: 4, right: 4, top: 12, bottom: 4, containLabel: true },
                xAxis: chartCategoryAxis(DAYS.map(label), {
                    axisLabel: { color: isDark ? '#a2a2a2' : '#737373', fontSize: 12, fontFamily: CHART_FONT,
                        formatter: (v, i) => DAYS[i] && DAYS[i].date === picked ? `{on|${v}}` : v,
                        rich: { on: { color: CHART_TONE.accent, fontWeight: 700, fontFamily: CHART_FONT } } }
                }),
                yAxis: chartValueAxis(v => '$' + v),
                tooltip: {
                    formatter: ps => {
                        const d = DAYS[ps[0].dataIndex];
                        return chartTipTitle(d.date === today ? 'ថ្ងៃនេះ (កំពុងលក់)' : fmtDate(d.date + 'T12:00')) +
                            chartTipRow(CHART_TONE.slate, 'ចំណូលមិនរួមអាករ', fmtUSD(d.net)) +
                            chartTipRow(CHART_TONE.slate, 'ថ្លៃដើម', fmtUSD(d.cost)) +
                            chartTipRow(CHART_TONE.accent, 'ប្រាក់ចំណេញដុល', fmtUSD(d.profit)) +
                            chartTipRow(CHART_TONE.accent, 'អត្រាចំណេញ', d.margin.toFixed(1) + '%') +
                            chartTipRow('#a2a2a2', 'វិក្កយបត្រ', d.tx);
                    }
                },
                series: [
                    { name: 'ថ្លៃដើម', type: 'bar', stack: 'net', barMaxWidth: 34, cursor: 'pointer',
                      data: DAYS.map(d => ({ value: +d.cost.toFixed(2), itemStyle: { color: d.date === picked ? (isDark ? '#d4d4d4' : '#a2a2a2') : (isDark ? '#545454' : CHART_TONE.slate), opacity: d.date === today ? .6 : 1 } })) },
                    { name: 'ប្រាក់ចំណេញដុល', type: 'bar', stack: 'net', barMaxWidth: 34, cursor: 'pointer',
                      itemStyle: { borderRadius: [4, 4, 0, 0] },
                      data: DAYS.map(d => ({ value: +Math.max(d.profit, 0).toFixed(2), itemStyle: { color: d.date === picked ? CHART_TONE.accentStrong : CHART_TONE.accent, opacity: d.date === today ? .6 : 1 } })) }
                ]
            });
            if (chart) {
                chart.getZr().off('click');
                chart.getZr().on('click', e => {
                    const pt = [e.offsetX, e.offsetY];
                    if (!chart.containPixel('grid', pt)) return;
                    const i = chart.convertFromPixel({ seriesIndex: 0 }, pt)[0];
                    if (DAYS[i]) pickDay(DAYS[i].date);
                });
            }
            const d = DAYS.find(x => x.date === picked) || DAYS[DAYS.length - 1];
            const cell = (label, value, tone) => `<div class="min-w-0"><p class="sm-td-sub text-slate-500">${label}</p><p class="sm-value sm-figure ${tone || 'text-slate-800'}">${value}</p></div>`;
            document.getElementById('dayDetail').innerHTML =
                cell(d.date === today ? 'ថ្ងៃនេះ (កំពុងលក់)' : fmtDate(d.date + 'T12:00'), fmtUSD(d.gross)) +
                cell('ប្រាក់ចំណេញដុល', fmtUSD(d.profit), 'text-emerald-700') +
                cell('អត្រាចំណេញ', d.margin.toFixed(1) + '%') +
                cell('វិក្កយបត្រ', `${d.tx}${d.voids ? ` <span class="sm-td-sub text-slate-400">· លុប ${d.voids}</span>` : ''}`);
        }

        function pickDay(d) {
            picked = d;
            renderChart();
        }

        // ជួរធម្មតា៖ គ្មានប្រអប់រូបតំណាងពណ៌ · ចំនួនជាលេខប្រផេះ · ក្រហមតែលើការងារបន្ទាន់ (tone rose)
        function attentionRow(icon, tone, title, note, href, count) {
            const urgent = tone === 'rose';
            return `<a href="${href}" class="group flex items-center gap-3 px-5 py-3 hover:bg-slate-50 transition">
                <i class="fas ${icon} w-4 text-center text-sm ${urgent ? 'text-rose-600' : 'text-slate-400'} flex-shrink-0"></i>
                <span class="min-w-0 flex-1"><span class="sm-value text-slate-800 block">${title}</span><span class="sm-td-sub text-slate-500 block truncate">${note}</span></span>
                ${count != null ? `<span class="sm-badge sm-figure min-w-[26px] h-[24px] px-2 rounded-md ${urgent ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-700'} font-semibold inline-flex items-center justify-center">${count}</span>` : ''}
                <i class="fas fa-chevron-right text-[11px] text-slate-300 group-hover:text-slate-500"></i>
            </a>`;
        }

        function renderAttention() {
            const rows = [];
            const pend = pendingApprovals().length;
            if (pend) rows.push(attentionRow('fa-shield-halved', 'amber', 'សំណើរង់ចាំអនុម័ត', 'លុបចោល និងប្រគល់វិញពីបញ្ជរ', '../../manager/approvals/approvals.html', pend));
            const review = mgrAwaitingReviewCount();
            if (review) rows.push(attentionRow('fa-file-signature', 'slate', 'វេនរង់ចាំត្រួតពិនិត្យ', 'បិទរួច តែមិនទាន់ចុះហត្ថលេខា', '../../manager/shifts/shifts.html', review));
            const drops = mgrPendingDropCount();
            if (drops) rows.push(attentionRow('fa-vault', 'slate', 'ប្រាក់ដាក់ទូដែកមិនទាន់ទទួល', 'ត្រូវរាប់ និងបញ្ជាក់', '../../manager/cash/cash.html', drops));
            const unconfirmedIns = typeof unconfirmedStockInCount === 'function' ? unconfirmedStockInCount() : 0;
            if (unconfirmedIns) rows.push(attentionRow('fa-truck-ramp-box', 'amber', 'ស្តុកចូលរង់ចាំបញ្ជាក់ថ្លៃដើម', 'បញ្ចូលថ្លៃដើមជាក់ស្តែងពីអ្នកផ្គត់ផ្គង់', '../stock/stock-in.html', unconfirmedIns));
            const tol = Number(posSettings().varianceTolerance) || 5;
            const week = new Set(periodDates('week'));
            const large = mgrAllShifts().filter(s => week.has(s.date)).map(s => ({ s, v: shiftVariance(s) })).filter(x => x.v && x.v.abs > tol);
            if (large.length) rows.push(attentionRow('fa-scale-unbalanced', 'rose', 'វេនខុសគ្នាលើសល្បឹមភាព', `លើស ${fmtUSD(tol)} ក្នុង 7 ថ្ងៃ · ${[...new Set(large.map(x => personName(x.s.cashierId)))].join(' ')}`, '../../manager/exceptions/exceptions.html', large.length));
            const low = sellableProducts().filter(p => marginOf(p) < 20);
            if (low.length) rows.push(attentionRow('fa-tag', 'amber', 'ទំនិញចំណេញទាប', `អត្រាក្រោម 20% · ${low.map(p => PRODUCT_SHORT[p.sku] || p.name.split(' ')[0]).slice(0, 3).join(' ')}`, '../products/products.html', low.length));
            const fx = settingsHistory().find(h => h.changes.some(c => c.key === 'fxRate'));
            if (!fx || fx.at.slice(0, 10) !== businessDate()) {
                rows.push(attentionRow('fa-money-bill-transfer', 'slate', 'អត្រាប្ដូរប្រាក់មិនទាន់ធ្វើបច្ចុប្បន្នភាពថ្ងៃនេះ', `កំពុងប្រើ ${fxRate()} រៀល · ${fx ? 'កែចុងក្រោយ ' + fmtDate(fx.at) : 'មិនដែលកែ'}`, '../settings/settings.html', null));
            }
            document.getElementById('attention').innerHTML = rows.length ? rows.join('') :
                `<div class="px-5 py-10 text-center"><p class="sm-value text-slate-700">គ្មានអ្វីរង់ចាំទេ</p><p class="sm-td-sub text-slate-500">ហាងដំណើរការធម្មតា</p></div>`;
        }

        function renderStaff(c) {
            const dates = new Set(period === 'today' ? [businessDate()] : periodDates(period));
            const rows = {};
            const row = id => rows[id] = rows[id] || { id, shifts: 0, variance: 0, counted: 0, sales: [] };
            c.now.sales.forEach(s => row(s.cashierId).sales.push(s));
            mgrAllShifts().filter(s => dates.has(s.date)).forEach(s => {
                const r = row(s.cashierId);
                r.shifts += 1;
                const v = shiftVariance(s);
                if (v) { r.variance += v.diff; r.counted += 1; }
            });
            const tol = Number(posSettings().varianceTolerance) || 5;
            const list = Object.values(rows).map(r => Object.assign(r, profitOf(r.sales))).sort((a, b) => b.gross - a.gross);
            document.getElementById('staffSub').textContent = `${PERIODS.find(p => p.id === period).label} · តម្លៃលក់រួមអាករ`;
            document.getElementById('staffRows').innerHTML = list.length ? list.map(r => `<tr>
                <td class="py-2.5 px-5 sm-td">${personChip(r.id)}<span class="sm-td-sub text-slate-400 ml-9 block -mt-1">${ROLE_NAME[roleOf(r.id)] || ''}</span></td>
                <td class="py-2.5 px-3 text-right sm-td sm-figure">${r.shifts}</td>
                <td class="py-2.5 px-3 text-right sm-td-strong sm-figure">${fmtUSD(r.gross)}</td>
                <td class="py-2.5 px-3 text-right sm-td sm-figure">${fmtUSD(r.avg)}</td>
                <td class="py-2.5 px-3 text-right sm-td sm-figure ${r.voids ? 'text-amber-700' : ''}">${r.voids}</td>
                <td class="py-2.5 px-5 text-right sm-td-strong sm-figure ${!r.counted ? 'text-slate-400' : Math.abs(r.variance) > tol ? 'text-rose-600' : 'text-slate-700'}">${r.counted ? (r.variance > 0.005 ? '+' : '') + fmtUSD(r.variance) : 'មិនទាន់រាប់'}</td>
            </tr>`).join('') : `<tr><td colspan="6">${emptyState('fa-users', 'គ្មានការលក់ក្នុងរយៈពេលនេះ', '')}</td></tr>`;
        }

        function renderTop(c) {
            const t = {};
            c.now.sales.forEach(s => {
                if (isVoided(s)) return;
                const keep = 1 - (Number(s.discountPercent) || 0) / 100;
                s.items.forEach(l => {
                    const q = l.qty - returnedQty(s, l.sku);
                    if (q <= 0) return;
                    const x = t[l.sku] = t[l.sku] || { qty: 0, net: 0, cost: 0 };
                    x.qty += q;
                    x.net += exVat(linePrice(l) * q * keep);
                    x.cost += costOf(l.sku) * q;
                });
            });
            const list = Object.keys(t).map(sku => Object.assign({ sku, profit: t[sku].net - t[sku].cost }, t[sku])).sort((a, b) => b.profit - a.profit).slice(0, 6);
            const max = Math.max(...list.map(x => x.profit), 1);
            document.getElementById('topProducts').innerHTML = list.length ? list.map((x, i) => {
                const p = getProduct(x.sku);
                return `<div class="flex items-center gap-3 px-5 py-3">
                    <span class="w-5 sm-td-sub text-slate-400 sm-figure">${i + 1}</span>
                    <span class="w-10 h-10 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">${productImgHtml(p)}</span>
                    <span class="min-w-0 flex-1">
                        <span class="sm-td-strong text-slate-800 block truncate">${p.name}</span>
                        <span class="block h-1.5 rounded-full bg-slate-100 mt-1.5 overflow-hidden"><span class="block h-full bg-blue-600" style="width:${x.profit / max * 100}%"></span></span>
                    </span>
                    <span class="text-right flex-shrink-0">
                        <span class="sm-td-strong sm-figure text-slate-800 block">${fmtUSD(x.profit)}</span>
                        <span class="sm-td-sub text-slate-500 block">${x.qty} ${p.unit} · ${(x.net ? x.profit / x.net * 100 : 0).toFixed(0)}%</span>
                    </span>
                </div>`;
            }).join('') : emptyState('fa-box-open', 'គ្មានការលក់ក្នុងរយៈពេលនេះ', '');
        }

        function renderStockKpis() {
            const stockVal = typeof totalStockValueAtCost === 'function' ? totalStockValueAtCost() : { totalValue: 0, totalUnits: 0, productCount: 0 };
            const mStart = businessDate().slice(0, 7) + '-01';
            const mEnd = businessDate();
            const shrink = typeof shrinkageStats === 'function' ? shrinkageStats({ start: mStart, end: mEnd }) : { totalValue: 0, totalQty: 0, eventsCount: 0 };
            const unconfirmed = typeof unconfirmedStockInCount === 'function' ? unconfirmedStockInCount() : 0;

            // កាតដូចទំព័រផ្សេងទៀត (kpiCard)៖ គ្មានរូបតំណាង · ពណ៌លើតួលេខបង្ហាញពេលត្រូវយកចិត្តទុកដាក់
            const card = (tone, label, value, sub, href) => `
                <a href="${href}" class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm hover:border-slate-300 transition block group min-w-0">
                    <span class="sm-kpi-label text-slate-500">${label}</span>
                    <h3 class="sm-kpi-value ${tone} mt-1 sm-figure">${value}</h3>
                    <p class="sm-kpi-sub text-slate-500 mt-1 flex items-center justify-between gap-2">
                        <span>${sub}</span>
                        <i class="fas fa-arrow-right text-[10px] text-slate-300 group-hover:text-slate-600 transition"></i>
                    </p>
                </a>
            `;
            const n = v => Number(v || 0).toLocaleString('en-US');

            document.getElementById('stockKpiRow').innerHTML =
                card('text-slate-800', 'តម្លៃស្តុកសរុប · ថ្លៃដើម', fmtUSD(stockVal.totalValue), `${n(stockVal.totalUnits)} ឯកតា · ${stockVal.productCount} មុខទំនិញ`, '../reports/stock-value.html') +
                card(unconfirmed > 0 ? 'text-amber-700' : 'text-slate-800', 'ស្តុកចូលរង់ចាំបញ្ជាក់ថ្លៃដើម', `${unconfirmed} វិក្កយបត្រ`, unconfirmed > 0 ? 'ត្រូវការបញ្ចូលថ្លៃដើម' : 'បានបញ្ជាក់រួចរាល់', '../stock/stock-in.html') +
                card(shrink.totalValue > 0 ? 'text-rose-600' : 'text-slate-800', 'ការខាតបង់ស្តុកខែនេះ', fmtUSD(shrink.totalValue), `${n(shrink.totalQty)} ឯកតា · ${shrink.eventsCount} ករណី`, '../reports/shrinkage.html');
        }

        function renderTabs() {
            document.getElementById('periodTabs').innerHTML = PERIODS.map(p => `<button type="button" onclick="period='${p.id}'; renderAll()"
                class="sm-badge h-9 px-4 rounded-lg transition ${period === p.id ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">${p.label}</button>`).join('');
        }

        function renderAll() {
            const c = current();
            renderTabs();
            document.getElementById('periodNote').textContent = c.note;
            renderKpis(c);
            renderStockKpis();
            renderChart();
            renderAttention();
            renderStaff(c);
            renderTop(c);
        }

        window.onStoreChanged = () => location.reload();
        window.onThemeChanged = renderAll;
        /* ចាប់ផ្តើមប្រើ៖ ជំហានដែលហាង ឬសាខាថ្មីត្រូវធ្វើមុនលក់បាន (startChecklist ក្នុង data.js)
           ជំហានបន្ទាប់មានប៊ូតុងចម្បងតែមួយ · ជំហានរួចមានសញ្ញាធីក · លាក់បានពេលរួចរាល់ទាំងអស់ */
        function renderSetupBanner() {
            const box = document.getElementById('setupBanner');
            const items = startChecklist();
            const done = items.filter(x => x.done).length;
            const all = done === items.length;
            if (all && (IS_DEMO_DATA || checklistHidden())) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            const next = items.find(x => !x.done);
            box.innerHTML = `<section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center gap-4">
                    <div class="min-w-0 flex-1"><p class="sm-card-title text-slate-800">${all ? 'ហាងរួចរាល់សម្រាប់លក់' : 'ចាប់ផ្តើមប្រើ'}</p>
                        <p class="sm-card-sub text-slate-500">${all ? 'គ្រប់ជំហានរួចរាល់ · អាចលាក់ផ្ទាំងនេះបាន' : `រួច ${done} ក្នុង ${items.length} ជំហាន${shopBranches().length > 1 ? ` · ${escapeText(MERCHANT.branch)}` : ''}`}</p></div>
                    <div class="w-40 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-blue-600" style="width:${done / items.length * 100}%"></div></div>
                    ${all ? '<button type="button" onclick="hideChecklist(); renderSetupBanner()" class="sm-badge h-9 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold">លាក់</button>' : ''}
                </div>
                <div class="divide-y divide-slate-100">${items.map((x, i) => {
                    const isNext = x === next;
                    return `<div class="px-5 py-3 flex items-center gap-4">
                        <span class="w-8 h-8 rounded-full border flex items-center justify-center flex-shrink-0 sm-figure font-semibold ${x.done ? 'border-slate-300 text-slate-500' : isNext ? 'border-blue-600 text-blue-700' : 'border-slate-200 text-slate-400'}">${x.done ? '<i class="fas fa-check text-[12px]"></i>' : i + 1}</span>
                        <div class="min-w-0 flex-1"><p class="sm-td ${x.done ? 'text-slate-500 line-through decoration-slate-300' : 'font-semibold text-slate-800'}">${x.title}</p>
                            ${x.done ? '' : `<p class="sm-td-sub text-slate-500">${x.note}</p>`}</div>
                        ${x.done || !x.href ? '' : isNext
                            ? `<a href="${x.href}" class="sm-badge h-9 px-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 whitespace-nowrap">${x.action} <i class="fas fa-arrow-right text-[11px]"></i></a>`
                            : `<a href="${x.href}" class="sm-td-sub font-semibold text-blue-700 hover:underline whitespace-nowrap">${x.action}</a>`}
                    </div>`;
                }).join('')}</div>
            </section>`;
        }

        /* ប្រៀបធៀបសាខា (ហាងមានសាខាច្រើន)៖ ការលក់ថ្ងៃនេះ វេនកំពុងបើក បញ្ជរ និងបុគ្គលិក តាមសាខា
           សាខាដែលកំពុងមើលប្រើទិន្នន័យពេញ (mgrAllSales) · សាខាផ្សេងអានពីការកត់ត្រារបស់សាខានោះ */
        function renderBranchCompare() {
            const box = document.getElementById('branchCompare');
            const list = shopBranches();
            box.classList.toggle('hidden', list.length < 2);
            if (list.length < 2) return;
            const today = businessDate();
            const rows = list.map(b => {
                const sum = branchTodayFor(b.id);
                return {
                    b, total: sum.total, count: sum.count, open: sum.open, regs: branchRegisters(b.id).length,
                    devices: deviceList().filter(d => d.shopId === CURRENT_SHOP_ID && (d.branchId || 'BR-01') === b.id).length,
                    staff: SHOP_STAFF.filter(p => p.active && p.role !== 'admin' && (p.branchId || 'BR-01') === b.id).length
                };
            });
            const sum = rows.reduce((n, r) => n + r.total, 0);
            box.innerHTML = `<div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
                    <div class="min-w-0"><p class="sm-card-title text-slate-800">សាខាទាំងអស់ · ថ្ងៃនេះ</p><p class="sm-card-sub text-slate-500">សរុប <span class="sm-figure">${fmtUSD(sum)}</span> · ${rows.length} សាខា · កំពុងមើល ${escapeText(MERCHANT.branch)}</p></div>
                    <a href="../branches/branches.html" class="sm-td-sub font-semibold text-blue-700 hover:underline whitespace-nowrap">គ្រប់គ្រងសាខា</a>
                </div>
                <div class="divide-y divide-slate-100">${rows.map(r => `<div class="px-5 py-3 flex flex-wrap items-center gap-x-4 gap-y-1">
                    <div class="min-w-0 flex-1 basis-[200px]"><p class="sm-td font-semibold text-slate-800 truncate">${escapeText(r.b.name)}${r.b.id === ACTIVE_BRANCH_ID ? '<span class="ml-2 sm-td-sub font-semibold text-slate-500 border border-slate-200 rounded-full px-2 py-0.5">កំពុងមើល</span>' : ''}</p>
                        <p class="sm-td-sub text-slate-500">${r.open ? `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>${r.open} វេនកំពុងបើក` : 'គ្មានវេនបើក'} · ${r.devices}/${r.regs} បញ្ជរ · ${r.staff} បុគ្គលិក</p></div>
                    <div class="text-right"><p class="sm-value sm-figure text-slate-800">${fmtUSD(r.total)}</p><p class="sm-td-sub text-slate-500">${r.count} វិក្កយបត្រ</p></div>
                    <div class="w-28 hidden sm:!block"><div class="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-blue-600" style="width:${sum ? (r.total / sum * 100).toFixed(1) : 0}%"></div></div></div>
                    ${r.b.id === ACTIVE_BRANCH_ID ? '<span class="w-[72px]"></span>' : `<button type="button" onclick="posSwitchBranch('${r.b.id}'); location.reload()" class="sm-badge h-9 px-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold whitespace-nowrap">បើកមើល</button>`}
                </div>`).join('')}</div>`;
        }

        document.addEventListener('DOMContentLoaded', () => { renderSetupBanner(); renderBranchCompare(); renderAll(); if (shopBranches().length > 1) loadBranchSummaries(renderBranchCompare); });
    </script>
</body>
</html>
