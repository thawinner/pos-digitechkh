<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - ការកំណត់ហាង</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#2563eb", 'primary-dark': "#1d4ed8", accent: "#60a5fa" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="adminPortal" data-role-root="../.." data-active="settings" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ការកំណត់ហាង"
             data-subtitle="ច្បាប់សាច់ប្រាក់ វេន ផ្ទាំងគិតលុយ អត្រាប្ដូរប្រាក់ និងមូលហេតុ"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">

            <div class="w-full grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-5 items-start">
                <!-- ម៉ឺនុយផ្នែក -->
                <nav id="sectionNav" class="lg:sticky lg:top-0 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-2 flex lg:flex-col gap-1 overflow-x-auto"></nav>
                <div class="min-w-0 space-y-5">
                    <section id="sectionBody" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm"></section>
                </div>
            </div>
        </main>
        <div id="saveBar" class="flex-shrink-0 bg-white border-t border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between gap-3" style="box-shadow: 0 -6px 16px rgba(15, 23, 42, .05)">
            <div class="min-w-0 flex items-center gap-2">
                <span id="dirtyDot" class="w-2.5 h-2.5 rounded-full bg-slate-300 flex-shrink-0"></span>
                <p id="dirtyNote" class="sm-td-sub text-slate-500 truncate">មិនមានការកែប្រែ</p>
            </div>
            <div class="flex gap-2 flex-shrink-0">
                <button id="discardBtn" onclick="resetForm()" type="button" class="sm-value h-11 px-5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold">បោះបង់</button>
                <button id="saveBtn" onclick="save()" type="button" class="sm-value h-11 px-5 rounded-xl font-semibold inline-flex items-center gap-2"><i class="fas fa-check"></i> រក្សាទុក</button>
            </div>
        </div>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/admin-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script src="../../shared/scripts/settings-page.js"></script>
</body>
</html>
