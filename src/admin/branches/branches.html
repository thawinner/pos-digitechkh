<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - សាខា</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="adminPortal" data-role-root="../.." data-active="branches" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="សាខា"
             data-subtitle="ទំនិញ តម្លៃ និងបុគ្គលិករួមគ្នា · វេន ការលក់ ស្តុក និងសាច់ប្រាក់ដាច់តាមសាខា"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <p id="usage" class="sm-td text-slate-600 px-3"></p>
                    <div class="flex items-center gap-2"><span id="limitNote" class="sm-td-sub text-slate-500 max-md:hidden"></span><span id="addHost"></span></div>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="max-md:hidden overflow-x-auto"><table class="w-full">
                        <thead><tr class="border-b border-slate-100 bg-slate-50/60">
                            <th class="sm-th py-2.5 px-5 text-left text-slate-500">សាខា</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">បញ្ជរ</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ឧបករណ៍</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">បុគ្គលិក</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">វេន</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">លក់ថ្ងៃនេះ</th>
                            <th class="sm-th py-2.5 px-5 w-16"></th>
                        </tr></thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table></div>
                    <div id="cards" class="md:hidden divide-y divide-slate-100"></div>
                </section>
                <p class="sm-td-sub text-slate-500 px-1"><i class="fas fa-circle-info mr-1 text-slate-400"></i>សាខាថ្មីចាប់ផ្តើមទទេ៖ ប្តូរទៅសាខានោះ ចុះឈ្មោះកុំព្យូទ័របញ្ជរ កំណត់បុគ្គលិកទៅសាខា ហើយទទួលស្តុក</p>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/admin-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* សាខា (ម្ចាស់ហាង) — បញ្ជី · បន្ថែម និងកែជាទំព័រពេញ (create-branch · edit-branch) · ⋮ តែមួយក្នុងជួរ */
        function stats(b) {
            const today = isoDate(new Date());
            const sales = (b.id === ACTIVE_BRANCH_ID ? liveSales() : posReadAt('pos_shift_sales', [], b.id) || []).filter(s => s.time && s.time.startsWith(today) && !isVoided(s));
            const shifts = b.id === ACTIVE_BRANCH_ID ? liveShifts() : posReadAt('pos_shifts', [], b.id) || [];
            return {
                regs: branchRegisters(b.id),
                devices: deviceList().filter(d => d.shopId === CURRENT_SHOP_ID && (d.branchId || 'BR-01') === b.id).length,
                staff: SHOP_STAFF.filter(p => p.active && p.role !== 'admin' && (p.branchId || 'BR-01') === b.id).length,
                open: shifts.filter(s => s.status === 'open').length,
                total: sales.reduce((n, s) => n + saleTotals(s.items, s.discountPercent).gross, 0)
            };
        }

        function menu(b, mid) {
            const item = (icon, label, act) => `<button type="button" onclick="closeAllFloatingDropdowns(); ${act}" class="sm-row-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-50"><i class="fas ${icon} w-4 text-center text-[13px] text-slate-400"></i>${label}</button>`;
            return `<div id="${mid}" class="hidden bg-white rounded-xl shadow-2xl border border-slate-200 p-1.5 text-left min-w-[220px]">
                ${b.id === ACTIVE_BRANCH_ID ? '' : item('fa-right-left', 'ប្តូរទៅសាខានេះ', `switchTo('${b.id}')`)}
                ${item('fa-pen', 'កែព័ត៌មានសាខា', `location.href='edit-branch.html?id=${b.id}'`)}
            </div>`;
        }

        function dots(mid) {
            return `<button onclick="toggleRowActionMenu(event, '${mid}')" type="button" aria-label="សកម្មភាព" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 inline-flex items-center justify-center"><i class="fas fa-ellipsis-vertical text-sm"></i></button>`;
        }

        function switchTo(id) {
            posSwitchBranch(id);
            flashToast(`កំពុងមើល ${branchName(id)}`);
            location.reload();
        }

        function render() {
            const list = shopBranches();
            const lim = shopLimits(CURRENT_SHOP_ID);
            const sub = shopSubscription(CURRENT_SHOP_ID) || {};
            const regsUsed = list.reduce((n, b) => n + (Number(b.registers) || 1), 0);
            const full = list.length >= lim.branches;
            document.getElementById('usage').innerHTML = `<span class="sm-figure font-semibold text-slate-800">${list.length} / ${lim.branches}</span> សាខា · <span class="sm-figure font-semibold text-slate-800">${regsUsed} / ${lim.registers}</span> បញ្ជរ · កញ្ចប់${escapeText(sub.planName || '')}`;
            document.getElementById('limitNote').textContent = full ? 'ដល់ដែនកំណត់កញ្ចប់ · ទាក់ទង DIGITECHKH ដើម្បីប្តូរកញ្ចប់' : '';
            document.getElementById('addHost').innerHTML = full
                ? '<button type="button" disabled class="sm-badge h-9 px-3.5 rounded-xl bg-slate-100 text-slate-400 font-semibold inline-flex items-center gap-2 cursor-not-allowed whitespace-nowrap"><i class="fas fa-plus"></i> បន្ថែមសាខា</button>'
                : '<button type="button" onclick="location.href=\'create-branch.html\'" class="sm-badge h-9 px-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 whitespace-nowrap"><i class="fas fa-plus"></i> បន្ថែមសាខា</button>';
            const here = b => b.id === ACTIVE_BRANCH_ID ? '<span class="ml-2 sm-td-sub font-semibold text-slate-500 border border-slate-200 rounded-full px-2 py-0.5">កំពុងមើល</span>' : '';
            const rows = list.map(b => ({ b, s: stats(b) }));
            document.getElementById('rows').innerHTML = rows.map(({ b, s }) => `<tr data-row-id="${b.id}" class="hover:bg-slate-50 transition">
                <td class="py-2.5 px-5"><p class="sm-td-strong text-slate-800">${escapeText(b.name)}${here(b)}</p><p class="sm-td-sub text-slate-400">${[escapeText(b.address || ''), b.phone ? `<span class="sm-figure">${escapeText(b.phone)}</span>` : ''].filter(Boolean).join(' · ') || 'មិនទាន់មានអាសយដ្ឋាន'}</p></td>
                <td class="py-2.5 px-3 sm-td sm-figure text-slate-700">${s.regs[0]}${s.regs.length > 1 ? `–${s.regs[s.regs.length - 1]}` : ''}</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${s.devices} / ${s.regs.length}</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${s.staff}</td>
                <td class="py-2.5 px-3 sm-td text-slate-700">${s.open ? `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>${s.open} កំពុងបើក` : '<span class="text-slate-400">គ្មាន</span>'}</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right font-medium text-slate-800">${fmtUSD(s.total)}</td>
                <td class="py-2.5 px-5 text-right">${dots('m-' + b.id)}${menu(b, 'm-' + b.id)}</td>
            </tr>`).join('');
            document.getElementById('cards').innerHTML = rows.map(({ b, s }) => `<div data-row-id="${b.id}" class="p-4 flex items-start gap-3">
                <div class="min-w-0 flex-1"><p class="sm-value text-slate-800">${escapeText(b.name)}${here(b)}</p>
                    <p class="sm-td-sub text-slate-500 sm-figure">${s.regs.join(' ')} · ${s.devices} ឧបករណ៍ · ${s.staff} បុគ្គលិក</p>
                    <p class="sm-td-sub text-slate-500">ថ្ងៃនេះ <span class="sm-figure">${fmtUSD(s.total)}</span>${s.open ? ` · ${s.open} វេនកំពុងបើក` : ''}</p></div>
                ${dots('c-' + b.id)}${menu(b, 'c-' + b.id)}
            </div>`).join('');
        }

        window.onStoreChanged = render;
        document.addEventListener('DOMContentLoaded', () => { render(); flashViewedRow(); });
    </script>
</body>
</html>
