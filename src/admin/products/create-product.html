<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - បន្ថែមទំនិញ</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="adminPortal" data-role-root="../.." data-active="products" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បន្ថែមទំនិញ"
             data-subtitle="ទំនិញថ្មីលក់បានភ្លាមនៅគ្រប់សាខា · ថ្លៃដើមមានតែម្ចាស់ហាងឃើញ" data-back="products.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <form id="form" onsubmit="return submitForm(event)" novalidate class="w-full grid gap-5 xl:grid-cols-3">
                <div class="xl:col-span-2 space-y-5">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">ទំនិញ</h3><p class="sm-card-sub text-slate-500">ឈ្មោះ ប្រភេទ និងលេខកូដដែលអ្នកគិតលុយស្កេន ឬស្វែងរក</p></div>
                        <div class="px-5 py-5 grid gap-x-4 md:grid-cols-2">
                            <div class="md:col-span-2 mb-4"><span class="sm-td font-semibold text-slate-700">ប្រភេទ</span>
                                <div id="catPick" class="mt-1.5 flex flex-wrap gap-1.5"></div></div>
                            <label class="block md:col-span-2"><span class="sm-td font-semibold text-slate-700">ឈ្មោះទំនិញ</span>
                                <input id="name" type="text"  placeholder="ឧ. នំប៉័ងបារាំង" class="f-input mt-1.5"><span id="nameErr" class="f-err"></span></label>
                            <label class="block "><span class="sm-td font-semibold text-slate-700">ឯកតា</span>
                                <input id="unit" type="text"  placeholder="ឧ. ដប កញ្ចប់ ពែង" class="f-input mt-1.5"><span id="unitErr" class="f-err"></span></label>
                            <label class="block "><span class="sm-td font-semibold text-slate-700">លេខកូដ</span>
                                <input id="barcode" type="text" inputmode="numeric" placeholder="" class="f-input mt-1.5"><span id="barcodeErr" class="f-err"></span><span class="block sm-td-sub text-slate-500 -mt-1 mb-2">ស្កេនបាកូដលើទំនិញ ឬប្រើលេខដែលបានស្នើ</span></label>
                        </div>
                    </section>
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">តម្លៃ</h3><p class="sm-card-sub text-slate-500">តម្លៃលក់រួមអាករ 10% · ថ្លៃដើមមិនរួមអាករ</p></div>
                        <div class="px-5 py-5 grid gap-x-4 md:grid-cols-2">
                            <label class="block "><span class="sm-td font-semibold text-slate-700">តម្លៃលក់ ($)</span>
                                <input id="price" type="text" inputmode="decimal" placeholder="ឧ. 0.50" class="f-input mt-1.5"><span id="priceErr" class="f-err"></span></label>
                            <label class="block "><span class="sm-td font-semibold text-slate-700">ថ្លៃដើម ($)</span>
                                <input id="cost" type="text" inputmode="decimal" placeholder="ឧ. 0.25" class="f-input mt-1.5"><span id="costErr" class="f-err"></span><span class="block sm-td-sub text-slate-500 -mt-1 mb-2">បើមិនដឹង វាយ 0 ហើយកែពេលក្រោយ</span></label>
                            <div id="margin" class="md:col-span-2"></div>
                        </div>
                    </section>
                </div>
                <div class="space-y-5">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">ស្តុក</h3><p class="sm-card-sub text-slate-500">ចំនួនដែលរាប់បានក្នុងហាងពេលនេះ</p></div>
                        <div class="px-5 py-5">
                            <label class="block "><span class="sm-td font-semibold text-slate-700">ស្តុកមានឥឡូវ</span>
                                <input id="qty" type="text" inputmode="numeric" placeholder="0" class="f-input mt-1.5"><span id="qtyErr" class="f-err"></span></label>
                            <p id="branchNote" class="sm-td-sub text-slate-500 -mt-1"></p>
                        </div>
                    </section>
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm px-5 py-4">
                        <button type="submit" class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white sm-td font-semibold inline-flex items-center justify-center gap-2"><i class="fas fa-plus"></i> បន្ថែមទំនិញ</button>
                    </section>
                </div>
            </form>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/admin-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* បន្ថែមទំនិញ (ផែនការ P2-02) — ទំព័រពេញ មិនមែនផ្ទាំងលោត (.ai/ui-rules §2)
           ទំនិញរក្សាក្នុង pos_products របស់ហាង (រួមគ្រប់សាខា) · ថ្លៃដើមក្នុង pos_costs · ស្តុកដំបូងជាការរាប់ស្តុកនៃសាខាដែលកំពុងប្រើ */
        function setErr(id, msg) {
            document.getElementById(id).classList.toggle('is-error', !!msg);
            document.getElementById(id + 'Err').textContent = msg || '';
            return msg ? 1 : 0;
        }
        function val(id) { return document.getElementById(id).value.trim(); }
        function wireInputs(onChange) {
            document.querySelectorAll('.f-input').forEach(i => i.addEventListener('input', () => { setErr(i.id, ''); if (onChange) onChange(); }));
        }
        const CAT_PREFIX = { drink: '885', snack: '886', household: '887', stationery: '888', electronic: '889' };
        let cat = 'snack';

        function money(v) {
            const n = Number(String(v).replace(/[$,\s]/g, ''));
            return v !== '' && isFinite(n) ? Math.round(n * 100) / 100 : NaN;
        }

        function suggestBarcode(category) {
            const prefix = CAT_PREFIX[category] || '880';
            const used = PRODUCTS.filter(p => p.sku.startsWith(prefix + '1')).map(p => Number(p.sku.slice(3)) || 0);
            return `${prefix}${Math.max(1000, ...used) + 1}`;
        }

        function renderCats() {
            document.getElementById('catPick').innerHTML = CATEGORIES.filter(c => c.id !== 'all').map(c => `<button type="button" onclick="pickCat('${c.id}')"
                class="sm-badge h-10 px-3.5 rounded-xl border transition inline-flex items-center gap-2 ${cat === c.id ? 'bg-blue-600 border-blue-600 text-white font-semibold' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}"><i class="fas ${c.icon} text-[13px] ${cat === c.id ? '' : 'text-slate-400'}"></i>${c.label}</button>`).join('');
        }

        function pickCat(id) {
            const bc = document.getElementById('barcode');
            if (!bc.value || bc.value === suggestBarcode(cat)) bc.value = suggestBarcode(id);
            cat = id;
            renderCats();
        }

        function renderMargin() {
            const price = money(val('price')), cost = money(val('cost'));
            const box = document.getElementById('margin');
            if (!(price > 0) || !(cost >= 0)) { box.innerHTML = ''; return; }
            const net = exVat(price), m = (net - cost) / net * 100;
            const tone = m < 0 ? 'text-rose-600' : m < 20 ? 'text-amber-700' : 'text-slate-800';
            box.innerHTML = `<div class="rounded-xl border border-slate-200 px-4 py-3 grid grid-cols-3 gap-2">
                <div><p class="sm-td-sub text-slate-500">មិនរួមអាករ</p><p class="sm-value sm-figure text-slate-800">${fmtUSD(net)}</p></div>
                <div><p class="sm-td-sub text-slate-500">ចំណេញ/ឯកតា</p><p class="sm-value sm-figure ${tone}">${fmtUSD(net - cost)}</p></div>
                <div><p class="sm-td-sub text-slate-500">អត្រាចំណេញ</p><p class="sm-value sm-figure ${tone}">${m.toFixed(1)}%</p></div>
            </div>${m < 0 ? '<p class="sm-td-sub text-rose-600 mt-1.5">តម្លៃនេះលក់ខាតដើម</p>' : ''}`;
        }

        function submitForm(e) {
            e.preventDefault();
            const name = val('name'), unit = val('unit'), code = val('barcode');
            const price = money(val('price')), cost = money(val('cost')), qty = Number(val('qty') || 0);
            let bad = 0;
            bad += setErr('name', name.length < 2 ? 'សូមវាយឈ្មោះទំនិញ' : PRODUCTS.some(p => p.name === name) ? 'មានទំនិញឈ្មោះនេះរួចហើយ' : '');
            bad += setErr('unit', !unit ? 'សូមវាយឯកតា' : '');
            bad += setErr('barcode', !/^\d{6,14}$/.test(code) ? 'លេខកូដត្រូវជាលេខ 6 ដល់ 14 ខ្ទង់' : PRODUCTS.some(p => p.sku === code || p.barcode === code) ? 'លេខកូដនេះមានទំនិញប្រើរួចហើយ' : '');
            bad += setErr('price', !(price > 0) ? 'សូមបញ្ចូលតម្លៃលក់' : price > 1000 ? 'តម្លៃខ្ពស់ពេក · សូមពិនិត្យម្តងទៀត' : '');
            bad += setErr('cost', !(cost >= 0) ? 'សូមបញ្ចូលថ្លៃដើម (0 បើមិនដឹង)' : '');
            bad += setErr('qty', !(Number.isInteger(qty) && qty >= 0) ? 'ស្តុកត្រូវជាលេខគត់ 0 ឡើងទៅ' : '');
            if (bad) { document.querySelector('.f-input.is-error').focus(); return false; }
            const product = { sku: code, barcode: code, name, category: cat, price, unit, opening: 0,
                icon: (CATEGORIES.find(c => c.id === cat) || {}).icon || 'fa-box', tone: 'slate', addedAt: isoLocal(new Date()) };
            posWrite(PRODUCTS_KEY, (posRead(PRODUCTS_KEY, []) || []).concat([product]));
            setCost(code, cost, `បន្ថែមទំនិញ ${name} · ${fmtUSD(price)} · ថ្លៃដើម ${fmtUSD(cost)}`);
            // ស្តុកដំបូង = ការរាប់ស្តុកនៃសាខាដែលកំពុងប្រើ (សាខាផ្សេងចាប់ផ្តើមពី 0)
            if (qty > 0) saveStockMoves([stockMove({ type: 'count', sku: code, qty, note: 'ស្តុកដំបូងពេលបន្ថែមទំនិញ' })]);
            markRecordViewed(code);
            flashToast(`បានបន្ថែម ${name} · អ្នកគិតលុយលក់បានភ្លាម`);
            location.href = 'products.html';
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCats();
            document.getElementById('barcode').value = suggestBarcode(cat);
            document.getElementById('qty').value = '0';
            document.getElementById('branchNote').textContent = shopBranches().length > 1
                ? `ស្តុកនេះសម្រាប់ ${MERCHANT.branch} · សាខាផ្សេងចាប់ផ្តើមពី 0` : '';
            wireInputs(renderMargin);
            document.getElementById('name').focus();
        });
    </script>
</body>
</html>
