<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - បុគ្គលិក</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#2563eb", 'primary-dark': "#1d4ed8", accent: "#60a5fa" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="adminPortal" data-role-root="../.." data-active="staff" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បុគ្គលិក"
             data-subtitle="តួនាទី លេខសម្ងាត់ ប្រាក់ខែ និងសិទ្ធិបញ្ចុះតម្លៃ"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">

            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <div id="roleTabs" class="flex flex-wrap gap-1"></div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <label class="relative flex-1 sm:w-[220px]">
                            <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input id="search" oninput="renderList()" type="text" placeholder="ស្វែងរកឈ្មោះ ឬលេខសម្គាល់"
                                class="sm-td w-full h-9 pl-8 pr-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none">
                        </label>
                        <a href="../reports/payroll.html" class="sm-badge h-9 px-3.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold inline-flex items-center gap-2 whitespace-nowrap"><i class="fas fa-money-bill-wave text-slate-500"></i> បើកប្រាក់បៀវត្សរ៍</a>
                        <button onclick="addPerson()" type="button" class="sm-badge h-9 px-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 whitespace-nowrap"><i class="fas fa-plus"></i> បន្ថែមបុគ្គលិក</button>
                    </div>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="max-md:hidden overflow-x-auto"><table class="w-full">
                        <thead><tr class="border-b border-slate-100 bg-slate-50/60">
                            <th class="sm-th py-2.5 px-5 text-left text-slate-500">បុគ្គលិក</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">តួនាទី</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ប្រាក់ខែគោល</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">វេនប្រចាំ</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">បញ្ចុះតម្លៃបាន</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">វេនចុងក្រោយ</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">ស្ថានភាព</th>
                            <th class="sm-th py-2.5 px-5 w-16"></th>
                        </tr></thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table></div>
                    <div id="cards" class="md:hidden divide-y divide-slate-100"></div>
                    <div id="empty" class="hidden"></div>
                </section>
                <p class="sm-td-sub text-slate-500 px-1"><i class="fas fa-circle-info mr-1 text-slate-400"></i>វេនប្រចាំ និងថ្ងៃឈប់សម្រាក កំណត់នៅទំព័រ <a href="../../manager/roster/roster.html" class="text-blue-700 font-semibold hover:underline">កាលវិភាគវេន</a> · គណនីដែលផ្អាកមិនអាចចូលប្រើបាន តែឈ្មោះនៅតែមានក្នុងប្រវត្តិ</p>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/admin-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script src="../../shared/scripts/staff-actions.js"></script>
    <script>

        /* បុគ្គលិក និងសិទ្ធិ (ឯកសាររចនាលេខ 03 ផ្នែក 5) — មានតែម្ចាស់ហាងប៉ុណ្ណោះដែលបន្ថែម ប្តូរតួនាទី ឬផ្អាកគណនី
           សកម្មភាពលើបុគ្គលិកម្នាក់ៗនៅក្នុង staff-actions.js (ប្រើរួមជាមួយទំព័រមើលបុគ្គលិក) */

        const TABS = [
            { id: 'all', label: 'ទាំងអស់' },
            { id: 'cashier', label: 'អ្នកគិតលុយ' },
            { id: 'manager', label: 'អ្នកគ្រប់គ្រង' },
            { id: 'admin', label: 'ម្ចាស់ហាង' },
            { id: 'inactive', label: 'បានផ្អាក' }
        ];
        let tab = 'all';
        let listReady = false; // រក្សាទុកតម្រងបន្ទាប់ពីស្តារឡើងវិញរួចប៉ុណ្ណោះ

        function lastShift(p) {
            const s = mgrAllShifts().filter(x => x.cashierId === p.id).sort((a, b) => b.openedAt.localeCompare(a.openedAt))[0];
            if (!s) return '<span class="text-slate-400">—</span>';
            return `<span class="text-slate-700 sm-figure">${fmtDate(s.openedAt)}</span><span class="block sm-td-sub text-slate-400">${s.register}${s.status === 'open' ? ' · កំពុងបើក' : ''}</span>`;
        }

        function limitText(p) {
            return p.role === 'cashier' ? `<span class="sm-figure">${discountLimitFor(p.id)}%</span>` : '<span class="text-slate-400">គ្មានដែនកំណត់</span>';
        }

        /* ម្ចាស់ហាងមិនមានប្រាក់ខែ */
        function salaryCell(p) {
            if (!staffOnPayroll(p)) return '<span class="text-slate-400">—</span>';
            const comp = getStaffCompensation(p.id);
            return `<span class="sm-figure font-medium text-slate-800">${fmtUSD(Number(comp.baseSalaryUSD) || 0)}</span>
                <span class="block sm-td-sub text-slate-400 sm-figure">${fmtUSD(comp.hourlyRateUSD)} / ម៉ោង</span>`;
        }

        function dotsBtn(mid) {
            return `<button onclick="toggleRowActionMenu(event, '${mid}')" type="button" aria-label="សកម្មភាព" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 inline-flex items-center justify-center"><i class="fas fa-ellipsis-vertical text-sm"></i></button>`;
        }

        function visible() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            return loadStaff().filter(p => tab === 'inactive' ? !p.active : (p.active && (tab === 'all' || p.role === tab)))
                .filter(p => !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q))
                .sort((a, b) => ['admin', 'manager', 'cashier'].indexOf(a.role) - ['admin', 'manager', 'cashier'].indexOf(b.role) || a.id.localeCompare(b.id));
        }

        function setTab(id) {
            tab = id;
            renderAll();
        }

        function renderTabs() {
            const all = loadStaff();
            const count = id => id === 'inactive' ? all.filter(p => !p.active).length : all.filter(p => p.active && (id === 'all' || p.role === id)).length;
            document.getElementById('roleTabs').innerHTML = TABS.map(t => `<button type="button" onclick="setTab('${t.id}')"
                class="sm-badge h-9 px-3.5 rounded-xl transition inline-flex items-center gap-2 ${tab === t.id ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">${t.label}
                <span class="text-[12px] sm-figure ${tab === t.id ? 'text-blue-100' : 'text-slate-400'}">${count(t.id)}</span></button>`).join('');
        }

        function renderList() {
            if (listReady) saveListState('staff', { tab, q: document.getElementById('search').value });
            const list = visible();
            const empty = document.getElementById('empty');
            empty.classList.toggle('hidden', !!list.length);
            empty.innerHTML = list.length ? '' : emptyState('fa-users', tab === 'inactive' ? 'គ្មានគណនីដែលបានផ្អាក' : 'រកមិនឃើញបុគ្គលិក', 'សូមសាកល្បងពាក្យស្វែងរកផ្សេង');
            const me = id => id === ME_MANAGER ? '<span class="sm-badge ml-1.5 px-1.5 rounded bg-slate-100 text-slate-600">លោកអ្នក</span>' : '';
            // ចុចលើជួរ = មើលព័ត៌មាន · ប៊ូតុង ⋮ នៅតែបើកម៉ឺនុយ
            const open = id => `onclick="if (!event.target.closest('button, a')) openStaff('${id}')"`;
            document.getElementById('rows').innerHTML = list.map(p => `<tr data-row-id="${p.id}" ${open(p.id)} class="cursor-pointer hover:bg-slate-50 transition ${p.active ? '' : 'bg-slate-50/50'}">
                    <td class="py-2.5 px-5"><div class="flex items-center gap-3 min-w-0">${staffAvatar(p)}<div class="min-w-0"><p class="sm-td-strong text-slate-800 truncate">${p.name}${me(p.id)}</p><p class="sm-td-sub text-slate-400 sm-figure">${p.id}</p></div></div></td>
                    <td class="py-2.5 px-3"><span class="sm-badge inline-flex px-2.5 py-0.5 rounded-full border bg-slate-50 text-slate-700 border-slate-200">${ROLE_NAME[p.role]}</span></td>
                    <td class="py-2.5 px-3 sm-td text-right">${salaryCell(p)}</td>
                    <td class="py-2.5 px-3 sm-td">${staffShiftText(p)}</td>
                    <td class="py-2.5 px-3 sm-td text-right">${limitText(p)}</td>
                    <td class="py-2.5 px-3 sm-td">${lastShift(p)}</td>
                    <td class="py-2.5 px-3">${staffStatusChip(p)}</td>
                    <td class="py-2.5 px-5 text-right">${dotsBtn('m-' + p.id)}${staffMenu(p, 'm-' + p.id, true)}</td>
                </tr>`).join('');
            document.getElementById('cards').innerHTML = list.map(p => `<div data-row-id="${p.id}" ${open(p.id)} class="p-4 flex items-start gap-3 cursor-pointer">
                    ${staffAvatar(p, 'w-10 h-10')}
                    <div class="min-w-0 flex-1">
                        <p class="sm-value text-slate-800 truncate">${p.name}${me(p.id)}</p>
                        <p class="sm-td-sub text-slate-500">${ROLE_NAME[p.role]} · ${p.id}${staffOnPayroll(p) ? ` · <span class="sm-figure">${fmtUSD(Number(getStaffCompensation(p.id).baseSalaryUSD) || 0)} / ខែ</span>` : ''}${p.role === 'cashier' ? ` · បញ្ចុះបាន ${discountLimitFor(p.id)}%` : ''}</p>
                        <div class="mt-1.5">${staffStatusChip(p)}</div>
                    </div>
                    ${dotsBtn('c-' + p.id)}${staffMenu(p, 'c-' + p.id, true)}
                </div>`).join('');
        }

        function renderAll() {
            renderTabs();
            renderList();
        }

        async function addPerson() {
            const role = await showOptionDialog({
                title: 'បន្ថែមបុគ្គលិក',
                message: 'ជ្រើសតួនាទី · អាចប្តូរនៅពេលក្រោយ',
                options: ['cashier', 'manager', 'admin'].map(r => ({ value: r, label: ROLE_NAME[r], desc: ROLE_DESC[r], icon: ROLE_ICON[r] }))
            });
            if (!role) return;
            const v = await showFormDialog({
                title: `${ROLE_NAME[role]}ថ្មី`,
                icon: 'fa-user-plus',
                message: 'ពាក្យសម្ងាត់ និងលេខសម្ងាត់ត្រូវបង្កើតដោយស្វ័យប្រវត្តិ អាចកែបាន',
                fields: [
                    { key: 'name', label: 'ឈ្មោះពេញ', value: '' },
                    { key: 'phone', label: 'លេខទូរស័ព្ទ', value: '', hint: 'ប្រើសម្រាប់ចូលប្រើ · ឧ. 012 345 678' },
                    { key: 'email', label: 'អ៊ីមែល', value: '', hint: 'មិនចាំបាច់' },
                    { key: 'password', label: 'ពាក្យសម្ងាត់ចូលប្រើ', value: randomPassword(), hint: 'យ៉ាងតិច 6 តួ មានអក្សរ និងលេខ' },
                    { key: 'pin', label: 'លេខសម្ងាត់អនុម័ត', value: randomPin(), type: 'pin', hint: 'លេខ 4 ដល់ 6 ខ្ទង់ · សម្រាប់អនុម័ត និងដោះសោផ្ទាំងគិតលុយ' }
                ].concat(role === 'cashier' ? [{ key: 'limit', label: 'បញ្ចុះតម្លៃបានដោយខ្លួនឯងរហូតដល់', value: '3', type: 'number', suffix: '%' }] : []),
                confirmText: 'បន្ថែម',
                validate: x => nameError(x.name) || accountError(x.phone.trim(), x.email.trim()) || passwordError(x.password) || pinError(x.pin) || (role === 'cashier' && !(Number(x.limit) >= 0 && Number(x.limit) <= 20) ? 'ដែនកំណត់បញ្ចុះតម្លៃត្រូវនៅចន្លោះ 0 ដល់ 20%' : '')
            });
            if (!v) return;
            const person = { id: nextStaffId(role), name: v.name, initials: initialsOf(v.name), pin: v.pin, role,
                phone: v.phone.trim(), email: v.email.trim().toLowerCase(), password: v.password };
            addStaff(person);
            if (role === 'cashier') {
                const limits = clone(posSettings().discountLimits || {});
                limits[person.id] = Number(v.limit);
                savePosSettings({ discountLimits: limits }, ME_MANAGER);
            }
            tab = role;
            renderAll();
            showToast(`បានបន្ថែម ${person.name}`);
            await showNewPassword(person, v.password);
            await showNewPin(person, v.pin);
        }

        function init() {
            const saved = loadListState('staff') || {};
            if (TABS.some(t => t.id === saved.tab)) tab = saved.tab;
            if (saved.q) document.getElementById('search').value = saved.q;
            listReady = true;
            renderAll();
            flashViewedRow();
        }

        window.onStoreChanged = renderAll;
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
