<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH POS - ចូលប្រើ</title>
    <link rel="icon" type="image/png" href="shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: "#0891b2", 'primary-dark': "#0e7490" }, fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] } } }
        }
    </script>
    <link rel="stylesheet" href="shared/styles/custom.css">
    <link rel="stylesheet" href="shared/styles/portal.css">
    <style>
        .login-bg { background: #0b1220; }
        .clock-big { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
        .pin-key { height: 56px; font-size: 22px !important; font-weight: 600 !important; font-variant-numeric: tabular-nums; }
        .kbd { display: inline-flex; align-items: center; min-width: 22px; height: 22px; padding: 0 6px; border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 5px; background: #fff; color: #475569; font-size: 12px !important; font-weight: 600; justify-content: center; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .shake { animation: shake .35s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .fade-up { animation: fadeUp .22s ease; }
        @keyframes dotPop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .dot-pop { animation: dotPop .16s ease-out; }
        .tile-live { box-shadow: inset 3px 0 0 #10b981; }
        .tile:focus-visible, .pin-key:focus-visible { outline: 3px solid #22d3ee; outline-offset: 2px; }
    </style>
</head>
<body id="loginPortal" data-role-root="." class="login-bg min-h-screen font-sans text-slate-100 text-[16px]">

    <main class="min-h-screen w-full flex items-center justify-center px-4 py-6">
        <div class="w-full max-w-[1120px] grid grid-cols-1 lg:grid-cols-12 gap-4">

            <!-- ===== ផ្ទាំងឆ្វេង៖ ម៉ាក នាឡិកា និងស្ថានភាពបញ្ជរ ===== -->
            <section class="lg:col-span-4 max-lg:order-2 rounded-xl bg-[#111a2b] border border-white/10 p-6 flex flex-col gap-5">
                <div class="flex items-center gap-3">
                    <img src="shared/assets/logo-mark-transparent.png" alt="DIGITECHKH" class="w-11 h-11 object-contain">
                    <div>
                        <p class="sm-card-title text-white text-[19px] tracking-wide">DIGITECHKH</p>
                        <p class="sm-td-sub text-cyan-200/80">ប្រព័ន្ធគិតលុយលក់រាយ</p>
                    </div>
                </div>

                <div>
                    <p id="clockBig" class="clock-big text-white"></p>
                    <p id="dateBig" class="sm-td-sub text-slate-300 mt-2"></p>
                    <p class="sm-td-sub text-slate-400 mt-1"><i class="fas fa-location-dot mr-1.5 text-cyan-300"></i><span id="branchLabel"></span></p>
                </div>

                <div>
                    <p class="sm-eyebrow text-slate-400 mb-2">ស្ថានភាពបញ្ជរ</p>
                    <div id="registerBoard" class="rounded-xl border border-white/10 divide-y divide-white/10 overflow-hidden"></div>
                </div>

                <div>
                    <p class="sm-eyebrow text-slate-400 mb-2">កាលវិភាគថ្ងៃនេះ</p>
                    <div id="rosterBoard" class="space-y-2.5"></div>
                </div>

                <div class="mt-auto">
                    <button onclick="toggleDemo()" type="button" class="w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-lg border border-dashed border-white/15 text-slate-300 hover:bg-white/5 hover:text-white transition">
                        <span class="sm-td-sub inline-flex items-center gap-2"><i class="fas fa-flask"></i> ព័ត៌មានសម្រាប់គំរូសាកល្បង</span>
                        <i id="demoChevron" class="fas fa-chevron-down text-xs transition-transform"></i>
                    </button>
                    <div id="demoBox" class="hidden mt-2 rounded-xl bg-black/30 border border-white/10 p-4">
                        <div id="demoPins" class="space-y-1.5"></div>
                        <button onclick="resetDemo()" type="button"
                            class="mt-3 w-full sm-badge px-3 py-2.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-semibold transition inline-flex items-center justify-center gap-2">
                            <i class="fas fa-rotate-left"></i> កំណត់ទិន្នន័យគំរូឡើងវិញ
                        </button>
                    </div>
                </div>
            </section>

            <!-- ===== ផ្ទាំងស្តាំ៖ ជំហានទី 1 ជ្រើសរើសអ្នកប្រើ · ជំហានទី 2 វាយលេខសម្ងាត់ ===== -->
            <section class="lg:col-span-8 rounded-xl bg-white text-slate-800 overflow-hidden flex flex-col">
                <!-- របារជំហានរួម (bmsStepper ក្នុង portal.js) — ដូចទំព័របើក និងបិទវេន -->
                <div class="px-6 sm:px-12 pt-4 pb-3 border-b border-slate-100">
                    <div id="loginStepper" class="max-w-2xl mx-auto"></div>
                </div>
                <div id="stepPick" class="flex-1 flex flex-col px-6 sm:px-8 py-6 fade-up">
                    <div class="flex flex-wrap items-end justify-between gap-3">
                        <div>
                            <h1 class="text-[22px] leading-tight font-semibold text-slate-900">តើលោកអ្នកជានរណា?</h1>
                            <p class="sm-td-sub text-slate-500 mt-1">ចុចលើឈ្មោះ ហើយវាយលេខសម្ងាត់ផ្ទាល់ខ្លួន</p>
                        </div>
                        <div id="lastUser"></div>
                    </div>

                    <div class="mt-5">
                        <div class="flex items-baseline gap-2 mb-2">
                            <i class="fas fa-cash-register text-[13px] text-slate-400 self-center"></i>
                            <p class="sm-td font-semibold text-slate-700">អ្នកគិតលុយ</p>
                            <span id="cashierTilesCount" class="sm-td-sub text-slate-400"></span>
                            <span class="sm-td-sub text-slate-400 ml-auto max-sm:hidden">បញ្ជរតាមកាលវិភាគវេន</span>
                        </div>
                        <div id="cashierTiles" class="rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden"></div>
                    </div>
                    <div class="mt-5">
                        <div class="flex items-baseline gap-2 mb-2">
                            <i class="fas fa-user-shield text-[13px] text-slate-400 self-center"></i>
                            <p class="sm-td font-semibold text-slate-700">អ្នកគ្រប់គ្រងវេន</p>
                            <span id="managerTilesCount" class="sm-td-sub text-slate-400"></span>
                            <span class="sm-td-sub text-slate-400 ml-auto max-sm:hidden">ផ្ទាំងគ្រប់គ្រង · អាចប្តូរទៅលក់បាន</span>
                        </div>
                        <div id="managerTiles" class="rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden"></div>
                    </div>
                    <div class="mt-5">
                        <div class="flex items-baseline gap-2 mb-2">
                            <i class="fas fa-crown text-[13px] text-slate-400 self-center"></i>
                            <p class="sm-td font-semibold text-slate-700">ម្ចាស់ហាង</p>
                            <span id="adminTilesCount" class="sm-td-sub text-slate-400"></span>
                            <span class="sm-td-sub text-slate-400 ml-auto max-sm:hidden">ប្រាក់ចំណេញ បុគ្គលិក និងតម្លៃទំនិញ</span>
                        </div>
                        <div id="adminTiles" class="rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden"></div>
                    </div>
                </div>

                <div id="stepPin" class="hidden flex-1 flex flex-col px-6 sm:px-8 py-6"></div>
            </section>
        </div>
    </main>

    <script src="shared/scripts/ui-components.js"></script>
    <script src="shared/scripts/data.js"></script>
    <script src="shared/scripts/portal.js"></script>
    <script>
        /* ទំព័រចូលប្រើ — គ្មានម៉ាស៊ីនមេទេ ដូច្នេះលេខសម្ងាត់ផ្ទៀងផ្ទាត់ក្នុងកម្មវិធីរុករក (គំរូសាកល្បងប៉ុណ្ណោះ)
           ជំហានទី 1៖ ជ្រើសរើសមនុស្ស · ជំហានទី 2៖ ផ្ទាំងលេខធំៗនៅលើផ្ទាំងដដែល (មិនមែនផ្ទាំងលោត)
           ដូចឧបករណ៍គិតលុយពិត ដែលអ្នកគិតលុយចូលប្រើដោយប៉ះ មិនមែនវាយឈ្មោះអ្នកប្រើ */

        const LOGIN_STEPS = [
            { n: 1, label: 'ជ្រើសរើសអ្នកប្រើ', icon: 'fa-user-group' },
            { n: 2, label: 'វាយលេខសម្ងាត់', icon: 'fa-key' },
            { n: 3, label: 'ចូលប្រើ', icon: 'fa-right-to-bracket' }
        ];

        function renderStepper(current) {
            bmsStepper('loginStepper', {
                steps: LOGIN_STEPS,
                current,
                variant: 'icon',
                size: 'md',
                tone: 'amber',
                doneTone: 'brand',
                onStep: n => { if (n === 1 && current === 2) backToPick(); }
            });
        }

        let pinUser = null;
        let pin = '';
        let pinMsg = '';
        let lockTick = null;

        function openShiftOf(id) {
            return liveShifts().find(s => s.status === 'open' && s.cashierId === id) || null;
        }

        /* វេនរបស់បុគ្គលិកក្នុងថ្ងៃធ្វើការបច្ចុប្បន្ន (វេនណាក៏បាន មិនមែនតែវេនឥឡូវ) */
        function todayPlan(id) {
            const slot = rosterSlotNow();
            if (!slot) return null;
            for (const t of shiftTemplates()) {
                const a = rosterFor(slot.date, t.code).find(x => x.cashierId === id);
                if (a) return Object.assign({ template: t, now: t.code === slot.template.code }, a);
            }
            return null;
        }

        function tile(p, role) {
            const sh = openShiftOf(p.id);
            const plan = sh ? null : todayPlan(p.id);
            const reg = sh ? sh.register : plan ? plan.register : '';
            const status = sh
                ? '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-2 align-middle"></span><span class="text-emerald-700 font-semibold">កំពុងលក់</span>'
                : plan
                    ? `<i class="${plan.now ? 'fas fa-calendar-check text-cyan-600' : 'far fa-clock text-slate-400'} text-[12px] mr-2"></i><span class="${plan.now ? 'text-slate-700' : 'text-slate-500'}">${plan.template.name}<span class="max-md:hidden"> ${plan.template.start}–${plan.template.end}</span></span>`
                    : (role === 'cashier' ? '<span class="text-slate-400">ឈប់សម្រាកថ្ងៃនេះ</span>' : '');
            return `<button onclick="pickUser('${p.id}')" type="button"
                class="tile ${sh ? 'tile-live' : ''} group w-full text-left px-4 py-2.5 bg-white hover:bg-slate-50 transition-colors flex items-center gap-3">
                ${avatarHtml(p.id, 'w-9 h-9 ring-1 ring-slate-200')}
                <span class="sm-td font-semibold text-slate-800 truncate flex-1 min-w-0">${p.name}</span>
                <span class="sm-td-sub truncate w-44 max-sm:w-auto max-sm:max-w-[40%]">${status}</span>
                <span class="w-[68px] text-right flex-shrink-0">${reg ? `<span class="px-1.5 rounded bg-slate-100 text-slate-600 text-[12px] font-semibold leading-5">${reg}</span>` : ''}</span>
                <i class="fas fa-chevron-right text-[11px] text-slate-300 group-hover:text-slate-500 transition-colors"></i>
            </button>`;
        }

        /* ===== ជំហានទី 2៖ លេខសម្ងាត់ ===== */

        function pickUser(id) {
            pinUser = personById(id);
            pin = '';
            pinMsg = '';
            document.getElementById('stepPick').classList.add('hidden');
            document.getElementById('stepPin').classList.remove('hidden');
            renderStepper(2);
            renderPin();
        }

        function backToPick() {
            pinUser = null;
            clearTimeout(lockTick);
            document.getElementById('stepPin').classList.add('hidden');
            const pick = document.getElementById('stepPick');
            pick.classList.remove('hidden', 'fade-up');
            void pick.offsetWidth;
            pick.classList.add('fade-up');
            renderStepper(1);
        }

        /* គូរជំហានលេខសម្ងាត់តែម្តងពេលជ្រើសរើសអ្នកប្រើ — ការចុចលេខនីមួយៗកែតែចំណុច សារ និងប៊ូតុង
           (ពីមុនគូរទាំងស្រុងរាល់ការចុច ធ្វើឱ្យចលនា fade-up លេងម្តងទៀត និងប៊ូតុងលោតពេលកំពុងចុច) */
        function renderPin() {
            const p = pinUser;
            const role = roleOf(p.id);
            const manager = role !== 'cashier';
            const sh = openShiftOf(p.id);
            const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];
            const asg = assignmentFor(p.id);
            const dest = role === 'admin' ? 'ផ្ទាំងម្ចាស់ហាង' : manager ? 'ផ្ទាំងគ្រប់គ្រង' : sh ? `បន្ត${sh.templateName} លើ ${sh.register}` : `បើក${asg ? asg.template.name : 'វេន'}លើ ${resolveRegister(p.id)}`;
            const accent = { admin: 'emerald', manager: 'indigo' }[role] || 'cyan';
            const tpl = sh ? null : asg && asg.template;
            const facts = [
                sh ? [ 'fa-circle-play', 'វេនបើកតាំងពី', fmtTime(sh.openedAt), 'text-emerald-700' ] : null,
                tpl ? [ 'fa-clock', 'ម៉ោងវេន', `${tpl.start}–${tpl.end}` ] : null,
                role === 'cashier' ? [ 'fa-percent', 'បញ្ចុះតម្លៃ', `≤ ${discountLimitFor(p.id)}%` ] : null
            ].filter(Boolean);
            const extra = facts;
            document.getElementById('stepPin').innerHTML = `
                <div class="flex-1 flex items-center justify-center fade-up">
                    <div class="w-full max-w-[340px]">
                        <!-- អ្នកកំពុងចូល៖ ឈ្មោះ តួនាទី គោលដៅ និងព័ត៌មានបន្ថែម ក្នុងកាតតែមួយ -->
                        <div class="rounded-lg border border-slate-200">
                            <div class="flex items-center gap-3 px-3 py-2.5">
                                ${avatarHtml(p.id, 'w-10 h-10 ring-1 ring-slate-200')}
                                <div class="min-w-0 flex-1">
                                    <p class="sm-td font-semibold text-slate-900 leading-tight truncate">${p.name}</p>
                                    <p class="sm-td-sub text-slate-500 truncate">${ROLE_NAME[role]} · <span class="text-slate-700">${dest}</span></p>
                                </div>
                                <button onclick="backToPick()" type="button" aria-label="ប្តូរអ្នកប្រើ"
                                    class="sm-td-sub font-semibold text-slate-600 hover:text-slate-900 h-8 px-2.5 rounded-md border border-slate-200 hover:border-slate-400 bg-white inline-flex items-center gap-1.5 transition-colors flex-shrink-0">
                                    <i class="fas fa-arrow-right-arrow-left text-[11px]"></i>ប្តូរ</button>
                            </div>
                            ${extra.length ? `<div class="px-3 py-2 border-t border-slate-100 flex flex-wrap gap-x-4 gap-y-1">
                                ${extra.map(([icon, label, value, tone]) => `<span class="sm-td-sub text-slate-500 inline-flex items-center gap-1.5">
                                    <i class="fas ${icon} text-[11px] text-slate-400"></i>${label} <span class="font-semibold ${tone || 'text-slate-700'}">${value}</span></span>`).join('')}
                            </div>` : ''}
                        </div>

                        <!-- ប្រអប់លេខសម្ងាត់ -->
                        <div class="mt-5 flex items-baseline justify-between">
                            <label class="sm-td-sub font-semibold text-slate-700">លេខសម្ងាត់</label>
                            <span class="sm-td-sub text-slate-400">4 ទៅ 6 ខ្ទង់</span>
                        </div>
                        <div id="pinBox" class="mt-1.5 h-14 rounded-lg border bg-white flex items-center justify-center transition-colors">
                            <div id="pinDots" class="flex items-center justify-center gap-3.5" aria-live="polite"></div>
                        </div>
                        <p id="pinMsg" class="sm-td-sub mt-1.5 min-h-[22px]"></p>
                        <div class="grid grid-cols-3 gap-2 mt-3">
                            ${keys.map(k => `<button onclick="press('${k}')" type="button" data-pin-key aria-label="${k === 'C' ? 'សម្អាតទាំងអស់' : k === '⌫' ? 'លុបមួយខ្ទង់' : k}"
                                class="pin-key rounded-lg border select-none transition-[background-color,border-color,transform] duration-75 active:scale-[.97] disabled:opacity-40 ${k === 'C' || k === '⌫'
                                    ? 'bg-white border-slate-200 text-slate-500 hover:border-slate-400 hover:text-slate-800 active:bg-slate-100' : 'bg-white border-slate-200 text-slate-800 hover:border-slate-400 active:bg-slate-100'}">
                                ${k === 'C' ? '<span class="sm-td-sub font-semibold pointer-events-none">សម្អាត</span>' : k === '⌫' ? '<i class="fas fa-delete-left text-lg pointer-events-none"></i>' : k}</button>`).join('')}
                        </div>
                        <button id="pinSubmit" onclick="submitPin()" type="button" disabled
                            class="mt-3 w-full h-12 rounded-lg sm-value font-semibold transition-colors inline-flex items-center justify-center gap-2">
                            ចូលប្រើ <i class="fas fa-arrow-right text-[13px]"></i>
                        </button>
                        <p class="sm-td-sub text-slate-400 text-center mt-3 max-sm:hidden whitespace-nowrap flex items-center justify-center gap-1.5">
                            <span class="kbd"><i class="fas fa-turn-down rotate-90 text-[10px]"></i></span> ចូលប្រើ
                            <span class="mx-1.5 text-slate-300">·</span>
                            <span class="kbd">Esc</span> ត្រឡប់ក្រោយ</p>
                    </div>
                </div>`;
            updatePin();
        }

        /* កែតែផ្នែកដែលប្រែប្រួល — មិនគូរទំព័រឡើងវិញ */
        function updatePin(shake) {
            const dots = document.getElementById('pinDots');
            if (!dots) return;
            const lockedFor = Math.ceil((POS_PIN_GUARD.lockedUntil - Date.now()) / 1000);
            const locked = lockedFor > 0;
            /* បង្ហាញ 4 ចំណុច ហើយបន្ថែមពេលវាយលើស (រហូតដល់ 6) — មិនបង្ហាញចំណុចស្រអាប់ដែលធ្វើឱ្យយល់ច្រឡំ */
            const n = Math.max(4, pin.length);
            const err = locked || !!pinMsg;
            const ready = pin.length >= 4 && !locked;
            dots.innerHTML = Array.from({ length: n }, (_, i) => `<span class="w-3.5 h-3.5 rounded-full ${i < pin.length
                ? (pinMsg ? 'bg-rose-500' : 'bg-slate-900') + (i === pin.length - 1 && !pinMsg ? ' dot-pop' : '') : 'bg-slate-200'}"></span>`).join('');
            document.getElementById('pinBox').className = `mt-1.5 h-14 rounded-lg border bg-white flex items-center justify-center transition-colors ${err
                ? 'border-rose-400 bg-rose-50/40' : pin.length ? 'border-slate-900 ring-2 ring-slate-900/5' : 'border-slate-300'}`;
            if (shake) {
                dots.classList.remove('shake');
                void dots.offsetWidth;
                dots.classList.add('shake');
            }
            const msg = document.getElementById('pinMsg');
            msg.innerHTML = locked ? `<i class="fas fa-lock mr-1.5"></i>វាយខុស 3 ដង · សូមរង់ចាំ ${lockedFor} វិនាទី`
                : pinMsg ? `<i class="fas fa-circle-exclamation mr-1.5"></i>${pinMsg}`
                : ready ? '<i class="fas fa-check mr-1.5"></i>ចុច «ចូលប្រើ» ឬ Enter' : '';
            msg.className = `sm-td-sub mt-1.5 min-h-[22px] ${err ? 'text-rose-600 font-semibold' : 'text-emerald-700'}`;
            document.querySelectorAll('[data-pin-key]').forEach(b => { b.disabled = locked; });
            const btn = document.getElementById('pinSubmit');
            btn.disabled = !ready;
            btn.className = `mt-3 w-full h-12 rounded-lg sm-value font-semibold transition-colors inline-flex items-center justify-center gap-2 ${ready
                ? 'bg-slate-900 border border-slate-900 hover:bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-400 cursor-not-allowed'}`;
            btn.setAttribute('aria-disabled', String(!ready));
            clearTimeout(lockTick);
            if (locked) lockTick = setTimeout(() => updatePin(), 1000);
        }

        /* ចុចលេខមិនចូលប្រើដោយស្វ័យប្រវត្តិទេ — អ្នកប្រើចុច «ចូលប្រើ» ឬ Enter ដោយខ្លួនឯង */
        function press(k) {
            if (!pinUser || POS_PIN_GUARD.lockedUntil > Date.now()) return;
            if (k === 'C') pin = '';
            else if (k === '⌫') pin = pin.slice(0, -1);
            else if (pin.length < 6) pin += k;
            pinMsg = '';
            updatePin();
        }

        function submitPin() {
            if (!pinUser || pin.length < 4 || POS_PIN_GUARD.lockedUntil > Date.now()) return;
            if (verifyPin(pinUser.id, pin)) {
                POS_PIN_GUARD.fails = 0;
                posLogin(pinUser.id);
                renderStepper(3);
                const next = new URLSearchParams(location.search).get('next');
                const role = roleOf(pinUser.id);
                const area = next && (next.match(/^(cashier|manager|admin)\/[a-z-]+\/[a-z-]+\.html$/) || [])[1];
                /* ម្ចាស់ហាងមិនឈរបញ្ជរ · អ្នកគ្រប់គ្រងមិនចូលទំព័រម្ចាស់ហាង · អ្នកគិតលុយចូលបានតែទំព័រគិតលុយ */
                const allowed = !!area && ({ admin: ['admin', 'manager'], manager: ['manager', 'cashier'], cashier: ['cashier'] }[role] || []).includes(area);
                document.getElementById('stepPin').innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center fade-up">
                    ${avatarHtml(pinUser.id, 'w-20 h-20 ring-1 ring-slate-200')}
                    <p class="sm-card-title text-slate-800 mt-4"><i class="fas fa-circle-check text-emerald-500 mr-1.5"></i>សូមស្វាគមន៍ ${pinUser.name}</p></div>`;
                setTimeout(() => {
                    location.href = allowed ? next : ROLE_HOME[role];
                }, 450);
                return;
            }
            POS_PIN_GUARD.fails += 1;
            pin = '';
            if (POS_PIN_GUARD.fails >= 3) {
                POS_PIN_GUARD.fails = 0;
                POS_PIN_GUARD.lockedUntil = Date.now() + 60000;
                pinMsg = '';
            } else {
                pinMsg = `លេខសម្ងាត់មិនត្រឹមត្រូវ · នៅសល់ ${3 - POS_PIN_GUARD.fails} ដង`;
            }
            updatePin(true);
        }

        /* ===== ផ្ទាំងឆ្វេង ===== */

        function renderRegisters() {
            document.getElementById('registerBoard').innerHTML = REGISTERS.map(r => {
                const sh = liveShifts().find(s => s.register === r && s.status === 'open');
                return `<div class="flex items-center gap-3 px-3 py-2 ${sh ? 'bg-white/[0.04]' : ''}">
                    ${sh ? avatarHtml(sh.cashierId, 'w-7 h-7') : '<span class="w-7 h-7 rounded-full bg-white/5 text-slate-500 inline-flex items-center justify-center"><i class="fas fa-cash-register text-[12px]"></i></span>'}
                    <div class="min-w-0 flex-1">
                        <p class="sm-td-sub font-semibold text-white">${r}</p>
                        <p class="sm-td-sub ${sh ? 'text-slate-300' : 'text-slate-500'} truncate">${sh ? `${personName(sh.cashierId)} · តាំងពី ${fmtTime(sh.openedAt)}` : 'មិនមានវេនបើក'}</p>
                    </div>
                    <span class="sm-td-sub font-semibold ${sh ? 'text-emerald-300' : 'text-slate-500'} inline-flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full ${sh ? 'bg-emerald-400' : 'bg-slate-600'}"></span>${sh ? 'បើក' : 'បិទ'}</span>
                </div>`;
            }).join('');
        }

        /* កាលវិភាគវេនទាំងអស់ក្នុងថ្ងៃធ្វើការបច្ចុប្បន្ន — វេនឥឡូវមានបន្ទាត់ពណ៌នៅខាងឆ្វេង */
        function renderRoster() {
            const slot = rosterSlotNow();
            if (!slot) return;
            const live = templateAt(new Date());
            document.getElementById('rosterBoard').innerHTML = shiftTemplates().map(t => {
                const list = rosterFor(slot.date, t.code).slice().sort((a, b) => a.register.localeCompare(b.register));
                const now = live && live.code === t.code;
                return `<div class="pl-3 border-l-2 ${now ? 'border-cyan-400' : 'border-white/10'}">
                    <p class="sm-td-sub flex items-center gap-2 ${now ? 'text-white font-semibold' : 'text-slate-400'}">
                        ${t.name}<span class="${now ? 'text-slate-300' : 'text-slate-500'} font-normal">${t.start}–${t.end}</span>
                        ${now ? '<span class="ml-auto text-[12px] font-semibold text-cyan-300">ឥឡូវនេះ</span>' : ''}</p>
                    <div class="mt-1.5 space-y-1">${list.length ? list.map(a => `<p class="sm-td-sub flex items-center gap-2 ${now ? 'text-slate-200' : 'text-slate-400'}">
                        ${avatarHtml(a.cashierId, 'w-5 h-5')}<span class="truncate">${personName(a.cashierId)}</span>${a.cover ? '<span class="text-[12px] text-amber-300/80">ជំនួស</span>' : ''}
                        <span class="ml-auto ${now ? 'text-slate-300' : 'text-slate-500'}">${a.register}</span></p>`).join('')
                        : '<p class="sm-td-sub text-slate-500">មិនមានអ្នកចាត់តាំង</p>'}</div>
                </div>`;
            }).join('');
        }

        function toggleDemo() {
            const box = document.getElementById('demoBox');
            box.classList.toggle('hidden');
            document.getElementById('demoChevron').classList.toggle('rotate-180', !box.classList.contains('hidden'));
        }

        async function resetDemo() {
            const ok = await showCustomConfirm({
                title: 'កំណត់ទិន្នន័យគំរូឡើងវិញ',
                message: 'វេន ការលក់ សំណើ ចលនាសាច់ប្រាក់ ការកំណត់ និងការចូលប្រើទាំងអស់នៅលើកម្មវិធីរុករកនេះ នឹងត្រូវលុប ហើយបង្កើតឡើងវិញ។',
                confirmText: 'កំណត់ឡើងវិញ',
                danger: true
            });
            if (!ok) return;
            resetDemoData();
            location.reload();
        }

        function tick() {
            const now = new Date();
            document.getElementById('clockBig').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
            const tpl = templateAt(now);
            document.getElementById('dateBig').textContent = `${fmtKhDate(now)} · ${tpl ? `${tpl.name} ${tpl.start}–${tpl.end}` : 'ក្រៅម៉ោងវេន'}`;
        }

        document.addEventListener('keydown', e => {
            if (!pinUser) return;
            if (/^[0-9]$/.test(e.key)) press(e.key);
            else if (e.key === 'Backspace') press('⌫');
            else if (e.key === 'Enter') submitPin();
            else if (e.key === 'Escape') backToPick();
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('branchLabel').textContent = MERCHANT.branch;
            tick();
            setInterval(tick, 10000);
            document.getElementById('cashierTiles').innerHTML = CASHIERS.map(p => tile(p, 'cashier')).join('');
            document.getElementById('managerTiles').innerHTML = MANAGERS.map(p => tile(p, 'manager')).join('');
            document.getElementById('adminTiles').innerHTML = ADMINS.map(p => tile(p, 'admin')).join('');
            document.getElementById('demoPins').innerHTML = CASHIERS.concat(MANAGERS, ADMINS).map(p =>
                `<p class="sm-td-sub text-slate-300 flex items-center gap-2.5">${avatarHtml(p.id, 'w-6 h-6')}<span class="flex-1">${p.name}</span><span class="sm-figure text-white font-semibold tracking-widest">${effectivePin(p.id)}</span></p>`).join('');
            const s = posSession();
            if (s) {
                const p = personById(s.userId);
                document.getElementById('lastUser').innerHTML = `<button onclick="pickUser('${p.id}')" type="button"
                    class="sm-td-sub pl-1.5 pr-3 py-1.5 rounded-full bg-slate-50 border border-slate-200 hover:border-cyan-400 text-slate-600 inline-flex items-center gap-2">
                    ${avatarHtml(p.id, 'w-7 h-7')} ចុងក្រោយ៖ <span class="text-slate-800 font-semibold">${p.name}</span></button>`;
            }
            [['cashierTiles', CASHIERS], ['managerTiles', MANAGERS], ['adminTiles', ADMINS]].forEach(([id, list]) => {
                document.getElementById(id + 'Count').textContent = `· ${list.length} នាក់`;
            });
            renderRegisters();
            renderRoster();
            renderStepper(1);
        });
    </script>
</body>
</html>
