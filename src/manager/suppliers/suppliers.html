<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - អ្នកផ្គត់ផ្គង់</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="managerPortal" data-role-root="../.." data-active="purchase" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="អ្នកផ្គត់ផ្គង់"
             data-subtitle="អ្នកលក់ដុំ និងក្រុមហ៊ុនដែលហាងបញ្ជាទិញ · ទំនិញដែលពួកគេលក់"
             data-back="../purchase/purchase-orders.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <label class="relative flex-1 sm:flex-none sm:w-[260px]"><i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="search" oninput="render()" type="text" placeholder="ស្វែងរកឈ្មោះ ឬលេខទូរស័ព្ទ" class="sm-td w-full h-9 pl-8 pr-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none"></label>
                    <button type="button" onclick="location.href='create-supplier.html'" class="sm-badge h-9 px-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 whitespace-nowrap"><i class="fas fa-plus"></i> បន្ថែមអ្នកផ្គត់ផ្គង់</button>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="max-md:hidden overflow-x-auto"><table class="w-full">
                        <thead><tr class="border-b border-slate-100 bg-slate-50/60">
                            <th class="sm-th py-2.5 px-5 text-left text-slate-500">អ្នកផ្គត់ផ្គង់</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ទំនិញ</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ដឹកក្នុង</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ត្រូវទិញឥឡូវ</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">កំពុងបញ្ជាទិញ</th>
                            <th class="sm-th py-2.5 px-5 w-16"></th>
                        </tr></thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table></div>
                    <div id="cards" class="md:hidden divide-y divide-slate-100"></div>
                    <div id="empty" class="hidden"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* អ្នកផ្គត់ផ្គង់ (អ្នកគ្រប់គ្រង · ម្ចាស់ហាង)៖ បញ្ជី · បន្ថែម និងកែជាទំព័រពេញ · ⋮ បញ្ជាទិញ ឬកែ */
        function dots(mid) {
            return `<button onclick="toggleRowActionMenu(event, '${mid}')" type="button" aria-label="សកម្មភាព" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 inline-flex items-center justify-center"><i class="fas fa-ellipsis-vertical text-sm"></i></button>`;
        }
        function mItem(icon, label, act) {
            return `<button type="button" onclick="closeAllFloatingDropdowns(); ${act}" class="sm-row-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-50"><i class="fas ${icon} w-4 text-center text-[13px] text-slate-400"></i>${label}</button>`;
        }
        function render() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            const all = shopSuppliers();
            const list = all.filter(s => !q || s.name.toLowerCase().includes(q) || normPhone(s.phone).includes(normPhone(q)));
            const open = purchaseOrders().filter(poOpen);
            const empty = document.getElementById('empty');
            empty.classList.toggle('hidden', !!list.length);
            empty.innerHTML = list.length ? '' : all.length ? emptyState('fa-truck', 'រកមិនឃើញ', 'សូមសាកល្បងពាក្យស្វែងរកផ្សេង')
                : emptyState('fa-truck', 'មិនទាន់មានអ្នកផ្គត់ផ្គង់', 'បន្ថែមអ្នកផ្គត់ផ្គង់ និងទំនិញដែលពួកគេលក់ ដើម្បីបញ្ជាទិញបានលឿន', '<button type="button" onclick="location.href=\'create-supplier.html\'" class="mt-4 sm-badge h-10 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2"><i class="fas fa-plus"></i> បន្ថែមអ្នកផ្គត់ផ្គង់</button>');
            const menu = (s, mid) => `<div id="${mid}" class="hidden bg-white rounded-xl shadow-2xl border border-slate-200 p-1.5 text-left min-w-[220px]">
                ${mItem('fa-cart-arrow-down', 'បញ្ជាទិញ', `location.href='../purchase/create-order.html?supplier=${s.id}'`)}
                ${mItem('fa-pen', 'កែព័ត៌មាន', `location.href='edit-supplier.html?id=${s.id}'`)}</div>`;
            const rows = list.map(s => ({ s, low: lowStockForSupplier(s).length, open: open.filter(p => p.supplierId === s.id).length }));
            const contact = s => [s.phone ? `<span class="sm-figure">${escapeText(s.phone)}</span>` : '', s.telegram ? escapeText(s.telegram) : ''].filter(Boolean).join(' · ') || '—';
            document.getElementById('rows').innerHTML = rows.map(({ s, low, open }) => `<tr data-row-id="${s.id}" class="hover:bg-slate-50 transition">
                <td class="py-2.5 px-5"><p class="sm-td-strong text-slate-800">${escapeText(s.name)}</p><p class="sm-td-sub text-slate-400">${contact(s)}</p></td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${(s.skus || []).length} មុខ</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${s.leadDays || 1} ថ្ងៃ</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right ${low ? 'text-amber-700 font-semibold' : 'text-slate-400'}">${low ? `${low} មុខ` : '—'}</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${open || '—'}</td>
                <td class="py-2.5 px-5 text-right">${dots('m-' + s.id)}${menu(s, 'm-' + s.id)}</td></tr>`).join('');
            document.getElementById('cards').innerHTML = rows.map(({ s, low }) => `<div data-row-id="${s.id}" class="p-4 flex items-start gap-3">
                <div class="min-w-0 flex-1"><p class="sm-value text-slate-800">${escapeText(s.name)}</p><p class="sm-td-sub text-slate-500">${contact(s)} · ${(s.skus || []).length} មុខ · ${s.leadDays || 1} ថ្ងៃ</p>
                    ${low ? `<p class="sm-td-sub text-amber-700 font-semibold">ត្រូវទិញ ${low} មុខ</p>` : ''}</div>${dots('c-' + s.id)}${menu(s, 'c-' + s.id)}</div>`).join('');
        }
        window.onStoreChanged = render;
        document.addEventListener('DOMContentLoaded', () => { render(); flashViewedRow(); });
    </script>
</body>
</html>
