<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - ផ្ទេរស្តុក</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="managerPortal" data-role-root="../.." data-active="stock-transfer" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទេរស្តុក"
             data-subtitle="ផ្ញើទំនិញទៅសាខាផ្សេង និងទទួលពីសាខាផ្សេង"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-2">
                    <div id="tabs" class="flex flex-wrap gap-1"></div>
                    <button type="button" onclick="location.href='create-transfer.html'" class="sm-badge h-9 px-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 whitespace-nowrap"><i class="fas fa-plus"></i> ផ្ទេរស្តុក</button>
                </div>
                <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm">
                    <div class="max-md:hidden overflow-x-auto"><table class="w-full">
                        <thead><tr class="border-b border-slate-100 bg-slate-50/60">
                            <th class="sm-th py-2.5 px-5 text-left text-slate-500">ការផ្ទេរ</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">ពី → ទៅ</th>
                            <th class="sm-th py-2.5 px-3 text-right text-slate-500">ទំនិញ</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">ផ្ញើដោយ</th>
                            <th class="sm-th py-2.5 px-3 text-left text-slate-500">ស្ថានភាព</th>
                            <th class="sm-th py-2.5 px-5 w-16"></th>
                        </tr></thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table></div>
                    <div id="cards" class="md:hidden divide-y divide-slate-100"></div>
                    <div id="empty" class="hidden"></div>
                    <div data-pager="transfers" id="pager"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ផ្ទេរស្តុក (អ្នកគ្រប់គ្រង · ម្ចាស់ហាង)៖ ត្រូវទទួល · បានផ្ញើ · ទាំងអស់ · ⋮ តែមួយក្នុងជួរ */
        function statusChip(t) {
            if (t.status === 'sent') return `<span class="sm-badge inline-flex px-2.5 py-0.5 rounded-full border whitespace-nowrap bg-amber-50 text-amber-800 border-amber-200">${t.to === ACTIVE_BRANCH_ID ? 'រង់ចាំអ្នកទទួល' : 'កំពុងដឹក'}</span>`;
            const short = transferShort(t);
            return short ? `<span class="sm-badge inline-flex px-2.5 py-0.5 rounded-full border whitespace-nowrap bg-rose-50 text-rose-700 border-rose-200">ទទួលខ្វះ ${short}</span>`
                : '<span class="sm-badge inline-flex px-2.5 py-0.5 rounded-full border whitespace-nowrap bg-slate-50 text-slate-700 border-slate-200">បានទទួល</span>';
        }
        function units(t, key) { return t.lines.reduce((n, l) => n + (Number(l[key]) || 0), 0); }
        const TABS = [
            { id: 'incoming', label: 'ត្រូវទទួល', test: t => t.to === ACTIVE_BRANCH_ID && t.status === 'sent' },
            { id: 'out', label: 'បានផ្ញើ', test: t => t.from === ACTIVE_BRANCH_ID },
            { id: 'in', label: 'បានទទួល', test: t => t.to === ACTIVE_BRANCH_ID && t.status === 'received' },
            { id: 'all', label: 'ទាំងអស់', test: t => t.from === ACTIVE_BRANCH_ID || t.to === ACTIVE_BRANCH_ID }
        ];
        let tab = 'incoming';
        let listReady = false;

        function setTab(id) { tab = id; render(); }

        function menu(t, mid) {
            return `<div id="${mid}" class="hidden bg-white rounded-xl shadow-2xl border border-slate-200 p-1.5 text-left min-w-[220px]">
                <button type="button" onclick="closeAllFloatingDropdowns(); location.href='view-transfer.html?id=${t.id}'" class="sm-row-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-50"><i class="fas ${t.to === ACTIVE_BRANCH_ID && t.status === 'sent' ? 'fa-clipboard-check' : 'fa-eye'} w-4 text-center text-[13px] text-slate-400"></i>${t.to === ACTIVE_BRANCH_ID && t.status === 'sent' ? 'រាប់ និងទទួល' : 'មើលព័ត៌មាន'}</button></div>`;
        }
        function dots(mid) {
            return `<button onclick="toggleRowActionMenu(event, '${mid}')" type="button" aria-label="សកម្មភាព" class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 inline-flex items-center justify-center"><i class="fas fa-ellipsis-vertical text-sm"></i></button>`;
        }

        function render() {
            if (listReady) saveListState('transfers', { tab });
            const all = shopTransfers();
            document.getElementById('tabs').innerHTML = TABS.map(x => `<button type="button" onclick="setTab('${x.id}')"
                class="sm-badge h-9 px-3.5 rounded-xl transition inline-flex items-center gap-2 ${tab === x.id ? 'bg-blue-600 text-white font-semibold' : 'text-slate-600 hover:bg-slate-100'}">${x.label}
                <span class="text-[12px] sm-figure ${tab === x.id ? 'text-blue-100' : 'text-slate-400'}">${all.filter(x.test).length}</span></button>`).join('');
            const list = all.filter(TABS.find(x => x.id === tab).test);
            const pg = pagerSlice('transfers', list, { size: 25, render: 'render', sig: tab });
            const empty = document.getElementById('empty');
            empty.classList.toggle('hidden', !!list.length);
            empty.innerHTML = list.length ? '' : emptyState('fa-truck-ramp-box', tab === 'incoming' ? 'គ្មានស្តុករង់ចាំទទួល' : 'មិនទាន់មានការផ្ទេរ',
                tab === 'incoming' ? 'ពេលសាខាផ្សេងផ្ញើទំនិញមក វាលេចនៅទីនេះ' : 'ផ្ទេរទំនិញពីសាខានេះទៅសាខាផ្សេង',
                '<button type="button" onclick="location.href=\'create-transfer.html\'" class="mt-4 sm-badge h-10 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold inline-flex items-center gap-2"><i class="fas fa-plus text-slate-400"></i> ផ្ទេរស្តុក</button>');
            const open = id => `onclick="if (!event.target.closest('button')) location.href='view-transfer.html?id=${id}'"`;
            document.getElementById('rows').innerHTML = pg.rows.map(t => `<tr data-row-id="${t.id}" ${open(t.id)} class="cursor-pointer hover:bg-slate-50 transition">
                <td class="py-2.5 px-5"><p class="sm-td-strong text-slate-800 sm-figure">${t.id}</p><p class="sm-td-sub text-slate-400 sm-figure">${fmtDate(t.sentAt)} ${fmtTime(t.sentAt)}</p></td>
                <td class="py-2.5 px-3 sm-td text-slate-700">${escapeText(branchName(t.from))} <i class="fas fa-arrow-right text-[10px] text-slate-400 mx-1"></i> ${escapeText(branchName(t.to))}</td>
                <td class="py-2.5 px-3 sm-td sm-figure text-right text-slate-700">${t.lines.length} មុខ · ${units(t, 'qty')}</td>
                <td class="py-2.5 px-3 sm-td text-slate-700">${personName(t.sentBy)}</td>
                <td class="py-2.5 px-3">${statusChip(t)}</td>
                <td class="py-2.5 px-5 text-right">${dots('m-' + t.id)}${menu(t, 'm-' + t.id)}</td>
            </tr>`).join('');
            document.getElementById('cards').innerHTML = pg.rows.map(t => `<div data-row-id="${t.id}" ${open(t.id)} class="p-4 flex items-start gap-3 cursor-pointer">
                <div class="min-w-0 flex-1"><p class="sm-value text-slate-800">${escapeText(branchName(t.from))} → ${escapeText(branchName(t.to))}</p>
                    <p class="sm-td-sub text-slate-500 sm-figure">${fmtDate(t.sentAt)} · ${t.lines.length} មុខ · ${units(t, 'qty')} ឯកតា</p><div class="mt-1.5">${statusChip(t)}</div></div>
                ${dots('c-' + t.id)}${menu(t, 'c-' + t.id)}</div>`).join('');
            document.getElementById('pager').innerHTML = pg.html;
            if (typeof updatePortalBadges === 'function') updatePortalBadges();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = loadListState('transfers') || {};
            const url = new URLSearchParams(location.search).get('tab');
            tab = TABS.some(x => x.id === url) ? url : TABS.some(x => x.id === saved.tab) ? saved.tab : (incomingTransfers().length ? 'incoming' : 'all');
            listReady = true;
            render();
            flashViewedRow();
        });
        window.onStoreChanged = render;
    </script>
</body>
</html>
