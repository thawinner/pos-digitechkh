<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - កាលវិភាគវេន</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#4f46e5", 'primary-dark': "#4338ca", accent: "#818cf8" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="managerPortal" data-role-root="../.." data-active="roster" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="កាលវិភាគវេន"
             data-subtitle="វេនប្រចាំ ការជំនួសវេន និងបញ្ជររបស់អ្នកគិតលុយ"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <button onclick="shiftWeek(-7)" type="button" aria-label="សប្តាហ៍មុន" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600"><i class="fas fa-chevron-left text-xs"></i></button>
                        <p id="weekLabel" class="sm-value text-slate-800 min-w-[200px] text-center"></p>
                        <button onclick="shiftWeek(7)" type="button" aria-label="សប្តាហ៍បន្ទាប់" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600"><i class="fas fa-chevron-right text-xs"></i></button>
                        <button onclick="weekStart=startOfWeek(); render()" type="button" class="sm-badge h-10 px-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">ថ្ងៃនេះ</button>
                    </div>
                    <div id="autoFillBar" class="flex items-center gap-2"></div>
                </div>

                <div id="hoursCard"></div>

                <!-- Desktop Grid View (Visible on desktop >= 768px) -->
                <div class="max-md:hidden bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-x-auto">
                    <table class="w-full min-w-[1000px]" id="grid"></table>
                </div>

                <!-- Mobile Phone Day View (S12, Visible on mobile < 768px) -->
                <div class="md:hidden space-y-4" id="mobileDayContainer">
                    <div id="mobileDayPills" class="flex items-center gap-1.5 overflow-x-auto pb-1"></div>
                    <div id="mobileDayCards" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* កាលវិភាគវេន — អ្នកគ្រប់គ្រងចាត់តាំងអ្នកគិតលុយច្រើននាក់ក្នុងវេនមួយ ម្នាក់មួយបញ្ជរ
           គាំទ្រការណែនាំស្វ័យប្រវត្តិ ការដកថយ (Undo) ការកំណត់វេនប្រចាំក្នុងទម្រង់តែមួយ និងទិដ្ឋភាពទូរស័ព្ទ */

        function startOfWeek(d = new Date()) {
            const date = new Date(d);
            date.setHours(12, 0, 0, 0);
            const day = date.getDay();
            const diff = (day === 0 ? -6 : 1) - day;
            date.setDate(date.getDate() + diff);
            return date;
        }

        let weekStart = startOfWeek();
        let selectedMobileDate = isoDate(new Date());
        const STAFF = CASHIERS.concat(MANAGERS);

        function shiftWeek(n) {
            weekStart = addDays(weekStart, n);
            selectedMobileDate = isoDate(weekStart);
            render();
        }

        function days() {
            return Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
        }

        const DOW_KH = ['អាទិត្យ', 'ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
        const DOW_SHORT = ['អា', 'ច', 'អ', 'ពុ', 'ព្រ', 'សុ', 'ស'];

        /* វេនប្រចាំ + ម៉ោងក្នុងសប្តាហ៍ */
        function renderHours() {
            const h = weeklyHoursFor(isoDate(weekStart));
            const defs = posSettings().staffDefaults || {};
            document.getElementById('hoursCard').innerHTML = `
                <div class="flex items-center justify-between gap-3 mb-2">
                    <div>
                        <h3 class="sm-card-title text-slate-700">វេនប្រចាំរបស់បុគ្គលិក</h3>
                        <p class="sm-card-sub text-slate-500">កាលវិភាគបង្កើតចេញពីវេនប្រចាំដោយស្វ័យប្រវត្តិ · ចុចលើ ⋮ ដើម្បីកត់ត្រាការឈប់សម្រាក ឬប្តូរវេន</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">${STAFF.map(p => {
                    const over = h[p.id] > 48;
                    const d = defs[p.id] || {};
                    const t = shiftTemplates().find(x => x.code === d.template);
                    return `<div class="bg-white rounded-2xl border ${over ? 'border-rose-200' : 'border-slate-200/80'} shadow-sm p-3 relative group">
                        <div class="flex items-center gap-3">
                            ${avatarHtml(p.id, 'w-10 h-10')}
                            <div class="min-w-0 flex-1">
                                <p class="sm-td text-slate-700 truncate font-semibold">${p.name}</p>
                                <p class="sm-td-sub sm-figure ${over ? 'text-rose-600 font-semibold' : 'text-slate-500'}">${h[p.id] || 0} ម៉ោង / សប្តាហ៍${over ? ' · លើស 48' : ''}</p>
                            </div>
                            <div class="relative">
                                <button onclick="toggleStaffMenu('${p.id}', event)" type="button" aria-label="ម៉ឺនុយ" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-ellipsis-vertical text-xs"></i>
                                </button>
                                <div id="staffMenu-${p.id}" class="hidden absolute right-0 top-9 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-1.5 z-20 text-xs">
                                    <button onclick="editDefault('${p.id}')" type="button" class="w-full text-left px-3.5 py-2 hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2">
                                        <i class="fas fa-pen text-slate-400 w-4"></i>កែវេនប្រចាំ
                                    </button>
                                    <button onclick="recordLeave('${p.id}')" type="button" class="w-full text-left px-3.5 py-2 hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2">
                                        <i class="fas fa-bed text-slate-400 w-4"></i>កត់ត្រាការឈប់សម្រាក
                                    </button>
                                    <button onclick="swapShift('${p.id}')" type="button" class="w-full text-left px-3.5 py-2 hover:bg-indigo-50 hover:text-indigo-700 flex items-center gap-2">
                                        <i class="fas fa-arrow-right-arrow-left text-slate-400 w-4"></i>ប្តូរវេនជាមួយ…
                                    </button>
                                </div>
                            </div>
                        </div>
                        <p class="sm-td-sub mt-2 ${t ? 'text-indigo-700' : 'text-slate-400'}"><i class="fas fa-calendar-day mr-1"></i>${t ? `${t.name} · ${d.register}` : 'គ្មានវេនប្រចាំ'}</p>
                        <p class="sm-td-sub text-slate-400"><i class="fas fa-bed mr-1"></i>ឈប់ថ្ងៃ${DOW_KH[d.dayOff != null ? d.dayOff : 0]}</p>
                    </div>`;
                }).join('')}</div>`;
        }

        function toggleStaffMenu(id, e) {
            e.stopPropagation();
            document.querySelectorAll('[id^="staffMenu-"]').forEach(m => {
                if (m.id !== `staffMenu-${id}`) m.classList.add('hidden');
            });
            const menu = document.getElementById(`staffMenu-${id}`);
            if (menu) menu.classList.toggle('hidden');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('[id^="staffMenu-"]').forEach(m => m.classList.add('hidden'));
        });

        /* S9: កែវេនប្រចាំក្នុងទម្រង់តែមួយ ជាមួយការមើលមុនបន្តផ្ទាល់ (Live Preview) */
        function editDefault(id) {
            const cur = (posSettings().staffDefaults || {})[id] || {};
            let selTpl = cur.template || '';
            let selReg = cur.register || (REGISTERS[0]);
            let selDayOff = cur.dayOff != null ? Number(cur.dayOff) : 0;

            const host = posDialogHost('posDefaultShiftModal');

            const renderModal = () => {
                const t = shiftTemplates().find(x => x.code === selTpl);
                const weeklyH = t ? templateHours(t) * 6 : 0;
                const nightH = t ? nightHours(t) * 6 : 0;

                const defs = posSettings().staffDefaults || {};
                let clashName = '';
                if (selTpl && selReg) {
                    const clashId = Object.keys(defs).find(k => k !== id && defs[k].template === selTpl && defs[k].register === selReg);
                    if (clashId) clashName = personName(clashId);
                }

                host.innerHTML = `
                    <div class="w-full max-w-md rounded-3xl shadow-2xl bg-white text-slate-800 p-5 sm:p-6 space-y-4" onclick="event.stopPropagation()">
                        <div class="flex items-start justify-between border-b border-slate-100 pb-3">
                            <div>
                                <h3 class="sm-card-title text-slate-800 text-base font-semibold">វេនប្រចាំ · ${personName(id)}</h3>
                                <p class="sm-td-sub text-slate-500 mt-0.5">កំណត់វេន បញ្ជរ និងថ្ងៃឈប់សម្រាកប្រចាំសប្តាហ៍</p>
                            </div>
                            <button type="button" data-act="cancel" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-xmark"></i></button>
                        </div>

                        <div class="space-y-3.5">
                            <div>
                                <label class="text-xs font-semibold text-slate-600 block mb-1.5">វេន</label>
                                <div class="flex flex-wrap gap-1.5">
                                    ${shiftTemplates().map(tItem => `
                                        <button type="button" data-tpl="${tItem.code}" class="h-9 px-3 rounded-xl border text-xs font-semibold transition ${selTpl === tItem.code ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'}">
                                            ${tItem.name} ${tItem.start}–${tItem.end} ${selTpl === tItem.code ? '✓' : ''}
                                        </button>
                                    `).join('')}
                                    <button type="button" data-tpl="" class="h-9 px-3 rounded-xl border text-xs font-semibold transition ${!selTpl ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'}">
                                        គ្មាន ${!selTpl ? '✓' : ''}
                                    </button>
                                </div>
                            </div>

                            ${selTpl ? `
                                <div>
                                    <label class="text-xs font-semibold text-slate-600 block mb-1.5">បញ្ជរ</label>
                                    <div class="flex flex-wrap gap-2">
                                        ${REGISTERS.map(r => `
                                            <button type="button" data-reg="${r}" class="h-9 px-3 rounded-xl border text-xs font-semibold transition ${selReg === r ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'}">
                                                ${r} ${selReg === r ? '✓' : ''}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div>
                                <label class="text-xs font-semibold text-slate-600 block mb-1.5">ថ្ងៃឈប់សម្រាកប្រចាំសប្តាហ៍</label>
                                <div class="grid grid-cols-7 gap-1">
                                    ${DOW_SHORT.map((dName, dIdx) => `
                                        <button type="button" data-dayoff="${dIdx}" class="h-9 rounded-xl border text-xs font-semibold transition ${selDayOff === dIdx ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'}">
                                            ${dName}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="pt-2 border-t border-slate-100 space-y-1.5 text-xs text-slate-600">
                                <p class="font-medium sm-figure">${weeklyH} ម៉ោង / សប្តាហ៍${nightH ? ` · ម៉ោងយប់ ${nightH} ម៉ោង` : ''}</p>
                                ${clashName ? `<p class="text-amber-700 font-medium bg-amber-50 border border-amber-200 rounded-lg p-2"><i class="fas fa-triangle-exclamation mr-1"></i>${selReg} ${t ? t.name : ''} ជាវេនប្រចាំរបស់ ${clashName} រួចហើយ</p>` : ''}
                                <p class="text-[11px] text-slate-400">ការផ្លាស់ប្តូរតាមថ្ងៃដែលបានកែរួច មិនប៉ះពាល់ឡើយ</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                            <button type="button" data-act="cancel" class="sm-value h-11 px-5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold transition">បោះបង់</button>
                            <button type="button" data-act="save" class="sm-value h-11 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition shadow-sm">រក្សាទុក</button>
                        </div>
                    </div>
                `;

                host.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => { selTpl = b.dataset.tpl; renderModal(); });
                host.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => { selReg = b.dataset.reg; renderModal(); });
                host.querySelectorAll('[data-dayoff]').forEach(b => b.onclick = () => { selDayOff = Number(b.dataset.dayoff); renderModal(); });
                host.querySelector('[data-act="cancel"]').onclick = () => finish(false);
                host.querySelector('[data-act="save"]').onclick = async () => {
                    const ok = await showPinConfirm({ title: 'រក្សាទុកវេនប្រចាំ', message: personName(id), userId: ME_MANAGER, confirmText: 'រក្សាទុក' });
                    if (!ok) return;
                    const defs = clone(posSettings().staffDefaults || {});
                    defs[id] = { template: selTpl, register: selTpl ? selReg : '', dayOff: selDayOff };
                    savePosSettings({ staffDefaults: defs }, ME_MANAGER);
                    logPosEvent('roster_default', {
                        personId: id,
                        actorId: ME_MANAGER,
                        note: `${personName(id)} · ${selTpl ? `${selTpl} (${selReg})` : 'គ្មាន'} · ឈប់ថ្ងៃ${DOW_KH[selDayOff]}`
                    });
                    showToast(`បានកែវេនប្រចាំរបស់ ${personName(id)}`, 'success');
                    finish(true);
                };
            };

            const finish = v => { posDialogClose(host); if (v) render(); };
            host.onclick = () => finish(false);
            renderModal();
        }

        /* បង្ហាញការព្រមានពេលថតប្រាក់កំពុងបើក (S2) */
        function showLockedDrawerTip(name, shiftId) {
            showToast(`${name} កំពុងបើកថតប្រាក់ · ត្រូវបិទវេនសិន`, 'warning', 4000, {
                action: {
                    label: 'មើលវេន',
                    onClick: () => { location.href = `../shifts/view-shift.html?id=${shiftId}`; }
                }
            });
        }

        /* ការរៀបចំប្លង់កោសិកាក្នុងតារាង (Desktop Grid) */
        function cell(d, t) {
            const date = isoDate(d);
            const list = rosterFor(date, t.code);
            const custom = isRosterCustom(date, t.code);
            const past = shiftEndDate({ date, start: t.start, end: t.end }) < new Date();
            const shifts = typeof mgrAllShifts === 'function' ? mgrAllShifts().filter(s => s.date === date && s.templateCode === t.code) : [];

            // Suggestion for empty cell (S4)
            const cand = (!list.length && !past) ? (rankCandidates(date, t.code).find(c => !c.blocked) || null) : null;

            return `<td class="align-top p-2 border-l border-slate-100 ${past ? 'bg-slate-50/60' : ''}">
                <div class="space-y-1.5">
                    ${list.map((a, i) => {
                        const actual = shifts.find(s => s.register === a.register);
                        const mismatch = actual && actual.cashierId !== a.cashierId;
                        const isLiveOpen = actual && actual.status === 'open' && actual.cashierId === a.cashierId;

                        return `<div class="group flex items-center gap-2 rounded-xl border ${mismatch || a.cover ? 'border-amber-300 bg-amber-50/60' : 'border-slate-200 bg-white'} px-2 py-1.5">
                            ${avatarHtml(a.cashierId, 'w-7 h-7')}
                            <div class="min-w-0 flex-1">
                                <p class="text-[12px] font-semibold text-slate-700 truncate">
                                    ${personName(a.cashierId)}
                                    ${a.cover ? ' <span class="text-[10px] font-semibold text-amber-700 bg-amber-100 rounded px-1">ជំនួស</span>' : ''}
                                    ${a.until ? ` <span class="text-[10px] font-semibold text-amber-800 bg-amber-100 rounded px-1">ដល់ ${a.until}</span>` : ''}
                                </p>
                                <p class="text-[11px] text-slate-400 sm-figure">${a.register}${actual ? ` · ${SHIFT_STATUS[actual.status].label}` : ''}${mismatch ? ` · ${personName(actual.cashierId)} ជំនួស` : ''}</p>
                            </div>
                            ${past ? '' : (isLiveOpen ? `
                                <button onclick="showLockedDrawerTip('${personName(a.cashierId)}', '${actual.id}')" type="button" aria-label="កំពុងបើកថតប្រាក់" class="w-7 h-7 rounded-lg text-amber-600 hover:bg-amber-100 flex-shrink-0 flex items-center justify-center" title="កំពុងបើកថតប្រាក់"><i class="fas fa-lock text-xs"></i></button>
                            ` : `
                                <button onclick="removeAt('${date}', '${t.code}', ${i})" type="button" aria-label="ដកចេញ" class="w-7 h-7 rounded-lg text-slate-300 hover:text-rose-600 hover:bg-rose-50 flex-shrink-0"><i class="fas fa-xmark text-xs"></i></button>
                            `)}
                        </div>
                        ${a.until ? `
                            <div class="rounded-xl border border-amber-200 bg-amber-50/50 p-1.5 text-[11px] text-amber-800">
                                <span>ខ្វះ ${a.until}–${t.end}</span>
                            </div>
                        ` : ''}`;
                    }).join('') || (past ? '<p class="text-[12px] text-slate-400 px-1 py-2">គ្មានអ្នកគិតលុយ</p>'
                        : (cand ? `
                            <div class="rounded-xl border border-amber-300 bg-amber-50/70 p-2 text-left">
                                <p class="text-[12px] font-semibold text-amber-800"><i class="fas fa-triangle-exclamation mr-1"></i>គ្មានអ្នកគិតលុយ</p>
                                <div class="mt-1.5 flex items-center justify-between gap-1">
                                    <button onclick="quickAssign('${date}', '${t.code}', '${cand.id}')" type="button" class="text-[11px] font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg px-2 py-1 truncate">
                                        <i class="fas fa-user-plus mr-1"></i>ចាត់ ${cand.name}
                                    </button>
                                    <button onclick="addTo('${date}', '${t.code}')" type="button" class="text-[11px] font-semibold text-slate-500 hover:text-slate-800">ជ្រើសផ្សេង</button>
                                </div>
                                <p class="text-[10px] text-slate-500 mt-1 sm-figure">${cand.hoursBefore} → ${cand.hoursAfter} ម៉ោង · ${cand.chip}</p>
                            </div>
                        ` : `<p class="text-[12px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-2 py-2"><i class="fas fa-triangle-exclamation mr-1"></i>គ្មានអ្នកគិតលុយ · ត្រូវរកអ្នកជំនួស</p>`))}

                    ${past ? '' : `<button onclick="addTo('${date}', '${t.code}')" type="button" class="w-full rounded-xl border border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 text-[12px] text-slate-500 hover:text-indigo-700 py-1.5"><i class="fas fa-plus mr-1"></i>បន្ថែម</button>`}

                    ${custom ? `
                        <div class="flex items-center justify-between px-1 pt-0.5">
                            <span class="text-[10px] text-indigo-600 font-semibold inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>បានកែ</span>
                            <button onclick="resetCell('${date}', '${t.code}')" type="button" class="text-[10px] text-slate-400 hover:text-slate-600 underline">ត្រឡប់ទៅលំនាំដើម</button>
                        </div>
                    ` : ''}
                </div>
            </td>`;
        }

        /* ទិដ្ឋភាពទូរស័ព្ទ (S12) */
        function renderMobileView() {
            const ds = days();
            const today = isoDate(new Date());

            document.getElementById('mobileDayPills').innerHTML = ds.map(d => {
                const dStr = isoDate(d);
                const isSelected = dStr === selectedMobileDate;
                const hasGap = shiftTemplates().some(t => rosterFor(dStr, t.code).length === 0);
                return `
                    <button type="button" onclick="selectedMobileDate='${dStr}'; renderMobileView()" class="flex-1 min-w-[48px] py-2 px-1 rounded-2xl flex flex-col items-center justify-center transition border ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-700 border-slate-200'}">
                        <span class="text-[11px] font-medium opacity-80">${DOW_SHORT[d.getDay()]}</span>
                        <span class="text-sm font-semibold sm-figure">${d.getDate()}</span>
                        ${hasGap ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-amber-300' : 'bg-amber-500'} mt-0.5"></span>` : '<span class="w-1.5 h-1.5 mt-0.5"></span>'}
                    </button>
                `;
            }).join('');

            const shifts = typeof mgrAllShifts === 'function' ? mgrAllShifts().filter(s => s.date === selectedMobileDate) : [];
            const past = false;

            document.getElementById('mobileDayCards').innerHTML = shiftTemplates().map(t => {
                const list = rosterFor(selectedMobileDate, t.code);
                const custom = isRosterCustom(selectedMobileDate, t.code);
                const cand = !list.length ? (rankCandidates(selectedMobileDate, t.code).find(c => !c.blocked) || null) : null;

                return `
                    <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                            <div>
                                <h4 class="font-semibold text-slate-800 text-sm">${t.name}</h4>
                                <p class="text-xs text-slate-400 sm-figure">${t.start}–${t.end}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                ${custom ? `<button onclick="resetCell('${selectedMobileDate}', '${t.code}')" type="button" class="text-xs text-indigo-600 font-semibold hover:underline">ត្រឡប់ទៅលំនាំដើម</button>` : ''}
                                <button onclick="addTo('${selectedMobileDate}', '${t.code}')" type="button" class="h-8 px-2.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold inline-flex items-center gap-1">
                                    <i class="fas fa-plus text-[10px]"></i>បន្ថែម
                                </button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            ${list.map((a, i) => {
                                const actual = shifts.find(s => s.register === a.register);
                                const isLiveOpen = actual && actual.status === 'open' && actual.cashierId === a.cashierId;
                                return `
                                    <div class="flex items-center gap-2.5 p-2 rounded-xl border border-slate-200 bg-slate-50/50">
                                        ${avatarHtml(a.cashierId, 'w-8 h-8')}
                                        <div class="min-w-0 flex-1">
                                            <p class="text-xs font-semibold text-slate-800 truncate">${personName(a.cashierId)} ${a.cover ? '<span class="text-[10px] text-amber-700 bg-amber-100 px-1 rounded font-normal">ជំនួស</span>' : ''}</p>
                                            <p class="text-[11px] text-slate-500 sm-figure">${a.register}${a.until ? ` · ដល់ ${a.until}` : ''}</p>
                                        </div>
                                        ${isLiveOpen ? `
                                            <button onclick="showLockedDrawerTip('${personName(a.cashierId)}', '${actual.id}')" type="button" class="w-8 h-8 rounded-lg text-amber-600 bg-amber-50 flex items-center justify-center"><i class="fas fa-lock text-xs"></i></button>
                                        ` : `
                                            <button onclick="removeAt('${selectedMobileDate}', '${t.code}', ${i})" type="button" class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 flex items-center justify-center"><i class="fas fa-xmark text-xs"></i></button>
                                        `}
                                    </div>
                                `;
                            }).join('') || (cand ? `
                                <div class="rounded-xl border border-amber-300 bg-amber-50/70 p-3">
                                    <p class="text-xs font-semibold text-amber-800"><i class="fas fa-triangle-exclamation mr-1"></i>គ្មានអ្នកគិតលុយ</p>
                                    <div class="mt-2 flex items-center justify-between gap-2">
                                        <button onclick="quickAssign('${selectedMobileDate}', '${t.code}', '${cand.id}')" type="button" class="h-8 px-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold flex items-center gap-1">
                                            <i class="fas fa-user-plus text-[10px]"></i>ចាត់ ${cand.name}
                                        </button>
                                        <span class="text-xs text-slate-500 sm-figure">${cand.hoursBefore} → ${cand.hoursAfter} ម៉ោង</span>
                                    </div>
                                </div>
                            ` : `<p class="text-xs text-slate-400 py-2">គ្មានអ្នកគិតលុយ</p>`)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function render() {
            const ds = days();
            document.getElementById('weekLabel').textContent = `${fmtDate(ds[0])} – ${fmtDate(ds[6])}`;
            const today = isoDate(new Date());

            // របារបំពេញចន្លោះស្វ័យប្រវត្តិ (S11)
            const gaps = weekGaps(weekStart);
            const bar = document.getElementById('autoFillBar');
            if (gaps.length > 0) {
                bar.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-3 h-10 flex items-center gap-3">
                        <span class="text-xs font-semibold"><i class="fas fa-triangle-exclamation mr-1.5"></i>សប្តាហ៍នេះខ្វះ ${gaps.length} វេន</span>
                        <button onclick="reviewWeekGaps()" type="button" class="sm-badge h-7 px-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-semibold shadow-sm">បំពេញដោយស្វ័យប្រវត្តិ</button>
                    </div>
                `;
            } else {
                bar.innerHTML = `<span class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-2 rounded-xl font-medium"><i class="fas fa-circle-check mr-1.5"></i>កាលវិភាគពេញលេញ</span>`;
            }

            document.getElementById('grid').innerHTML = `
                <thead><tr class="bg-slate-50 border-b border-slate-100">
                    <th class="sm-th py-3 px-3 text-left text-slate-500 w-[130px]">វេន</th>
                    ${ds.map(d => `<th class="sm-th py-3 px-2 text-left border-l border-slate-100 ${isoDate(d) === today ? 'text-indigo-700' : 'text-slate-500'}">${DOW_KH[d.getDay()]}<span class="block text-[12px] font-medium sm-figure">${fmtDate(d)}</span></th>`).join('')}
                </tr></thead>
                <tbody>${shiftTemplates().map(t => `<tr class="border-b border-slate-100" id="row-tpl-${t.code}">
                    <td class="align-top p-3"><p class="sm-value text-slate-700">${t.name}</p><p class="sm-td-sub text-slate-400 sm-figure">${t.start}–${t.end}</p></td>
                    ${ds.map(d => cell(d, t)).join('')}
                </tr>`).join('')}</tbody>`;

            renderHours();
            renderMobileView();
        }

        /* ចាត់តាំងរហ័ស (S4) */
        function quickAssign(date, code, personId) {
            const defs = posSettings().staffDefaults || {};
            const staffDef = defs[personId] || {};
            const curRoster = rosterFor(date, code);
            const freeRegs = REGISTERS.filter(r => !curRoster.some(a => a.register === r));
            const register = (staffDef.register && freeRegs.includes(staffDef.register)) ? staffDef.register : (freeRegs[0] || 'POS-01');

            const res = assignShift(date, code, personId, register, { by: ME_MANAGER });
            showToast(`បានចាត់ ${personName(personId)} ទៅ${register}`, 'success', 6000, {
                action: {
                    label: 'មិនធ្វើវិញ',
                    onClick: () => {
                        undoRosterAction({ type: 'assign', date, code, personId, register, movedFrom: res.movedFrom, replaced: res.replaced });
                        render();
                    }
                }
            });
            render();
        }

        /* បន្ថែមអ្នកគិតលុយតាមរយៈ Dialog រួម (S5) */
        async function addTo(date, code) {
            const res = await showAssignDialog({ date, code });
            if (!res) return;
            const meta = { by: ME_MANAGER };
            if (res.reason) meta.reason = res.reason;
            if (res.until) meta.until = res.until;
            if (res.from) meta.from = res.from;

            const r = assignShift(date, code, res.personId, res.register, meta);
            showToast(`បានចាត់ ${personName(res.personId)} ទៅ ${res.register}`, 'success', 6000, {
                action: {
                    label: 'មិនធ្វើវិញ',
                    onClick: () => {
                        undoRosterAction({ type: 'assign', date, code, personId: res.personId, register: res.register, movedFrom: r.movedFrom, replaced: r.replaced });
                        render();
                    }
                }
            });
            render();
        }

        /* ដកអ្នកគិតលុយចេញពីវេន ជាមួយមុខងារមិនធ្វើវិញ (S6) */
        function removeAt(date, code, i) {
            const list = rosterFor(date, code);
            const target = list[i];
            if (!target) return;

            // Check if open drawer
            const openShifts = posRead(POS_KEYS.shifts, []).filter(s => s.status === 'open' && s.cashierId === target.cashierId && s.date === date && s.templateCode === code);
            if (openShifts.length > 0) {
                showLockedDrawerTip(personName(target.cashierId), openShifts[0].id);
                return;
            }

            const res = unassignShift(date, code, target.cashierId, { by: ME_MANAGER });
            if (res && res.removed) {
                showToast(`បានដក ${personName(target.cashierId)} ចេញពីវេន`, 'info', 6000, {
                    action: {
                        label: 'មិនធ្វើវិញ',
                        onClick: () => {
                            undoRosterAction({ type: 'remove', date, code, entry: res.removed });
                            render();
                        }
                    }
                });
            }
            render();
        }

        /* កំណត់កោសិកាទៅសភាពដើមវិញ (S13) */
        function resetCell(date, code) {
            const all = posRead(ROSTER_KEY, {});
            delete all[rosterKey(date, code)];
            posWrite(ROSTER_KEY, all);
            showToast('បានកំណត់ត្រឡប់ទៅលំនាំដើមវិញ', 'info');
            render();
        }

        /* S11: កត់ត្រាការឈប់សម្រាក */
        async function recordLeave(personId) {
            const today = isoDate(new Date());
            const vals = await showFormDialog({
                title: `កត់ត្រាការឈប់សម្រាក · ${personName(personId)}`,
                message: 'ដកបុគ្គលិកចេញពីកាលវិភាគសម្រាប់កាលបរិច្ឆេទដែលបានជ្រើសរើស',
                fields: [
                    { key: 'from', label: 'ចាប់ពីថ្ងៃ (YYYY-MM-DD)', value: today, type: 'text' },
                    { key: 'to', label: 'ដល់ថ្ងៃ (YYYY-MM-DD)', value: isoDate(addDays(new Date(), 2)), type: 'text' },
                    { key: 'reason', label: 'មូលហេតុ', value: 'ឈប់សម្រាក', type: 'text' }
                ],
                confirmText: 'កត់ត្រា និងពិនិត្យអ្នកជំនួស'
            });
            if (!vals || !vals.from || !vals.to) return;

            const fromDate = new Date(vals.from + 'T12:00');
            const toDate = new Date(vals.to + 'T12:00');
            if (isNaN(fromDate.getTime()) || isNaN(toDate.getTime()) || fromDate > toDate) {
                showToast('កាលបរិច្ឆេទមិនត្រឹមត្រូវ', 'error');
                return;
            }

            let cur = fromDate;
            const gapsCreated = [];
            while (cur <= toDate) {
                const dStr = isoDate(cur);
                shiftTemplates().forEach(t => {
                    const list = rosterFor(dStr, t.code);
                    if (list.some(a => a.cashierId === personId)) {
                        unassignShift(dStr, t.code, personId, { by: ME_MANAGER });
                        gapsCreated.push({ date: dStr, code: t.code, template: t });
                    }
                });
                cur = addDays(cur, 1);
            }

            render();
            showToast(`បានកត់ត្រាការឈប់សម្រាករបស់ ${personName(personId)}`, 'success');

            if (gapsCreated.length > 0) {
                reviewLeaveGaps(gapsCreated);
            }
        }

        /* S11: ប្តូរវេនគ្នា */
        async function swapShift(personId) {
            const date = isoDate(new Date());
            const colleagues = STAFF.filter(p => p.id !== personId);
            const otherId = await showOptionDialog({
                title: `ប្តូរវេនជាមួយ · ${personName(personId)}`,
                message: 'ជ្រើសរើសសហសេវិកដែលត្រូវប្តូរវេនជាមួយ',
                options: colleagues.map(c => ({ value: c.id, label: c.name, icon: 'fa-user' }))
            });
            if (!otherId) return;

            // Find shifts of both for today/week
            let pShift = null;
            let oShift = null;
            shiftTemplates().forEach(t => {
                const pEntry = rosterFor(date, t.code).find(a => a.cashierId === personId);
                const oEntry = rosterFor(date, t.code).find(a => a.cashierId === otherId);
                if (pEntry) pShift = { code: t.code, entry: pEntry };
                if (oEntry) oShift = { code: t.code, entry: oEntry };
            });

            if (!pShift && !oShift) {
                showToast('អ្នកទាំងពីរគ្មានវេននៅថ្ងៃនេះទេ', 'warning');
                return;
            }

            const ok = await showCustomConfirm({
                title: 'បញ្ជាក់ការប្តូរវេន',
                message: `ប្តូរវេនថ្ងៃនេះរវាង ${personName(personId)} និង ${personName(otherId)}?`,
                confirmText: 'ប្តូរវេន'
            });
            if (!ok) return;

            if (pShift) unassignShift(date, pShift.code, personId);
            if (oShift) unassignShift(date, oShift.code, otherId);

            if (pShift) assignShift(date, pShift.code, otherId, pShift.entry.register, { reason: 'ប្តូរវេនគ្នា', by: ME_MANAGER });
            if (oShift) assignShift(date, oShift.code, personId, oShift.entry.register, { reason: 'ប្តូរវេនគ្នា', by: ME_MANAGER });

            render();
            showToast('បានប្តូរវេនជោគជ័យ', 'success');
        }

        /* S11: ពិនិត្យ និងបំពេញចន្លោះទាំងអស់ក្នុងសប្តាហ៍ */
        function reviewWeekGaps(targetTemplateCode) {
            const gaps = weekGaps(weekStart).filter(g => !targetTemplateCode || g.template.code === targetTemplateCode);
            if (!gaps.length) return showToast('គ្មានចន្លោះដែលត្រូវបំពេញទេ', 'info');

            const host = posDialogHost('posReviewGapsModal');
            let assignments = gaps.map(g => ({
                date: g.date,
                code: g.template.code,
                personId: g.suggested ? g.suggested.id : '',
                register: g.register
            }));

            const renderModal = () => {
                host.innerHTML = `
                    <div class="w-full max-w-xl rounded-3xl shadow-2xl bg-white text-slate-800 p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="flex items-start justify-between border-b border-slate-100 pb-3">
                            <div>
                                <h3 class="sm-card-title text-slate-800 text-base font-semibold">ពិនិត្យ និងបំពេញវេនដោយស្វ័យប្រវត្តិ</h3>
                                <p class="sm-td-sub text-slate-500 mt-0.5">ប្រព័ន្ធបានណែនាំបេក្ខជនដែលទំនេរ និងស័ក្តិសមបំផុតសម្រាប់ចន្លោះនីមួយៗ</p>
                            </div>
                            <button type="button" data-act="cancel" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-xmark"></i></button>
                        </div>

                        <div class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                            ${gaps.map((g, idx) => {
                                const currentAssign = assignments[idx];
                                const candList = rankCandidates(g.date, g.template.code).filter(c => !c.blocked);
                                return `
                                    <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <p class="text-xs font-semibold text-slate-800">${DOW_KH[g.dow]} ${fmtDate(g.date + 'T12:00')} · ${g.template.name}</p>
                                            <p class="text-[11px] text-slate-500 sm-figure">${g.template.start}–${g.template.end} · បញ្ជរ ${g.register}</p>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <select data-idx="${idx}" class="text-xs h-9 px-2.5 rounded-xl border border-slate-200 bg-white font-medium focus:outline-none focus:border-indigo-500">
                                                ${candList.map(c => `
                                                    <option value="${c.id}" ${c.id === currentAssign.personId ? 'selected' : ''}>
                                                        ${c.name} (${c.chip})
                                                    </option>
                                                `).join('')}
                                            </select>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                            <button type="button" data-act="cancel" class="sm-value h-11 px-5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold transition">បោះបង់</button>
                            <button type="button" data-act="ok" class="sm-value h-11 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition shadow-sm">ចាត់តាំងទាំងអស់ (${gaps.length})</button>
                        </div>
                    </div>
                `;

                host.querySelectorAll('select[data-idx]').forEach(sel => {
                    sel.onchange = () => {
                        const idx = Number(sel.dataset.idx);
                        assignments[idx].personId = sel.value;
                    };
                });

                host.querySelector('[data-act="cancel"]').onclick = () => posDialogClose(host);
                host.querySelector('[data-act="ok"]').onclick = () => {
                    assignments.forEach(a => {
                        if (a.personId) {
                            assignShift(a.date, a.code, a.personId, a.register, { reason: 'បំពេញដោយស្វ័យប្រវត្តិ', by: ME_MANAGER });
                        }
                    });
                    posDialogClose(host);
                    showToast(`បានបំពេញ ${assignments.filter(a => a.personId).length} វេនជោគជ័យ`, 'success');
                    render();
                };
            };

            host.onclick = () => posDialogClose(host);
            renderModal();
        }

        function reviewLeaveGaps(gaps) {
            reviewWeekGaps();
        }

        // ដោះស្រាយ query parameter ?template=<code> (S10)
        function checkUrlParams() {
            const params = new URLSearchParams(location.search);
            const tCode = params.get('template');
            if (tCode) {
                setTimeout(() => {
                    const row = document.getElementById(`row-tpl-${tCode}`);
                    if (row) {
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        row.classList.add('bg-indigo-50/70');
                        setTimeout(() => row.classList.remove('bg-indigo-50/70'), 3000);
                    }
                    const gaps = weekGaps(weekStart).filter(g => g.template.code === tCode);
                    if (gaps.length > 0) reviewWeekGaps(tCode);
                }, 400);
            }
        }

        window.onStoreChanged = render;
        document.addEventListener('DOMContentLoaded', () => {
            render();
            checkUrlParams();
        });
    </script>
</body>
</html>
