<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - បញ្ជាទិញ</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="managerPortal" data-role-root="../.." data-active="purchase" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="បញ្ជាទិញ"
             data-subtitle="ជ្រើសអ្នកផ្គត់ផ្គង់ · ទំនិញជិតអស់ត្រូវបំពេញឱ្យស្វ័យប្រវត្តិ" data-back="purchase-orders.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <form id="form" onsubmit="return submitForm(event)" novalidate class="w-full grid gap-5 xl:grid-cols-3">
                <div class="xl:col-span-2 space-y-5 min-w-0">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">1. អ្នកផ្គត់ផ្គង់</h3><p class="sm-card-sub text-slate-500">លេខ «ត្រូវទិញ» = ទំនិញជិតអស់ ឬអស់ដែលពួកគេលក់</p></div>
                        <div id="supPick" class="px-5 py-4 grid gap-2.5 md:grid-cols-2"></div>
                    </section>
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">2. ទំនិញ</h3><p class="sm-card-sub text-slate-500">កែចំនួនបាន · ស្វែងរក ដើម្បីបន្ថែមទំនិញផ្សេង</p></div>
                        <div class="px-5 pt-4"><label class="relative block"><i class="fas fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input id="search" type="text" placeholder="ស្វែងរកឈ្មោះ ឬលេខកូដទំនិញ" autocomplete="off" class="f-input" style="padding-left:40px"></label>
                            <div id="results" class="mt-2 divide-y divide-slate-100 rounded-xl border border-slate-200 hidden"></div></div>
                        <div class="px-5 py-4"><div id="lines"></div></div>
                    </section>
                </div>
                <div class="space-y-5 min-w-0">
                    <section class="form-card rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">3. ថ្ងៃដឹកមកដល់</h3><p class="sm-card-sub text-slate-500"></p></div>
                        <div class="px-5 py-4 space-y-3">
                            <div id="datePick" class="flex flex-wrap gap-1.5"></div>
                            <div id="summary" class="space-y-2 pt-1"></div>
                            <label class="block"><span class="sm-td font-semibold text-slate-700">ចំណាំ <span class="font-normal text-slate-400">មិនចាំបាច់</span></span>
                                <input id="note" type="text" placeholder="ឧ. ដឹកមុនម៉ោង 10 ព្រឹក" class="f-input mt-1.5"></label>
                            <button type="submit" class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white sm-td font-semibold inline-flex items-center justify-center gap-2"><i class="fas fa-cart-arrow-down"></i> បង្កើតការបញ្ជាទិញ</button>
                        </div>
                    </section>
                </div>
            </form>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* បង្កើតការបញ្ជាទិញ — ទំព័រពេញ · ជ្រើសអ្នកផ្គត់ផ្គង់ → ទំនិញជិតអស់របស់ពួកគេបំពេញឱ្យ → ថ្ងៃដឹក → រក្សាទុក ហើយផ្ញើសារ */
        const SUPS = shopSuppliers().filter(s => s.active !== false);
        const pre = new URLSearchParams(location.search).get('supplier');
        const preSku = new URLSearchParams(location.search).get('sku');
        let supId = SUPS.some(s => s.id === pre) ? pre : '';
        let lines = [];
        let days = 0;
        const LV = onHandLevels();

        function pickSup(id) {
            supId = id;
            const s = supplierById(id);
            const onOrder = onOrderBySku();
            lines = lowStockForSupplier(s).map(p => ({ sku: p.sku, qty: suggestOrderQty(p, LV, onOrder).qty }));
            days = Number(s.leadDays) || 1;
            renderAll();
        }

        function renderSups() {
            document.getElementById('supPick').innerHTML = SUPS.length ? SUPS.map(s => {
                const n = lowStockForSupplier(s).length;
                return `<button type="button" onclick="pickSup('${s.id}')" class="text-left px-4 py-3 rounded-xl border transition flex items-start gap-3 ${supId === s.id ? 'border-blue-600 ring-1 ring-blue-600' : 'border-slate-200 hover:border-slate-300'}">
                    <i class="fas fa-truck mt-1 ${supId === s.id ? 'text-blue-600' : 'text-slate-400'}"></i>
                    <span class="min-w-0 flex-1"><span class="block sm-td font-semibold text-slate-800 truncate">${escapeText(s.name)}</span>
                        <span class="block sm-td-sub ${n ? 'text-amber-700 font-semibold' : 'text-slate-500'}">${n ? `ត្រូវទិញ ${n} មុខ` : 'គ្មានទំនិញជិតអស់'} · ដឹក ${s.leadDays || 1} ថ្ងៃ</span></span></button>`;
            }).join('') : `<div class="md:col-span-2">${emptyState('fa-truck', 'មិនទាន់មានអ្នកផ្គត់ផ្គង់', 'បន្ថែមអ្នកផ្គត់ផ្គង់ជាមុនសិន', '<a href="../suppliers/create-supplier.html" class="mt-4 sm-badge h-10 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2"><i class="fas fa-plus"></i> បន្ថែមអ្នកផ្គត់ផ្គង់</a>')}</div>`;
        }

        function renderResults() {
            const q = document.getElementById('search').value.trim().toLowerCase();
            const box = document.getElementById('results');
            if (!q) { box.classList.add('hidden'); return; }
            const mine = new Set((supplierById(supId) || {}).skus || []);
            const found = PRODUCTS.filter(p => (p.name.toLowerCase().includes(q) || p.sku.includes(q)) && !lines.some(l => l.sku === p.sku))
                .sort((a, b) => mine.has(b.sku) - mine.has(a.sku)).slice(0, 6);
            box.classList.remove('hidden');
            box.innerHTML = found.length ? found.map(p => `<button type="button" onclick="addLine('${p.sku}')" class="w-full text-left px-3 py-2.5 flex items-center gap-3 hover:bg-slate-50">
                <span class="w-9 h-9 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">${productImgHtml(p)}</span>
                <span class="flex-1 min-w-0 sm-td text-slate-800 truncate">${escapeText(p.name)}</span>
                <span class="sm-td-sub text-slate-500 sm-figure flex-shrink-0">មាន ${Math.max(0, LV[p.sku] || 0)} ${p.unit}</span></button>`).join('') : '<p class="px-3 py-3 sm-td-sub text-slate-400">រកមិនឃើញទំនិញ</p>';
        }

        function addLine(sku) {
            const p = getProduct(sku);
            lines.push({ sku, qty: suggestOrderQty(p, LV, onOrderBySku()).qty });
            document.getElementById('search').value = '';
            renderResults(); renderAll();
        }
        function setQty(i, v) { lines[i].qty = Math.max(0, parseInt(v, 10) || 0); renderSummary(); }
        function removeLine(i) { lines.splice(i, 1); renderAll(); }

        function renderLines() {
            document.getElementById('lines').innerHTML = !supId ? '<p class="sm-td-sub text-slate-400">ជ្រើសអ្នកផ្គត់ផ្គង់ជាមុន</p>' : lines.length ? `<div class="divide-y divide-slate-100 rounded-xl border border-slate-200">${lines.map((l, i) => {
                const p = getProduct(l.sku);
                return `<div class="px-3 py-2.5 flex items-center gap-3">
                    <span class="w-10 h-10 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">${productImgHtml(p)}</span>
                    <span class="flex-1 min-w-0"><span class="block sm-td font-medium text-slate-800 truncate">${escapeText(p.name)}</span><span class="block sm-td-sub text-slate-500 sm-figure">មាន ${Math.max(0, LV[l.sku] || 0)} · អប្បបរមា ${p.minStock || 0} ${p.unit}</span><span class="block sm-td-sub text-slate-400">${suggestNote(suggestOrderQty(p, LV, onOrderBySku()), p.unit)}</span></span>
                    <input type="text" inputmode="numeric" value="${l.qty}" oninput="setQty(${i}, this.value)" aria-label="ចំនួនបញ្ជាទិញ" class="f-input text-right sm-figure flex-shrink-0" style="height:44px;width:96px">
                    <button type="button" onclick="removeLine(${i})" aria-label="ដកចេញ" class="w-10 h-10 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-xmark"></i></button></div>`;
            }).join('')}</div>` : emptyState('fa-boxes-stacked', 'គ្មានទំនិញជិតអស់ពីអ្នកផ្គត់ផ្គង់នេះ', 'ស្វែងរកខាងលើ ដើម្បីបន្ថែមទំនិញ');
        }

        function expected() { return addDaysIso(days); }

        function renderSummary() {
            const s = supplierById(supId);
            const lead = s ? Number(s.leadDays) || 1 : 1;
            document.getElementById('datePick').innerHTML = [...new Set([lead, lead + 1, lead + 3, 7])].sort((a, b) => a - b).map(d => `<button type="button" onclick="days=${d}; renderSummary()"
                class="sm-badge h-10 px-3.5 rounded-xl border transition ${days === d ? 'bg-blue-600 border-blue-600 text-white font-semibold' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${d === 0 ? 'ថ្ងៃនេះ' : d === 1 ? 'ថ្ងៃស្អែក' : `${d} ថ្ងៃ`}</button>`).join('');
            const row = (l, v) => `<div class="flex justify-between gap-3"><span class="sm-td-sub text-slate-500">${l}</span><span class="sm-td font-semibold text-slate-800 text-right">${v}</span></div>`;
            document.getElementById('summary').innerHTML = row('ត្រូវមកដល់', `<span class="sm-figure">${fmtDate(expected())}</span>`)
                + row('ទំនិញ', `<span class="sm-figure">${lines.length} មុខ · ${lines.reduce((n, l) => n + l.qty, 0)}</span>`);
        }

        function renderAll() { renderSups(); renderLines(); renderSummary(); }

        function submitForm(e) {
            e.preventDefault();
            if (!supId) { showToast('សូមជ្រើសអ្នកផ្គត់ផ្គង់', 'warning'); return false; }
            const ok = lines.filter(l => l.qty > 0);
            if (!ok.length) { showToast('សូមបន្ថែមទំនិញយ៉ាងហោចណាស់ 1 មុខ', 'warning'); document.getElementById('search').focus(); return false; }
            const po = createPO(supId, ok, expected(), document.getElementById('note').value.trim());
            markRecordViewed(po.id);
            flashToast('បានបង្កើតការបញ្ជាទិញ · ចម្លងសារ ហើយផ្ញើទៅអ្នកផ្គត់ផ្គង់');
            location.href = `view-order.html?id=${po.id}`;
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (supId) {
                pickSup(supId);
                // មកពីជួរស្តុក: ត្រូវប្រាកដថាទំនិញនោះមានក្នុងបញ្ជី
                if (preSku && getProduct(preSku) && !lines.some(l => l.sku === preSku)) addLine(preSku);
            } else if (preSku && getProduct(preSku)) { lines = [{ sku: preSku, qty: suggestOrderQty(getProduct(preSku), LV, onOrderBySku()).qty }]; renderAll(); }
            else { const first = SUPS.find(s => lowStockForSupplier(s).length); if (first && !pre) pickSup(first.id); else renderAll(); }
            document.getElementById('search').addEventListener('input', renderResults);
        });
    </script>
</body>
</html>
