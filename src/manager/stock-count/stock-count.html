<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - រាប់ស្តុក</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="managerPortal" data-role-root="../.." data-active="stock-count" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="រាប់ស្តុក"
             data-subtitle="កាលវិភាគ និងប្រវត្តិនៃការរាប់ស្តុកជាក់ស្តែង"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div class="flex flex-wrap items-center justify-end gap-3">
                    <a href="create-count.html" class="sm-value h-11 px-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 shadow-sm transition"><i class="fas fa-clipboard-check"></i> ចាប់ផ្តើមរាប់ស្តុកថ្មី</a>
                </div>

                <div id="kpiRow" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 kpi-2up"></div>

                <!-- កាតស្ថានភាពកាលវិភាគ -->
                <div id="scheduleBanner"></div>

                <!-- បញ្ជីប្រវត្តិនៃការរាប់ -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between gap-2">
                        <h3 class="sm-card-title text-slate-800">ប្រវត្តិវគ្គរាប់ស្តុក</h3>
                        <span id="sessionCountBadge" class="sm-badge px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">0 វគ្គ</span>
                    </div>

                    <div class="hidden md:!block">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-2.5 px-4">កាលបរិច្ឆេទ</th>
                                    <th class="sm-th py-2.5 px-4">រាប់ដោយ</th>
                                    <th class="sm-th py-2.5 px-4 text-center">មុខទំនិញរាប់</th>
                                    <th class="sm-th py-2.5 px-4 text-center">ភាពខុសគ្នា</th>
                                    <th class="sm-th py-2.5 px-4 text-right">តម្លៃខុសគ្នាសរុប</th>
                                    <th class="sm-th py-2.5 px-4 text-center w-16"></th>
                                </tr>
                            </thead>
                            <tbody id="rows" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                    <div id="cards" class="md:hidden divide-y divide-slate-100"></div>
                    <div id="empty" class="hidden"></div>
                </div>
            </div>
        </main>

    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        let sessions = [];

        function renderScheduleBanner() {
            const st = stockCountScheduleStatus();
            const host = document.getElementById('scheduleBanner');

            let banner = '';
            if (st.isOverdue) {
                banner = `
                <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div>
                            <h4 class="font-bold text-rose-900 leading-snug">ការរាប់ស្តុកហួសកាលបរិច្ឆេទកំណត់ ${st.overdueDays} ថ្ងៃ</h4>
                            <p class="text-xs text-rose-700 mt-0.5">តាមកាលវិភាគ${st.schedule === 'monthly' ? 'ប្រចាំខែ' : 'ប្រចាំសប្តាហ៍'} ត្រូវធ្វើនៅថ្ងៃទី ${fmtDate(st.nextDueDate)}។ ករណីនេះត្រូវបានកត់ត្រាក្នុងករណីមិនប្រក្រតី។</p>
                        </div>
                    </div>
                    <a href="create-count.html" class="sm-badge px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold inline-flex items-center gap-2 transition">
                        <i class="fas fa-clipboard-check"></i> រាប់ស្តុកឥឡូវនេះ
                    </a>
                </div>`;
            } else if (st.isDue) {
                banner = `
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div>
                            <h4 class="font-bold text-amber-900 leading-snug">ដល់កាលបរិច្ឆេទរាប់ស្តុកហើយ</h4>
                            <p class="text-xs text-amber-700 mt-0.5">តាមកាលវិភាគ${st.schedule === 'monthly' ? 'ប្រចាំខែ' : 'ប្រចាំសប្តាហ៍'} ដល់ពេលរាប់ស្តុកជាក់ស្តែងប្រចាំវគ្គ។</p>
                        </div>
                    </div>
                    <a href="create-count.html" class="sm-badge px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 transition">
                        <i class="fas fa-clipboard-check"></i> រាប់ស្តុកឥឡូវនេះ
                    </a>
                </div>`;
            } else {
                banner = `
                <div class="bg-white border border-slate-200/80 rounded-2xl p-4 flex items-center justify-between gap-3 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div>
                            <h4 class="font-bold text-slate-800 leading-snug">កាលវិភាគរាប់ស្តុកដំណើរការធម្មតា</h4>
                            <p class="text-xs text-slate-500 mt-0.5">កាលវិភាគ${st.schedule === 'monthly' ? 'ប្រចាំខែ (រៀងរាល់ 30 ថ្ងៃ)' : 'ប្រចាំសប្តាហ៍ (រៀងរាល់ 7 ថ្ងៃ)'} · វគ្គបន្ទាប់នៅថ្ងៃ ${fmtDate(st.nextDueDate)}</p>
                        </div>
                    </div>
                    <span class="sm-td-sub text-slate-500">ធម្មតា</span>
                </div>`;
            }
            host.innerHTML = banner;
        }

        function renderKpis() {
            const st = stockCountScheduleStatus();
            sessions = mgrAllStockCounts();

            const lastDate = sessions.length ? fmtDate(sessions[0].at) : 'មិនទាន់មាន';
            const statusLabel = st.isOverdue ? 'ហួសកំណត់' : (st.isDue ? 'ដល់កាលបរិច្ឆេទ' : 'ធម្មតា');
            const statusTone = st.isOverdue ? 'text-rose-600' : (st.isDue ? 'text-amber-600' : 'text-emerald-600');

            document.getElementById('kpiRow').innerHTML =
                kpiCard('កាលវិភាគរាប់ស្តុក', st.schedule === 'monthly' ? 'ប្រចាំខែ' : 'ប្រចាំសប្តាហ៍', 'កំណត់ដោយម្ចាស់ហាង') +
                kpiCard('ស្ថានភាពកាលវិភាគ', statusLabel, `បន្ទាប់: ${fmtDate(st.nextDueDate)}`, statusTone) +
                kpiCard('ការរាប់ចុងក្រោយ', lastDate, sessions.length ? fmtTime(sessions[0].at) : '') +
                kpiCard('ចំនួនដងរាប់សរុប', `${sessions.length}`, 'វគ្គរាប់ដែលបានកត់ត្រា');
        }

        function renderList() {
            sessions = mgrAllStockCounts();
            document.getElementById('sessionCountBadge').textContent = `${sessions.length} វគ្គ`;

            const empty = document.getElementById('empty');
            if (!sessions.length) {
                document.getElementById('rows').innerHTML = '';
                document.getElementById('cards').innerHTML = '';
                empty.classList.remove('hidden');
                empty.innerHTML = emptyState('fa-clipboard-check', 'មិនទាន់មានវគ្គរាប់ស្តុកនៅឡើយ', 'សូមចុចប៊ូតុងខាងលើដើម្បីចាប់ផ្តើមរាប់ស្តុកលើកដំបូង');
                return;
            }

            empty.classList.add('hidden');

            document.getElementById('rows').innerHTML = sessions.map(s => {
                const lines = s.lines || [];
                const diffLines = lines.filter(l => (l.diff !== 0 && l.diff != null) || (l.counted !== l.system));
                const totalDiffUSD = diffLines.reduce((sum, l) => {
                    const p = getProduct(l.sku);
                    const diff = (l.diff != null) ? l.diff : (l.counted - l.system);
                    return sum + Math.abs(diff) * (p ? p.price : 0);
                }, 0);

                const hasDiff = diffLines.length > 0;

                return `
                <tr data-row-id="${s.id}" onclick="openCount('${s.id}')" class="hover:bg-slate-50 transition cursor-pointer">
                    <td class="py-2.5 px-4 sm-td sm-figure">
                        <span class="block font-medium text-slate-800">${fmtDate(s.at)}</span>
                        <span class="text-xs text-slate-400">${fmtTime(s.at)}</span>
                    </td>
                    <td class="py-2.5 px-4 sm-td">${personChip(s.by)}</td>
                    <td class="py-2.5 px-4 text-center sm-td sm-figure font-medium">${lines.length} មុខ</td>
                    <td class="py-2.5 px-4 text-center">
                        ${hasDiff
                            ? `<span class="sm-badge px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-xs font-semibold">${diffLines.length} មុខខុសគ្នា</span>`
                            : `<span class="sm-td text-slate-500">ត្រូវគ្នាទាំងអស់</span>`}
                    </td>
                    <td class="py-2.5 px-4 text-right sm-td sm-figure font-semibold ${totalDiffUSD ? 'text-rose-600' : 'text-slate-500'}">
                        ${fmtUSD(totalDiffUSD)}
                    </td>
                    <td class="py-2.5 px-4 text-center relative" onclick="event.stopPropagation()">
                        <button onclick="toggleRowActionMenu(event, 'cntMenu-${s.id}')" type="button" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center mx-auto transition"><i class="fas fa-ellipsis-vertical text-sm"></i></button>
                        <div id="cntMenu-${s.id}" class="hidden absolute right-4 top-10 w-44 bg-white rounded-2xl shadow-2xl border border-slate-200 p-1.5 text-left z-50">
                            <button onclick="openCount('${s.id}')" type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition sm-td"><i class="fas fa-eye text-slate-400 text-xs w-4"></i>មើលលម្អិត</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('cards').innerHTML = sessions.map(s => {
                const lines = s.lines || [];
                const diffLines = lines.filter(l => (l.diff !== 0 && l.diff != null) || (l.counted !== l.system));
                const totalDiffUSD = diffLines.reduce((sum, l) => {
                    const p = getProduct(l.sku);
                    const diff = (l.diff != null) ? l.diff : (l.counted - l.system);
                    return sum + Math.abs(diff) * (p ? p.price : 0);
                }, 0);

                return `
                <div data-row-id="${s.id}" onclick="openCount('${s.id}')" class="p-4 space-y-2.5 cursor-pointer">
                    <div class="flex items-center justify-between gap-2">
                        <span class="sm-td font-medium text-slate-800">${fmtDate(s.at)} <span class="text-slate-400">${fmtTime(s.at)}</span></span>
                        <i class="fas fa-chevron-right text-xs text-slate-400"></i>
                    </div>
                    <div class="flex items-center justify-between">
                        ${personChip(s.by)}
                        <span class="text-xs ${diffLines.length ? 'font-semibold text-rose-600' : 'text-slate-500'}">
                            ${diffLines.length ? `${diffLines.length} មុខខុសគ្នា (${fmtUSD(totalDiffUSD)})` : 'ត្រូវគ្នាទាំងអស់'}
                        </span>
                    </div>
                </div>`;
            }).join('');
        }

        function openCount(id) {
            markRecordViewed(id);
            location.href = `view-count.html?id=${encodeURIComponent(id)}`;
        }

        function renderAll() {
            renderScheduleBanner();
            renderKpis();
            renderList();
            updatePortalBadges();
            refreshPortalNotifications();
        }

        window.onStoreChanged = renderAll;

        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            flashViewedRow();
        });
    </script>
</body>
</html>
