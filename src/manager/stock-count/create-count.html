<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - រាប់ស្តុកជាក់ស្តែង</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ទូរស័ព្ទ៖ ឈ្មោះទំនិញចុះបន្ទាត់ ដូច្នេះប្រអប់វាយចំនួនរាប់នៅក្នុងអេក្រង់ជានិច្ច */
        @media (max-width: 767px) {
            #countTable td:first-child, #countTable td:first-child * { white-space: normal !important; }
            #countTable th:not(:first-child) { width: auto !important; }
        }
    </style>
</head>
<body id="managerPortal" data-role-root="../.." data-active="stock-count" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="រាប់ស្តុកជាក់ស្តែង"
             data-subtitle="ការរាប់ដោយមិនបង្ហាញចំនួនក្នុងប្រព័ន្ធ"
             data-back="stock-count.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <!-- ដំណាក់កាល / Banner -->
                <div id="stageBanner"></div>

                <!-- របារតម្រង និងការស្វែងរក -->
                <div class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <div id="catChips" class="flex flex-wrap items-center gap-2"></div>
                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="searchInput" type="text" oninput="searchTerm=this.value.trim().toLowerCase(); renderTable()" placeholder="ស្វែងរកឈ្មោះ ឬបាកូដ..." class="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-50 border border-slate-200 sm-td focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- តារាងរាប់ស្តុក -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between gap-3 bg-slate-50/50">
                        <div>
                            <h3 id="tableTitle" class="sm-card-title text-slate-800">បញ្ជីមុខទំនិញត្រូវរាប់</h3>
                            <p id="tableSub" class="sm-card-sub text-slate-500 mt-0.5">សូមរាប់ចំនួនជាក់ស្តែងនៅលើធ្នើ និងក្នុងស្តុក</p>
                        </div>
                        <span id="countedProgress" class="sm-badge px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-semibold text-xs sm-figure">0 / 0 បានរាប់</span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left no-min-width" id="countTable">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100">
                                <tr>
                                    <th class="sm-th py-2.5 px-4">ទំនិញ</th>
                                    <th class="sm-th py-2.5 px-4 max-md:hidden">ប្រភេទ</th>
                                    <th class="sm-th py-2.5 px-4 text-center w-28 max-md:hidden">ឯកតា</th>
                                    <th id="thSystem" class="sm-th py-2.5 px-4 text-right w-36 hidden max-md:!hidden">ស្តុកប្រព័ន្ធ</th>
                                    <th class="sm-th py-2.5 px-4 text-right w-44"><span class="max-md:hidden">ចំនួនរាប់ជាក់ស្តែង</span><span class="md:hidden">រាប់បាន</span> <span class="text-rose-500">*</span></th>
                                    <th id="thDiff" class="sm-th py-2.5 px-4 text-right w-36 hidden"><span class="max-md:hidden">ភាពខុសគ្នា</span><span class="md:hidden">ខុស</span></th>
                                </tr>
                            </thead>
                            <tbody id="countRows" class="divide-y divide-slate-100 text-slate-700"></tbody>
                        </table>
                    </div>
                </div>

                <!-- របារសកម្មភាពចុងក្រោយ (Footer Action Bar) -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                    <a href="stock-count.html" class="sm-value h-12 px-6 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold inline-flex items-center justify-center transition">បោះបង់</a>
                    <div id="actionBtnArea" class="flex items-center gap-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ផ្ទាំងដំណាក់កាលរាប់៖ ផ្ទៃស ពណ៌តែលើរូបតំណាងពេលត្រូវយកចិត្តទុកដាក់ */
        function stageBanner(icon, iconTone, title, note, step) {
            return `<div class="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between gap-3">
                <div class="flex items-start gap-3 min-w-0">
                    <i class="fas ${icon} ${iconTone} mt-1"></i>
                    <div class="min-w-0">
                        <h4 class="sm-card-title text-slate-800">${title}</h4>
                        <p class="sm-td-sub text-slate-500 mt-0.5">${note}</p>
                    </div>
                </div>
                <span class="sm-badge px-3 py-1 rounded-full bg-slate-50 text-slate-600 border border-slate-200 font-semibold flex-shrink-0">${step}</span>
            </div>`;
        }

        // ដំណាក់កាល៖ 1 = count (រាប់លើកទី 1), 2 = recount (រាប់ឡើងវិញមុខខុស), 3 = verified (ផ្ទៀងផ្ទាត់រួចរង់ចាំ save)
        let stage = 1;
        // ?cat= = រាប់តែប្រភេទមួយ (រាប់ជាផ្នែក) · គ្មាន = រាប់ទំនិញទាំងអស់
        const SCOPE_CAT = (() => { const c = new URLSearchParams(location.search).get('cat'); return c && c !== 'all' && CATEGORIES.some(x => x.id === c) ? c : ''; })();
        function scopeProducts() {
            return SCOPE_CAT ? sellableProducts().filter(p => p.category === SCOPE_CAT) : sellableProducts();
        }
        let selectedCat = 'all';
        let searchTerm = '';
        // ចំនួនរាប់ + នាទីដែលវាយ · ប្រព័ន្ធប្រៀបធៀបនឹងស្តុកនៅនាទីនោះ (អាចលក់បន្តពេលកំពុងរាប់)
        let counts = {}; // { [sku]: { first, firstAt, recount, recountAt, final, finalAt } }
        let diffSkus = new Set();
        const levelsAtCache = {};

        function levelsAt(at) {
            return levelsAtCache[at] || (levelsAtCache[at] = onHandLevelsAt(at));
        }

        // ស្តុកប្រព័ន្ធសម្រាប់មុខនេះ នៅពេលដែលចំនួនចុងក្រោយត្រូវបានវាយ
        function systemOf(sku) {
            const c = counts[sku];
            return (levelsAt(c.finalAt || isoLocal(new Date()))[sku]) || 0;
        }

        function initData() {
            scopeProducts().forEach(p => {
                counts[p.sku] = { first: null, firstAt: null, recount: null, recountAt: null, final: null, finalAt: null };
            });
        }

        function renderBanner() {
            const host = document.getElementById('stageBanner');
            if (stage === 1) {
                host.innerHTML = stageBanner('fa-eye-slash', 'text-slate-400', 'ដំណាក់កាលទី 1 · រាប់ដោយមិនឃើញចំនួនក្នុងប្រព័ន្ធ',
                    'វាយចំនួនភ្លាមៗក្រោយរាប់ធ្នើនីមួយៗ · អាចលក់បន្តបាន ប្រព័ន្ធគិតការលក់ពេលកំពុងរាប់ដោយស្វ័យប្រវត្តិ', 'ជំហាន 1 នៃ 2');
            } else if (stage === 2) {
                host.innerHTML = stageBanner('fa-rotate-right', 'text-amber-500', 'ដំណាក់កាលទី 2 · រាប់ឡើងវិញតែមុខដែលខុស',
                    `<strong class="font-semibold text-slate-800">${diffSkus.size} មុខ</strong> មិនត្រូវនឹងប្រព័ន្ធ · រាប់ធ្នើម្តងទៀត ហើយវាយចំនួនថ្មី · រាប់ឡើងវិញបានតែម្តងគត់`, 'ជំហាន 2 នៃ 2');
            } else {
                host.innerHTML = stageBanner('fa-check-double', 'text-slate-400', 'រាប់រួចរាល់',
                    'ពិនិត្យភាពខុសគ្នា រួចចុច «បញ្ជាក់ និងរក្សាទុក» ដោយលេខសម្ងាត់អ្នកគ្រប់គ្រង', 'រួចរាល់');
            }
        }

        function renderCatChips() {
            const host = document.getElementById('catChips');
            // រាប់មួយប្រភេទ៖ គ្មានតម្រងប្រភេទ បង្ហាញតែឈ្មោះប្រភេទ
            if (SCOPE_CAT) {
                host.innerHTML = `<span class="sm-badge px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-semibold">រាប់តែ ${escapeText(countScopeLabel(SCOPE_CAT))} · ${scopeProducts().length} មុខ</span>`;
                return;
            }
            host.innerHTML = CATEGORIES.map(c => `
                <button type="button" onclick="selectedCat='${c.id}'; renderCatChips(); renderTable()" class="sm-badge px-3 py-1.5 rounded-xl transition ${selectedCat === c.id
                    ? 'bg-blue-600 text-white font-semibold shadow-sm'
                    : 'text-slate-600 hover:bg-slate-100 font-medium'}">
                    <i class="fas ${c.icon} text-xs mr-1.5 ${selectedCat === c.id ? 'text-white' : 'text-slate-400'}"></i>${c.label}
                </button>
            `).join('');
        }

        function onCountInput(sku, val) {
            const parsed = parseInt(val, 10);
            const n = val === '' || isNaN(parsed) ? null : Math.max(0, parsed);
            const at = isoLocal(new Date());
            const c = counts[sku];
            if (stage === 1) {
                Object.assign(c, { first: n, firstAt: n === null ? null : at, final: n, finalAt: n === null ? null : at });
            } else if (stage === 2) {
                c.recount = n;
                c.recountAt = n === null ? null : at;
                c.final = n !== null ? n : c.first;
                c.finalAt = n !== null ? at : c.firstAt;
            }
            updateProgress();
        }

        function updateProgress() {
            const prods = scopeProducts();
            let counted = 0;
            prods.forEach(p => {
                if (counts[p.sku] && counts[p.sku].final !== null) counted++;
            });
            document.getElementById('countedProgress').textContent = `${counted} / ${prods.length} បានរាប់`;
        }

        function renderTable() {
            let prods = scopeProducts();
            // រាប់ឡើងវិញ៖ បង្ហាញតែមុខដែលត្រូវរាប់ម្តងទៀត · ពិនិត្យចុងក្រោយ៖ មុខខុសគ្នានៅខាងលើ
            if (stage === 2) prods = prods.filter(p => diffSkus.has(p.sku));
            if (stage === 3) prods = prods.filter(p => diffSkus.has(p.sku)).concat(prods.filter(p => !diffSkus.has(p.sku)));
            if (selectedCat !== 'all') {
                prods = prods.filter(p => p.category === selectedCat);
            }
            if (searchTerm) {
                prods = prods.filter(p => p.name.toLowerCase().includes(searchTerm) || p.sku.includes(searchTerm) || (p.barcode && p.barcode.includes(searchTerm)));
            }

            const thSys = document.getElementById('thSystem');
            const thDiff = document.getElementById('thDiff');
            // ចំនួនក្នុងប្រព័ន្ធបង្ហាញតែពេលពិនិត្យចុងក្រោយ · ការរាប់ឡើងវិញក៏មិនឃើញដែរ (រាប់ដោយមិនឃើញពិតប្រាកដ)
            thSys.classList.toggle('hidden', stage !== 3);
            thDiff.classList.toggle('hidden', stage !== 3);

            const catLabel = catId => (CATEGORIES.find(c => c.id === catId) || {}).label || catId;

            document.getElementById('countRows').innerHTML = prods.map(p => {
                const c = counts[p.sku] || { first: null, recount: null, final: null };
                const sys = stage === 3 ? systemOf(p.sku) : 0;
                const isDiff = diffSkus.has(p.sku);
                // រាប់ឡើងវិញ៖ ប្រអប់ទទេ (មិនបង្ហាញចំនួនលើកទី 1 ដើម្បីកុំឱ្យចម្លងតាម)
                const finalVal = stage === 2 && isDiff ? (c.recount !== null ? c.recount : '') : (c.final !== null ? c.final : '');
                const diff = (c.final !== null) ? (c.final - sys) : null;

                // ក្នុងដំណាក់កាល recount បើមិនមែនជាមុខខុស មិនអនុញ្ញាតឱ្យកែទេ
                const disabled = (stage === 2 && !isDiff) || (stage === 3);

                return `
                <tr class="hover:bg-slate-50 transition ${isDiff ? 'bg-amber-50/30' : ''}">
                    <td class="py-2.5 px-4 max-md:px-3">
                        <div class="flex items-center gap-3">
                            <span class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0 inline-flex items-center justify-center p-0.5 shadow-sm">
                                ${productImgHtml(p)}
                            </span>
                            <div class="min-w-0">
                                <p class="font-medium text-slate-800 leading-snug">${p.name}</p>
                                <p class="text-xs text-slate-400 font-mono mt-0.5">បាកូដ: ${p.barcode || p.sku}<span class="md:hidden font-sans"> · ${p.unit || 'ឯកតា'}</span></p>
                            </div>
                        </div>
                    </td>
                    <td class="py-2.5 px-4 sm-td max-md:hidden">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-lg bg-slate-100 text-slate-600 text-xs">${catLabel(p.category)}</span>
                    </td>
                    <td class="py-2.5 px-4 text-center sm-td text-slate-500 max-md:hidden">${p.unit || 'ឯកតា'}</td>
                    ${stage === 3 ? `<td class="py-2.5 px-4 text-right sm-td sm-figure font-medium text-slate-600 max-md:hidden">${sys}</td>` : ''}
                    <td class="py-2.5 px-4 text-right max-md:px-3">
                        ${stage === 3 ? `<span class="sm-figure font-semibold text-slate-800">${finalVal}</span>` : `<div class="flex items-center justify-end gap-1.5">
                            <input type="number" min="0" step="1" value="${finalVal}" ${disabled ? 'disabled' : ''} oninput="onCountInput('${p.sku}', this.value)" placeholder="${stage === 2 && isDiff ? 'រាប់ម្តងទៀត' : '0'}" class="w-28 max-md:w-24 h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-right sm-value font-semibold text-slate-800 focus:outline-none focus:border-blue-500 sm-figure ${disabled ? 'opacity-60 bg-slate-100 cursor-not-allowed' : ''} ${isDiff ? 'border-amber-400 ring-2 ring-amber-100' : ''}">
                        </div>`}
                    </td>
                    ${stage === 3 ? `
                    <td class="py-2.5 px-4 text-right sm-td sm-figure">
                        <span class="font-semibold ${diff === 0 ? 'text-slate-400' : (diff < 0 ? 'text-rose-600' : 'text-slate-800')}">${diff === 0 ? '0' : (diff > 0 ? '+' : '−') + Math.abs(diff)}</span>
                    </td>` : ''}
                </tr>`;
            }).join('');

            updateProgress();
            renderActionBtns();
        }

        function renderActionBtns() {
            const host = document.getElementById('actionBtnArea');
            if (stage === 1) {
                host.innerHTML = `
                    <button onclick="quickFillAllWithZero()" type="button" class="sm-badge h-12 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold transition">
                        ដាក់ 0 លើមុខទទេ
                    </button>
                    <button onclick="verifyFirstCount()" type="button" class="sm-value h-12 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 shadow-sm transition">
                        <span>ផ្ទៀងផ្ទាត់ការរាប់</span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                `;
            } else if (stage === 2) {
                host.innerHTML = `
                    <button onclick="finishRecount()" type="button" class="sm-value h-12 px-6 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold inline-flex items-center gap-2 shadow-sm transition">
                        <span>បញ្ចប់ការរាប់ឡើងវិញ</span>
                        <i class="fas fa-check text-xs"></i>
                    </button>
                `;
            } else {
                // បន្ទាប់ពីឃើញចំនួនក្នុងប្រព័ន្ធ មិនអាចត្រឡប់ទៅកែការរាប់វិញទេ
                host.innerHTML = `
                    <button onclick="saveCountSession()" type="button" class="sm-value h-12 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center gap-2 shadow-sm transition">
                        <i class="fas fa-lock text-xs"></i>
                        <span>បញ្ជាក់ និងរក្សាទុក</span>
                    </button>
                `;
            }
        }

        // មុខដែលមិនទាន់វាយ = 0 · សួរសិន ព្រោះ 0 មានន័យថាគ្មាននៅលើធ្នើ ហើយនឹងកត់ជាការខ្វះ
        async function quickFillAllWithZero() {
            const empty = scopeProducts().filter(p => counts[p.sku].first === null);
            if (!empty.length) { showToast('គ្រប់មុខបានវាយចំនួនរួចហើយ', 'info'); return; }
            const ok = await showCustomConfirm({
                title: `ដាក់ 0 លើ ${empty.length} មុខ?`,
                message: 'ធ្វើតែពេលអ្នកបានពិនិត្យហើយ ថាមុខទាំងនេះគ្មាននៅលើធ្នើ។ បើប្រព័ន្ធមានស្តុក វានឹងត្រូវកត់ជាការខ្វះ។',
                confirmText: 'ដាក់ 0',
                danger: true
            });
            if (!ok) return;
            const at = isoLocal(new Date());
            empty.forEach(p => Object.assign(counts[p.sku], { first: 0, firstAt: at, final: 0, finalAt: at }));
            renderTable();
        }

        function verifyFirstCount() {
            const prods = scopeProducts();
            const uncounted = prods.filter(p => counts[p.sku].first === null);
            if (uncounted.length > 0) {
                showToast(`សូមបញ្ចូលចំនួនឱ្យបានគ្រប់មុខទំនិញ (${uncounted.length} មុខមិនទាន់បានបញ្ចូល)`, 'warning');
                return;
            }

            diffSkus.clear();
            prods.forEach(p => {
                const c = counts[p.sku];
                if (c.first !== ((levelsAt(c.firstAt)[p.sku]) || 0)) diffSkus.add(p.sku);
            });
            if (diffSkus.size > 0) {
                stage = 2;
                // បង្ហាញគ្រប់មុខដែលត្រូវរាប់ម្តងទៀត (ជម្រះតម្រង)
                selectedCat = 'all';
                searchTerm = '';
                document.getElementById('searchInput').value = '';
                renderCatChips();
                renderBanner();
                renderTable();
                showToast(`${diffSkus.size} មុខមិនត្រូវនឹងប្រព័ន្ធ · សូមរាប់ធ្នើម្តងទៀត`, 'warning');
            } else {
                stage = 3;
                renderBanner();
                renderTable();
                showToast('ការរាប់ត្រូវគ្នា 100% ឥតខ្ចោះ!', 'success');
            }
        }

        function finishRecount() {
            const missing = [...diffSkus].filter(sku => counts[sku].recount === null);
            if (missing.length) {
                showToast(`សូមវាយចំនួនរាប់ឡើងវិញ ${missing.length} មុខដែលនៅសល់`, 'warning');
                return;
            }
            stage = 3;
            renderBanner();
            renderTable();
            showToast('ការរាប់ឡើងវិញត្រូវបានកត់ត្រារួចរាល់', 'info');
        }

        async function saveCountSession() {
            const prods = scopeProducts();
            const diffItems = [];
            const sessionLines = [];

            prods.forEach(p => {
                const sys = systemOf(p.sku);
                const c = counts[p.sku];
                const finalCount = c.final !== null ? c.final : (c.first !== null ? c.first : 0);
                const diff = finalCount - sys;

                sessionLines.push({
                    sku: p.sku,
                    system: sys,
                    first: c.first !== null ? c.first : 0,
                    recount: c.recount,
                    counted: finalCount,
                    countedAt: c.finalAt,
                    diff
                });

                if (diff !== 0) {
                    diffItems.push({
                        sku: p.sku,
                        name: p.name,
                        unit: p.unit || 'ឯកតា',
                        price: p.price,
                        diff,
                        system: sys,
                        counted: finalCount
                    });
                }
            });

            const diffCount = diffItems.length;
            const totalDiffUSD = diffItems.reduce((n, l) => n + Math.abs(l.diff) * l.price, 0);

            const ok = await showPinConfirm({
                title: 'បញ្ជាក់ការរក្សាទុកវគ្គរាប់ស្តុក',
                message: `សរុប ${prods.length} មុខទំនិញ<br>${diffCount ? `ភាពខុសគ្នា: <strong class="text-rose-600">${diffCount} មុខ</strong> (${fmtUSD(totalDiffUSD)})` : 'ភាពខុសគ្នា: <strong class="text-emerald-600">គ្មាន (ត្រូវ 100%)</strong>'}<br>ទិន្នន័យស្តុកនឹងត្រូវកែតម្រូវស្វ័យប្រវត្តិតាមចំនួនជាក់ស្តែង`,
                userId: ME_MANAGER,
                confirmText: 'រក្សាទុក',
                danger: diffCount > 0
            });

            if (!ok) return;

            const nowIso = isoLocal(new Date());
            const sessionId = newId('SC');

            // 1. សរសេរចលនា count move សំរាប់តែមុខណាដែលមាន diff != 0
            const moves = diffItems.map(item => stockMove({
                type: 'count',
                sku: item.sku,
                qty: item.diff, // signed: counted - system
                at: nowIso,
                by: ME_MANAGER,
                ref: sessionId,
                reason: 'រាប់ស្តុកជាក់ស្តែង',
                note: `រាប់លើកទី 1: ${counts[item.sku].first} · ចុងក្រោយ: ${item.counted}`
            }));

            if (moves.length) {
                saveStockMoves(moves);
            }

            // 2. រក្សាទុកវគ្គរាប់ពេញលេញ
            saveStockCount({
                id: sessionId,
                at: nowIso,
                by: ME_MANAGER,
                scope: SCOPE_CAT || 'all',
                lines: sessionLines
            });

            if (typeof markRecordViewed === 'function') markRecordViewed(sessionId);
            flashToast(diffCount ? `បានរក្សាទុកការរាប់ស្តុក · ស្តុកបានកែតាមចំនួនរាប់ ${diffCount} មុខ` : 'បានរក្សាទុកការរាប់ស្តុក · ត្រូវគ្នាទាំងអស់');

            location.href = 'stock-count.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            initData();
            renderBanner();
            renderCatChips();
            renderTable();
        });
    </script>
</body>
</html>
