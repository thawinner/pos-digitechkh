<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - វគ្គរាប់ស្តុក</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { blue: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#059669', 600: '#047857', 700: '#065f46', 800: '#064e3b', 900: '#053d30', 950: '#022c22' }, slate: { 50: '#fafafa', 100: '#f4f4f4', 200: '#e7e7e7', 300: '#d4d4d4', 400: '#a2a2a2', 500: '#737373', 600: '#545454', 700: '#404040', 800: '#292929', 900: '#171717', 950: '#070707' }, primary: "#047857", 'primary-dark': "#065f46", accent: "#34d399" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* បណ្ណទម្រង់៖ មិនប្រើ .bg-white ព្រោះ custom.css §17 ពង្រីកប៊ូតុងទាំងអស់ក្នុង «.bg-white មាន submit» ពេញទទឹងលើទូរស័ព្ទ */
        .form-card { background: #ffffff; }
        html.dark .form-card { background: #171717; border-color: #292929 !important; }
        .f-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #d4d4d4; background: #fff; color: #171717; }
        .f-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, .15); }
        .f-input.is-error { border-color: #fb7185; }
        html.dark .f-input { background: #111111; border-color: #404040; color: #e7e7e7; }
        .f-err { display: block; min-height: 20px; margin-top: 4px; font-size: 13.5px; color: #e11d48; }
        .ctl-kpis { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1023px) { .ctl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body id="managerPortal" data-role-root="../.." data-active="stock-count" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="វគ្គរាប់ស្តុក"
             data-subtitle="" data-back="stock-count.html"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div id="page" class="w-full space-y-5"></div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* មើលវគ្គរាប់ស្តុក — ស្តុកក្នុងប្រព័ន្ធ ធៀបនឹងចំនួនរាប់ជាក់ស្តែង · មុខខុសគ្នាបង្ហាញមុន */
        function render() {
            const id = new URLSearchParams(location.search).get('id');
            const s = mgrAllStockCounts().find(x => x.id === id);
            const page = document.getElementById('page');
            if (!s) { page.innerHTML = emptyState('fa-clipboard-check', 'រកមិនឃើញវគ្គរាប់ស្តុកនេះ', 'ត្រឡប់ទៅបញ្ជីរាប់ស្តុក'); return; }
            markRecordViewed(s.id);
            setPortalTitle(`រាប់ស្តុក ${fmtDate(s.at)}`);
            setPortalSubtitle(`${fmtTime(s.at)} · រាប់ដោយ ${personName(s.by)}`);
            const diffOf = l => l.diff != null ? l.diff : (l.counted - l.system);
            const lines = (s.lines || []).slice().sort((a, b) => (diffOf(a) === 0) - (diffOf(b) === 0) || diffOf(a) - diffOf(b));
            const diffLines = lines.filter(l => diffOf(l) !== 0);
            const lost = diffLines.reduce((n, l) => n + Math.abs(diffOf(l)) * ((getProduct(l.sku) || {}).price || 0), 0);
            page.innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 kpi-2up">
                    ${kpiCard('មុខទំនិញរាប់', `${lines.length} មុខ`, countScopeLabel(s.scope))}
                    ${kpiCard('មុខខុសគ្នា', `${diffLines.length} មុខ`, diffLines.length ? 'បានកែស្តុកតាមចំនួនរាប់' : 'ត្រូវគ្នាទាំងអស់', diffLines.length ? 'text-amber-600' : '')}
                    ${kpiCard('តម្លៃខុសគ្នាសរុប', fmtUSD(lost), 'តាមតម្លៃលក់')}
                </div>
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100"><h3 class="sm-card-title text-slate-800">មុខទំនិញ</h3></div>
                    <div class="overflow-x-auto"><table class="w-full text-left no-min-width">
                        <thead class="bg-slate-50 text-slate-500 border-b border-slate-100"><tr>
                            <th class="sm-th py-2.5 px-4">មុខទំនិញ</th>
                            <th class="sm-th py-2.5 px-4 text-right max-sm:hidden">ក្នុងប្រព័ន្ធ</th>
                            <th class="sm-th py-2.5 px-4 text-right max-sm:hidden">រាប់បាន</th>
                            <th class="sm-th py-2.5 px-4 text-right">ខុសគ្នា</th>
                            <th class="sm-th py-2.5 px-4 text-right max-sm:hidden">តម្លៃ</th>
                        </tr></thead>
                        <tbody class="divide-y divide-slate-100">${lines.map(l => {
                            const p = getProduct(l.sku);
                            const d = diffOf(l);
                            const unit = p ? p.unit : 'ឯកតា';
                            const val = Math.abs(d) * (p ? p.price : 0);
                            return `<tr>
                                <td class="py-2.5 px-4"><div class="flex items-center gap-3">
                                    <span class="w-9 h-9 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex-shrink-0">${p ? productImgHtml(p) : ''}</span>
                                    <span class="min-w-0"><span class="block sm-td font-medium text-slate-800 truncate">${p ? escapeText(p.name) : l.sku}</span>
                                    <span class="block sm-td-sub text-slate-500 sm:hidden sm-figure">ប្រព័ន្ធ ${l.system} · រាប់ ${l.counted}</span></span>
                                </div></td>
                                <td class="py-2.5 px-4 text-right sm-td sm-figure text-slate-600 max-sm:hidden">${l.system} ${unit}</td>
                                <td class="py-2.5 px-4 text-right sm-td sm-figure text-slate-800 max-sm:hidden">${l.counted} ${unit}</td>
                                <td class="py-2.5 px-4 text-right sm-td sm-figure font-semibold ${d < 0 ? 'text-rose-600' : 'text-slate-700'}">${d === 0 ? '<span class="text-slate-400">ត្រូវគ្នា</span>' : `${d > 0 ? '+' : ''}${d} ${unit}`}</td>
                                <td class="py-2.5 px-4 text-right sm-td sm-figure text-slate-600 max-sm:hidden">${val ? fmtUSD(val) : '—'}</td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table></div>
                </div>`;
        }
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
