<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគិតលុយ - ផ្ទាំងគ្រប់គ្រង</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#2563eb", 'primary-dark': "#1d4ed8", accent: "#60a5fa" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
</head>
<body id="managerPortal" data-role-root="../.." data-active="dashboard" class="bg-slate-50 font-sans text-gray-800 text-[16px] flex h-screen overflow-hidden">

    <div id="sidebarHost"></div>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="headerHost" data-title="ផ្ទាំងគ្រប់គ្រង"
             data-subtitle="ថ្ងៃប្រតិបត្តិការ"></div>
        <main class="flex-1 w-full overflow-x-hidden overflow-y-auto px-4 md:px-6 py-5">
            <div class="w-full space-y-5">
                <div id="blockedAlertBanner"></div>
                <div id="kpiRow" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 kpi-2up"></div>
                <div id="handoverSection"></div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 items-start">
                    <section id="todo" class="xl:col-span-2"></section>
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between gap-3">
                            <h3 class="sm-card-title text-slate-800">ករណីមិនប្រក្រតីថ្ងៃនេះ</h3>
                            <a href="../exceptions/exceptions.html" class="sm-badge text-blue-700 hover:text-blue-900 font-semibold whitespace-nowrap">មើលលម្អិត <i class="fas fa-arrow-right text-[10px]"></i></a>
                        </div>
                        <div id="exceptionList" class="divide-y divide-slate-100"></div>
                    </section>
                </div>

                <section class="space-y-3">
                    <div class="flex items-center justify-between gap-3">
                        <h3 class="sm-card-title text-slate-800">បញ្ជរគិតលុយ</h3>
                        <a href="../shifts/shifts.html" class="sm-badge text-blue-700 hover:text-blue-900 font-semibold whitespace-nowrap">វេនទាំងអស់ <i class="fas fa-arrow-right text-[10px]"></i></a>
                    </div>
                    <div id="registerBoard" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                </section>

                <section id="shiftCoverageBoard" class="space-y-3"></section>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-5">
                    <section class="xl:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5">
                        <h3 class="sm-card-title text-slate-800">ការលក់តាមម៉ោង</h3>
                        <p class="sm-card-sub text-slate-500">លក់សរុប (ដុល្លារ) គ្រប់បញ្ជរ</p>
                        <div id="hourBars" class="mt-3 w-full h-[220px]"></div>
                        <p id="hourEmpty" class="hidden sm-td-sub text-slate-400 text-center mt-1">មិនទាន់មានការលក់ក្នុងថ្ងៃប្រតិបត្តិការនេះទេ</p>
                    </section>
                    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5">
                        <h3 class="sm-card-title text-slate-800">វិធីទូទាត់</h3>
                        <p class="sm-card-sub text-slate-500">ចំណែកនៃការលក់ថ្ងៃនេះ</p>
                        <div id="paySplit" class="mt-5"></div>
                    </section>
                </div>

            </div>
        </main>
    </div>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/manager-data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="../../shared/scripts/charts.js"></script>
    <script>
        /* ផ្ទាំងគ្រប់គ្រង (ឯកសាររចនាលេខ 02 ផ្នែក 5.1) — អ្វីដែលត្រូវការខ្ញុំឥឡូវនេះ និងថ្ងៃនេះទៅយ៉ាងណា
           ក្រាហ្វទាំងអស់ប្រើ ECharts តាមរយៈ charts.js (posChart) */

        /* ប្រៀបធៀបជាមួយថ្ងៃប្រតិបត្តិការមុន ត្រឹមម៉ោងដដែល ដើម្បីឱ្យយុត្តិធម៌ពេលថ្ងៃនេះមិនទាន់ចប់ */
        function delta(now, before, money) {
            if (!before) return '<span class="text-slate-400">គ្មានទិន្នន័យម្សិលមិញ</span>';
            const pct = (now - before) / before * 100;
            const up = pct >= 0;
            return `<span class="${up ? 'text-emerald-600' : 'text-rose-600'} font-semibold"><i class="fas fa-arrow-${up ? 'up' : 'down'} text-[10px]"></i> ${Math.abs(pct).toFixed(0)}%</span> <span class="text-slate-400">ធៀបម្សិលមិញ ${money ? fmtUSD(before) : before}</span>`;
        }

        function renderKpis() {
            const today = mgrToday();
            const yd = addDays(new Date(businessDate() + 'T12:00'), -1);
            const now = new Date();
            const cut = s => addDays(new Date(s.time), 1) <= now;
            const agg = aggregateSales(salesInRange(today));
            const prev = aggregateSales(salesInRange({ start: yd, end: yd }).filter(cut));
            // សាច់ប្រាក់ក្នុងថតដែលកំពុងបើក · ក្រហមពេលថតណាមួយលើសកំណត់ (ត្រូវផ្ទេរចូលទូដែក)
            const st = posSettings();
            const open = mgrAllShifts().filter(x => x.status === 'open').map(summaryOf);
            const cashUSD = open.reduce((n, x) => n + x.expectedUSD, 0);
            const cashKHR = open.reduce((n, x) => n + x.expectedKHR, 0);
            const over = open.filter(x => x.expectedUSD > st.drawerLimitUSD || x.expectedKHR > st.drawerLimitKHR).length;
            document.getElementById('kpiRow').innerHTML =
                kpiCard('លក់សុទ្ធថ្ងៃនេះ', fmtUSD(agg.netSales), delta(agg.netSales, prev.netSales, true), '', '../reports/sales-report.html') +
                kpiCard('វិក្កយបត្រ', `${agg.tx}`, delta(agg.tx, prev.tx), '', '../reports/sales-report.html') +
                kpiCard('មធ្យមក្នុងមួយវិក្កយបត្រ', fmtUSD(agg.avg), delta(agg.avg, prev.avg, true), '', '../reports/sales-report.html') +
                kpiCard('សាច់ប្រាក់ក្នុងថត', fmtUSD(cashUSD),
                    over ? `<span class="text-rose-600 font-semibold">${over} ថតលើសកំណត់</span> · ត្រូវផ្ទេរចូលទូដែក`
                         : open.length ? `${fmtKHR(cashKHR)} · ក្នុង ${open.length} ថតកំពុងបើក` : 'គ្មានថតកំពុងបើក',
                    over ? 'text-rose-600' : '', '../cash/cash.html');
        }

        /* «ការងាររបស់អ្នក» — អ្វីៗដែលរង់ចាំអ្នកគ្រប់គ្រង ប្រមូលនៅកន្លែងតែមួយ ជាមួយប៊ូតុងទៅធ្វើភ្លាម */
        function renderTodo() {
            const now = new Date();
            const items = [];
            const pend = pendingApprovals();
            if (pend.length) {
                const late = now - new Date(pend[0].raisedAt) > 10 * 60000;
                items.push({ icon: 'fa-shield-halved', tone: late ? 'rose' : 'amber', title: `សំណើ ${pend.length} រង់ចាំអនុម័ត`,
                    note: `ចាស់បំផុត ${fmtDuration(now - new Date(pend[0].raisedAt))}មុន`, href: '../approvals/approvals.html', cta: 'សម្រេចទាំងអស់',
                    subs: pend.slice(0, 3).map(a => ({ href: `../approvals/view-request.html?id=${a.id}`,
                        title: `${APPROVAL_TYPE[a.type].label} · <span class="sm-figure">${fmtUSD(a.amount)}</span>`,
                        note: `${personName(a.cashierId)} · ${a.register}`,
                        age: now - new Date(a.raisedAt) })),
                    more: Math.max(0, pend.length - 3) });
            }
            const review = mgrAllShifts().filter(x => x.status === 'closed');
            if (review.length) {
                const big = review.filter(x => { const v = shiftVariance(x); return v && v.level === 'large'; }).length;
                items.push({ icon: 'fa-signature', tone: big ? 'rose' : 'slate', title: `វេន ${review.length} រង់ចាំត្រួតពិនិត្យ`,
                    note: big ? `${big} មានភាពខុសគ្នាធំ` : 'ពិនិត្យ និងចុះហត្ថលេខា',
                    href: review.length === 1 ? `../shifts/view-shift.html?id=${review[0].id}` : '../shifts/shifts.html?status=closed', cta: 'ត្រួតពិនិត្យ' });
            }
            const drops = mgrPendingDropCount();
            if (drops) items.push({ icon: 'fa-vault', tone: 'amber', title: `ប្រាក់ផ្ទេរ ${drops} រង់ចាំទទួល`, note: 'រាប់ និងបញ្ជាក់ការទទួល', href: '../cash/cash.html', cta: 'ទទួល' });
            mgrAllShifts().filter(x => x.status === 'open' && now > shiftEndDate(x)).forEach(x => items.push({
                icon: 'fa-clock', tone: 'rose', title: `${x.register} ហួសម៉ោងវេន ${fmtDuration(now - shiftEndDate(x))}`,
                note: `${personName(x.cashierId)} · ${x.templateName}`, href: `../shifts/view-shift.html?id=${x.id}`, cta: 'មើល'
            }));
            const slot = rosterSlotNow();
            if (slot) {
                const gaps = shiftTemplates()
                    .filter(t => dateAt(slot.date, t.start) > now || t.code === slot.template.code)
                    .filter(t => !rosterFor(slot.date, t.code).length);
                if (gaps.length) items.push({ icon: 'fa-user-slash', tone: 'rose', title: `${gaps.map(t => t.name).join(' · ')} គ្មានអ្នកគិតលុយ`,
                    note: 'ត្រូវរកអ្នកជំនួសក្នុងកាលវិភាគ', href: '../roster/roster.html', cta: 'ចាត់តាំង' });
            }
            const lowStock = mgrLowStockCount();
            if (lowStock) {
                items.push({ icon: 'fa-boxes-packing', tone: 'amber', title: `ទំនិញ ${lowStock} មុខជិតអស់ ឬអស់ស្តុក`,
                    note: 'ពិនិត្យបញ្ជីត្រូវបញ្ជាទិញឡើងវិញ', href: '../stock/stock.html?tab=reorder', cta: 'បញ្ជាទិញ' });
            }
            const sched = stockCountScheduleStatus();
            if (sched.isDue) {
                items.push({ icon: 'fa-clipboard-check', tone: sched.isOverdue ? 'rose' : 'slate',
                    title: sched.isOverdue ? `រាប់ស្តុកហួសកំណត់ ${sched.overdueDays} ថ្ងៃ` : 'ដល់កាលបរិច្ឆេទរាប់ស្តុក',
                    note: `កាលវិភាគ${sched.schedule === 'monthly' ? 'ប្រចាំខែ' : 'ប្រចាំសប្តាហ៍'}`,
                    href: '../stock-count/stock-count.html', cta: 'រាប់ស្តុក' });
            }
            // ការងារបន្ទាន់ (ក្រហម) នៅខាងលើ · ជួរធម្មតា៖ រូបតំណាងប្រផេះ · ប៊ូតុងសកម្មភាពមើលឃើញជានិច្ច
            items.sort((a, b) => (b.tone === 'rose') - (a.tone === 'rose'));
            const sub = x => `
                <a href="${x.href}" class="group flex items-center gap-3 pl-12 max-md:pl-5 pr-5 py-2 hover:bg-slate-50 transition">
                    <span class="min-w-0 flex-1"><span class="sm-td text-slate-700 block truncate">${x.title}</span><span class="sm-td-sub text-slate-500 block truncate">${x.note}</span></span>
                    <span class="sm-td-sub sm-figure flex-shrink-0 ${x.age > 10 * 60000 ? 'text-rose-600 font-semibold' : 'text-slate-500'}">${fmtDuration(x.age)}</span>
                    <span class="max-md:hidden sm-badge text-blue-700 group-hover:text-blue-900 font-semibold flex-shrink-0 inline-flex items-center gap-1.5">មើល<i class="fas fa-chevron-right text-[10px]"></i></span>
                </a>`;
            document.getElementById('todo').innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between gap-3">
                        <h3 class="sm-card-title text-slate-800">ការងាររបស់អ្នក</h3>
                        <span class="sm-badge text-slate-500">${items.length ? `${items.length} ត្រូវធ្វើ` : 'រួចរាល់ទាំងអស់'}</span>
                    </div>
                    ${items.length ? `<div class="divide-y divide-slate-100">${items.map(i => `
                        <div>
                        <a href="${i.href}" class="group flex items-center gap-3 px-5 py-3 hover:bg-slate-50 transition">
                            <i class="fas ${i.icon} w-4 text-center ${i.tone === 'rose' ? 'text-rose-600' : 'text-slate-400'} flex-shrink-0"></i>
                            <span class="min-w-0 flex-1"><span class="sm-value text-slate-800 block truncate">${i.title}</span><span class="sm-td-sub ${i.tone === 'rose' ? 'text-rose-600' : 'text-slate-500'} block truncate">${i.note}</span></span>
                            <span class="sm-badge text-blue-700 group-hover:text-blue-900 font-semibold flex-shrink-0 inline-flex items-center gap-1.5">${i.cta}<i class="fas fa-chevron-right text-[10px]"></i></span>
                        </a>
                        ${i.subs ? `<div class="pb-2">${i.subs.map(sub).join('')}${i.more ? `<a href="${i.href}" class="block pl-12 pr-5 py-1.5 sm-td-sub text-blue-700 hover:text-blue-900 font-semibold">និង ${i.more} សំណើទៀត</a>` : ''}</div>` : ''}
                        </div>`).join('')}</div>`
                    : '<div class="px-5 py-8 text-center"><i class="fas fa-circle-check text-slate-300 text-2xl"></i><p class="sm-value text-slate-700 mt-2">គ្មានអ្វីរង់ចាំអ្នកទេ</p><p class="sm-td-sub text-slate-500">បញ្ជរទាំងអស់ដំណើរការធម្មតា</p></div>'}
                </div>`;
        }

        /* ស្ថានភាពជាចំណុចពណ៌ និងអត្ថបទ (មិនមែនស្លាកពណ៌ពេញ) · បៃតង = កំពុងដំណើរការ លឿង = ត្រូវយកចិត្តទុកដាក់ ក្រហម = បញ្ហា */
        const DOT_TONE = {
            green: ['bg-emerald-500', 'text-slate-700'],
            amber: ['bg-amber-500', 'text-amber-700'],
            rose: ['bg-rose-500', 'text-rose-600'],
            slate: ['bg-slate-300', 'text-slate-500']
        };
        function statusDot(label, tone) {
            const [dot, text] = DOT_TONE[tone] || DOT_TONE.slate;
            return `<span class="inline-flex items-center gap-1.5 sm-td ${text} whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full ${dot} flex-shrink-0"></span>${label}</span>`;
        }

        function registerMenu(register, open, sh) {
            const menuId = `regMenu-${register}`;
            const item = (onclick, icon, label) => `<button type="button" onclick="${onclick}" class="sm-row-menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-50 text-left"><i class="fas ${icon} w-4 text-center text-slate-400"></i>${label}</button>`;
            return `<div class="relative inline-block">
                <button onclick="toggleRowActionMenu(event, '${menuId}')" type="button" aria-label="សកម្មភាព"
                    class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-800 inline-flex items-center justify-center"><i class="fas fa-ellipsis-vertical text-sm"></i></button>
                <div id="${menuId}" class="hidden bg-white rounded-xl shadow-2xl border border-slate-200 p-1.5 text-left">
                    ${sh ? item(`location.href='../shifts/view-shift.html?id=${sh.id}'`, 'fa-eye', open ? 'របាយការណ៍ពាក់កណ្តាលវេន' : 'មើលវេនចុងក្រោយ') : ''}
                    ${open ? item(`location.href='../cash/create-movement.html?type=payout&register=${register}'`, 'fa-money-bill-transfer', 'ដកប្រាក់ចំណាយ')
                           : item(`location.href='../cash/create-movement.html?type=float&register=${register}'`, 'fa-hand-holding-dollar', 'ចេញប្រាក់បាតថត')}
                </div>
            </div>`;
        }

        /* បញ្ជរគិតលុយ — កាតមួយក្នុងមួយបញ្ជរ · ផ្ទៃសាមញ្ញ តួលេខជាស្លាក/តម្លៃ គ្មានប្រអប់ក្នុងប្រអប់ */
        function renderRegisters() {
            const st = posSettings();
            const now = new Date();
            const stat = (label, value, cls) => `<div><p class="sm-td-sub text-slate-500">${label}</p><p class="sm-td-strong sm-figure ${cls || 'text-slate-800'}">${value}</p></div>`;
            document.getElementById('registerBoard').innerHTML = REGISTERS.map(register => {
                const open = mgrAllShifts().find(s => s.register === register && s.status === 'open');
                const last = mgrAllShifts().find(s => s.register === register);
                const sh = open || last;
                let status, body, footer;
                if (open) {
                    const s = summaryOf(open);
                    const lastSale = salesOfAnyShift(open.id)[0];
                    const over = s.expectedUSD > st.drawerLimitUSD || s.expectedKHR > st.drawerLimitKHR;
                    const overrun = now - shiftEndDate(open);

        function renderHours() {
            const sales = salesInRange(mgrToday()).filter(s => !isVoided(s));
            const hours = {};
            const tpls = shiftTemplates();
            const overnight = tpls.some(t => minutesOf(t.end) <= minutesOf(t.start));
            const first = overnight ? 0 : Math.floor(Math.min(...tpls.map(t => minutesOf(t.start))) / 60);
            const last = overnight ? 24 : Math.ceil(Math.max(...tpls.map(t => minutesOf(t.end) || 1440)) / 60);
            for (let h = first; h < last; h++) hours[h] = 0;
            sales.forEach(s => {
                const h = new Date(s.time).getHours();
                hours[h] = (hours[h] || 0) + saleTotals(s.items, s.discountPercent).gross;
            });
            const nowH = new Date().getHours();
            const keys = Object.keys(hours).map(Number);
            document.getElementById('hourEmpty').classList.toggle('hidden', !!sales.length);
            posChart('hourBars', {
                xAxis: chartCategoryAxis(keys.map(h => pad2(h))),
                yAxis: chartValueAxis(v => '$' + v),
                tooltip: {
                    formatter: ps => {
                        const h = keys[ps[0].dataIndex];
                        const n = sales.filter(s => new Date(s.time).getHours() === h).length;
                        return chartTipTitle(`${pad2(h)}:00 – ${pad2((h + 1) % 24)}:00`) +
                            chartTipRow(CHART_TONE.accent, 'លក់សរុប', fmtUSD(hours[h])) +
                            chartTipRow('#94a3b8', 'វិក្កយបត្រ', n);
                    }
                },
                series: [{
                    type: 'bar', barMaxWidth: 26,
                    itemStyle: { borderRadius: [4, 4, 0, 0] },
                    data: keys.map(h => ({ value: +hours[h].toFixed(2), itemStyle: { color: h === nowH ? CHART_TONE.accentStrong : CHART_TONE.accent } }))
                }]
            });
        }

        function renderCoverageBoard() {
            const host = document.getElementById('shiftCoverageBoard');
            if (!host) return;
            const bd = businessDate();
            const now = new Date();
            const templates = shiftTemplates();
            const allLiveOpen = liveShifts().filter(s => s.status === 'open');

            // គណនាទិន្នន័យបុគ្គលិកតាមវេននីមួយៗ (យ៉ាងតិច 1 នាក់ក្នុងមួយវេន)
            const templateData = templates.map(t => {
                const roster = rosterFor(bd, t.code);
                const openShifts = allLiveOpen.filter(s => s.templateCode === t.code || (s.template && s.template.code === t.code));
                const start = dateAt(bd, t.start);
                const end = shiftEndDate({ date: bd, start: t.start, end: t.end });
                const isCurrent = now >= start && now <= end;
                const isPast = now > end;
                const isFuture = now < start;
                const msToStart = start - now;

                // ប្រាក់បាតថត៖ ពាក់ព័ន្ធតែវេនដែលនឹងចាប់ផ្តើមក្នុង 30 នាទី និងបញ្ជររបស់អ្នកក្នុងវេននោះ
                const soon = isFuture && msToStart <= 30 * 60000;
                const hasPendingFloat = soon && roster.length && REGISTERS.filter(r => pendingFloatFor(r)).length >= roster.length;
                let floatBadge = '';
                if (hasPendingFloat) {
                    floatBadge = '<span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium inline-flex items-center gap-1"><i class="fas fa-coins text-[10px]"></i>បាតថតត្រៀមរួច</span>';
                } else if (soon && roster.length) {
                    floatBadge = '<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-medium inline-flex items-center gap-1"><i class="fas fa-triangle-exclamation text-[10px]"></i>មិនទាន់ចេញបាតថត</span>';
                }

                const crew = [];
                roster.forEach(a => {
                    const active = openShifts.find(s => s.cashierId === a.cashierId);
                    // ម៉ោងថ្ងៃនេះ ប៉ាន់ដល់ចុងវេនដែលកំពុងបើក (មិនមែនត្រឹមឥឡូវ) + វេននេះ
                    const otherOpen = allLiveOpen.find(s => s.cashierId === a.cashierId && s.templateCode !== t.code && s.date === bd);
                    const projected = hoursWorkedToday(a.cashierId, bd) + (otherOpen ? Math.max(0, (shiftEndDate(otherOpen) - now) / 3600000) : 0);
                    let ownH = templateHours(t);
                    if (a.until) ownH = ((minutesOf(a.until) - minutesOf(a.from || t.start) + 1440) % 1440) / 60;
                    const willExceed12 = !active && !isPast && !!otherOpen && projected + ownH > 12;

                    let statusText = '';
                    let statusTone = '';
                    const used = active || mgrAllShifts().find(s => s.date === bd && s.templateCode === t.code && s.cashierId === a.cashierId);
                    if (active) {
                        statusText = 'កំពុងធ្វើការ';
                        statusTone = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    } else if (isPast) {
                        // បានបិទវេន ឬមិនបានមកបើកវេនសោះ (មិនមែន «បានបញ្ចប់» ដូចគ្នាទាំងពីរ)
                        const done = !!used;
                        statusText = done ? 'បានបិទវេន' : 'មិនបានបើកវេន';
                        statusTone = done ? 'bg-slate-100 text-slate-500 border-slate-200' : 'bg-amber-50 text-amber-700 border-amber-200';
                    } else if (now > start) {
                        statusText = `យឺត ${fmtDuration(now - start)}`;
                        statusTone = 'bg-rose-50 text-rose-700 border-rose-200';
                    } else {
                        statusText = 'ត្រៀមចូលវេន';
                        statusTone = 'bg-slate-50 text-slate-600 border-slate-200';
                    }

                    crew.push({
                        cashierId: a.cashierId,
                        register: used ? used.register : '',
                        seat: used ? used.register : a.pin && a.register ? `ភ្ជាប់ ${a.register}` : isPast ? '' : 'ជ្រើសបញ្ជរពេលបើកវេន',
                        statusText,
                        statusTone,
                        willExceed12,
                        cover: a.cover
                    });
                });

                openShifts.forEach(sh => {
                    if (!roster.some(a => a.cashierId === sh.cashierId)) {
                        crew.push({
                            cashierId: sh.cashierId,
                            register: sh.register,
                            seat: sh.register,
                            statusText: 'ជំនួសវេន',
                            statusTone: 'bg-amber-50 text-amber-700 border-amber-200',
                            willExceed12: false,
                            cover: true
                        });
                    }
                });

                const isCovered = crew.length >= 1;

                return {
                    t,
                    crew,
                    isCovered,
                    isCurrent,
                    isPast,
                    isFuture,
                    floatBadge
                };
            });

            const coveredCount = templateData.filter(d => d.isCovered).length;
            const totalCount = templateData.length;
            const tone = t => /យឺត/.test(t) ? 'rose' : /មិនបានបើក|ជំនួសវេន/.test(t) ? 'amber' : t === 'កំពុងធ្វើការ' ? 'green' : 'slate';
            const cards = templateData.map(d => {
                const { t, crew, isCovered, isCurrent, isPast, floatBadge } = d;
                const phase = !isCovered ? statusDot('គ្មានអ្នកគិតលុយ', 'rose') : isCurrent ? statusDot('ឥឡូវនេះ', 'green') : isPast ? statusDot('បានបញ្ចប់', 'slate') : statusDot('មិនទាន់ដល់', 'slate');
                const floatNote = floatBadge ? (floatBadge.includes('មិនទាន់') ? '<p class="sm-td-sub text-amber-700 mt-2">មិនទាន់ចេញបាតថត</p>' : '<p class="sm-td-sub text-slate-500 mt-2">បាតថតត្រៀមរួច</p>') : '';
                const people = crew.length ? crew.slice().sort((x, y) => (x.register || 'ZZ').localeCompare(y.register || 'ZZ')).map(c => `
                    <div class="flex items-center gap-2.5 py-2.5">
                        ${avatarHtml(c.cashierId, 'w-8 h-8')}
                        <div class="min-w-0 flex-1">
                            <p class="sm-td text-slate-800 truncate">${personName(c.cashierId)}${c.cover ? ' <span class="sm-td-sub text-amber-700">· ជំនួស</span>' : ''}</p>
                            ${c.seat ? `<p class="sm-td-sub text-slate-500 sm-figure">${c.seat}</p>` : ''}
                        </div>
                        <div class="text-right flex-shrink-0">${statusDot(c.statusText, tone(c.statusText))}${c.willExceed12 ? '<p class="sm-td-sub text-rose-600">នឹងលើស 12 ម៉ោង</p>' : ''}</div>
                    </div>`).join('')
                    : '<p class="sm-td text-rose-600 py-2.5">គ្មានអ្នកគិតលុយក្នុងវេននេះ</p>';
                return `<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 flex flex-col min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div><p class="sm-card-title text-slate-800">${t.name}</p><p class="sm-td-sub text-slate-500 sm-figure">${t.start}–${t.end} · ${templateHours(t)} ម៉ោង</p></div>
                        ${phase}
                    </div>
                    <div class="mt-3 border-t border-slate-100 divide-y divide-slate-100 flex-1">${people}</div>
                    ${floatNote}
                    ${isPast ? '' : `<div class="mt-3 pt-3 border-t border-slate-100 flex justify-end"><a href="../roster/roster.html?template=${t.code}" class="sm-badge font-semibold ${isCovered ? 'text-blue-700 hover:text-blue-900' : 'text-rose-700 hover:text-rose-900'}">${isCovered ? 'កែកាលវិភាគ' : 'រកអ្នកជំនួស'}</a></div>`}
                </div>`;
            }).join('');

            host.innerHTML = `
                <div class="flex items-center justify-between gap-3">
                    <div>
                        <h3 class="sm-card-title text-slate-800">វេនថ្ងៃនេះ</h3>
                        <p class="sm-card-sub ${coveredCount === totalCount ? 'text-slate-500' : 'text-rose-600'}">${coveredCount === totalCount ? `គ្រប់ ${totalCount} វេនមានអ្នកគិតលុយ` : `ខ្វះអ្នកគិតលុយ ${totalCount - coveredCount} វេន`}</p>
                    </div>
                    <a href="../roster/roster.html" class="sm-badge text-blue-700 hover:text-blue-900 font-semibold whitespace-nowrap">កាលវិភាគវេន <i class="fas fa-arrow-right text-[10px]"></i></a>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-${Math.min(templateData.length, 3)} gap-4">${cards}</div>`;
        }

        function renderAll() {
            renderBlockedBanner();
            renderHandoverCard();
            renderCoverageBoard();
            renderKpis();
            renderTodo();
            renderRegisters();
            renderExceptions();
            renderHours();
            renderPaySplit();
            updatePortalBadges();
            refreshPortalNotifications();
        }

        window.onStoreChanged = renderAll;
        window.onThemeChanged = renderAll;

        document.addEventListener('DOMContentLoaded', () => {
            setPortalSubtitle(`ថ្ងៃប្រតិបត្តិការ ${fmtKhDate(businessDate() + 'T12:00')} · ${MERCHANT.branch} · ${personName(ME_MANAGER)}`);
            renderAll();
            setInterval(renderAll, 60000);
        });
    </script>
</body>
</html>
