<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITECHKH - ចាប់ផ្តើមវេន</title>
    <link rel="icon" type="image/png" href="../../shared/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#0891b2", 'primary-dark': "#0e7490", accent: "#22d3ee" },
                    fontFamily: { sans: ["'Kantumruy Pro'", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../shared/styles/custom.css">
    <link rel="stylesheet" href="../../shared/styles/portal.css">
    <style>
        /* ទំព័រចាប់ផ្តើមវេន — រចនាងងឹតដូចផ្ទាំងគិតលុយ (មិនមែនទម្រង់ដូចទំព័របិទវេនទេ)
           ព្រោះនេះជាច្រកចូលផ្ទាំងគិតលុយ មិនមែនការងាររដ្ឋបាល */
        .os-shell { min-height: 100vh; min-height: 100dvh; background: #0b1220; }
        .os-panel { background: #111a2b; border: 1px solid rgba(255, 255, 255, .08); }
        .os-shell button, .os-shell a.os-tap { min-height: 44px; }
        .os-num::-webkit-outer-spin-button, .os-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .os-num { -moz-appearance: textfield; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .fade-up { animation: fadeUp .22s ease; }
    </style>
</head>
<body id="posPortal" data-role-root="../.." data-active="pos" class="os-shell font-sans text-slate-100 text-[16px] flex flex-col">

    <!-- ===== របារខាងលើ (ដូចផ្ទាំងគិតលុយ) ===== -->
    <header class="h-14 flex-shrink-0 border-b border-white/10 bg-[#0b1220] flex items-center justify-between gap-3 px-3 md:px-5">
        <div class="flex items-center gap-2.5 min-w-0">
            <img src="../../shared/assets/logo-mark-transparent.png" alt="DIGITECHKH" class="w-7 h-7 object-contain flex-shrink-0">
            <div class="flex-shrink-0">
                <span class="sm-value text-white leading-tight whitespace-nowrap block">ចាប់ផ្តើមវេន</span>
                <span id="regLabel" class="sm-td-sub text-slate-400 leading-tight whitespace-nowrap block"></span>
            </div>
        </div>
        <span class="hidden sm:!inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10">
            <i class="fas fa-clock text-cyan-400 text-xs"></i>
            <span id="liveClock" class="sm-badge text-white font-semibold sm-figure"></span>
        </span>
        <div class="flex items-center gap-2 flex-shrink-0">
            <!-- Dark Mode Toggle Button -->
            <button onclick="toggleDarkMode()" type="button" aria-label="ប្តូររវាងទម្រង់ភ្លឺ និងទម្រង់ងងឹត" id="darkModeToggleBtn"
                class="w-9 h-9 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 flex items-center justify-center transition cursor-pointer">
                <iconify-icon id="darkModeIcon" icon="mdi:weather-night" class="text-lg"></iconify-icon>
            </button>
            <span id="meChip" class="flex items-center gap-2"></span>
            <button onclick="handleLogout()" type="button" aria-label="ចាកចេញ"
                class="px-3 rounded-xl text-slate-300 hover:text-rose-200 hover:bg-rose-500/10 inline-flex items-center gap-2 transition">
                <i class="fas fa-right-from-bracket"></i><span class="sm-badge hidden md:!inline">ចាកចេញ</span>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full px-3 md:px-6 py-5">
        <!-- របារជំហាន -->
        <div id="steps" class="w-full max-w-2xl mx-auto mb-5"></div>
        <div id="stage" class="w-full"></div>
    </main>

    <script src="../../shared/scripts/ui-components.js"></script>
    <script src="../../shared/scripts/data.js"></script>
    <script src="../../shared/scripts/portal.js"></script>
    <script>
        /* ចាប់ផ្តើមវេន (ផែនការកែលម្អ C3 · C22 · ឯកសាររចនាលេខ 02 ផ្នែក 11)
           ជំហាន 1 ទិដ្ឋភាពរួម៖ កាលវិភាគថ្ងៃនេះ (មាន / គ្មាន) ការជ្រើសរើសវេន ប្រាក់បាតថតដែលត្រូវទទួល
           ជំហាន 2 រាប់ប្រាក់បាតថតតាមក្រដាសប្រាក់ · ជំហាន 3 អ្នកគ្រប់គ្រងបញ្ជាក់ដោយលេខសម្ងាត់
           វេនមួយ = អ្នកគិតលុយម្នាក់ ថតប្រាក់មួយ (ច្បាប់មនុស្សពីរនាក់ — ស្រាវជ្រាវ §4) */

        const countUSD = {};
        const countKHR = {};
        let templateCode = '';
        let mismatchNote = '';
        let stage = 'overview';   // overview | count
        let customRegister = '';
        let isShortShift = false;
        let shortShiftCap = '';
        let wasRegBusy = false;

        /* បញ្ជរដែលត្រូវបើក៖ តាមកាលវិភាគនៃវេនដែលបានជ្រើស បើគ្មាន ប្រើបញ្ជរដែលប្រព័ន្ធកំណត់ពេលចូលប្រើ */
        function reg() {
            if (customRegister) return customRegister;
            const t = chosenTemplate();
            const a = t && rosterFor(templateDateFor(t, new Date()), t.code).find(x => x.cashierId === ME_CASHIER);
            return a ? a.register : MY_REGISTER;
        }

        function regBusy() {
            return liveShifts().some(x => x.status === 'open' && x.register === reg() && x.cashierId !== ME_CASHIER);
        }

        function regBusyShift() {
            return liveShifts().find(x => x.status === 'open' && x.register === reg() && x.cashierId !== ME_CASHIER) || null;
        }

        function freeRegisters() {
            const openRegs = liveShifts().filter(x => x.status === 'open').map(x => x.register);
            return REGISTERS.filter(r => !openRegs.includes(r) && r !== reg());
        }

        function switchRegister(newReg) {
            customRegister = newReg;
            showToast(`បានប្តូរទៅបញ្ជរ ${newReg}`, 'info');
            render();
        }

        function issuedFloat() {
            const m = pendingFloatFor(reg());
            const st = posSettings();
            return m
                ? { usd: m.usd, khr: m.khr, movement: m, by: m.createdBy }
                : { usd: st.defaultFloatUSD, khr: st.defaultFloatKHR, movement: null, by: '' };
        }

        function totalUSD() {
            return USD_NOTES.reduce((s, n) => s + n * (countUSD[n] || 0), 0);
        }

        function totalKHR() {
            return KHR_NOTES.reduce((s, n) => s + n * (countKHR[n] || 0), 0);
        }

        function chosenTemplate() {
            return shiftTemplates().find(t => t.code === templateCode) || null;
        }

        function workedToday() {
            const today = templateDateFor(chosenTemplate() || shiftTemplates()[0], new Date());
            return typeof hoursWorkedToday === 'function' ? hoursWorkedToday(ME_CASHIER, today) : 0;
        }

        function fmtHoursDuration(h) {
            const totalMinutes = Math.round(h * 60);
            const hrs = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            if (hrs > 0 && mins > 0) return `${hrs} ម៉ោង ${mins} នាទី`;
            if (hrs > 0) return `${hrs} ម៉ោង`;
            return `${mins} នាទី`;
        }

        /* កាលវិភាគរបស់ខ្ញុំថ្ងៃនេះ (គ្រប់វេន) — មិនត្រឹមតែវេនបច្ចុប្បន្ន */
        function myRosterToday() {
            const slot = rosterSlotNow();
            if (!slot) return [];
            return shiftTemplates().map(t => {
                const date = templateDateFor(t, new Date());
                const a = rosterFor(date, t.code).find(x => x.cashierId === ME_CASHIER);
                return a ? Object.assign({ template: t, date }, a) : null;
            }).filter(Boolean);
        }

        /* ពេលវេលាធៀបនឹងវេន៖ មិនទាន់ដល់ / ដល់ម៉ោង / ហួសម៉ោង */
        function timing(t) {
            const now = new Date();
            const start = dateAt(templateDateFor(t, now), t.start);
            const end = shiftEndDate({ date: templateDateFor(t, now), start: t.start, end: t.end });
            if (now < start) return { state: 'soon', text: `ចាប់ផ្តើមក្នុង ${fmtDuration(start - now)}`, tone: 'text-sky-300' };
            if (now > end) return { state: 'past', text: `បានបញ្ចប់ម៉ោង ${t.end}`, tone: 'text-slate-400' };
            const late = now - start;
            return late > 10 * 60000
                ? { state: 'late', text: `យឺត ${fmtDuration(late)} ក្រោយម៉ោងចាប់ផ្តើម`, tone: 'text-amber-300' }
                : { state: 'now', text: 'ដល់ម៉ោងចាប់ផ្តើមហើយ', tone: 'text-emerald-300' };
        }

        /* ===== របារជំហាន ===== */

        function renderSteps() {
            bmsStepper('steps', {
                dark: true,
                variant: 'icon',
                size: 'md',
                tone: 'amber',
                doneTone: 'brand',
                current: stage === 'overview' ? 1 : 2,
                steps: [{ icon: 'fa-calendar-day', label: 'ជ្រើសរើសវេន' }, { icon: 'fa-coins', label: 'រាប់ប្រាក់បាតថត' }, { icon: 'fa-user-shield', label: 'អ្នកគ្រប់គ្រងបញ្ជាក់' }],
                onStep: n => { if (n === 1) { stage = 'overview'; render(); } }
            });
        }

        /* ===== ជំហាន 1៖ ទិដ្ឋភាពរួម ===== */

        /* វេននីមួយៗជាជួរជ្រើសរើស (radio) — មិនមែនកាតធំៗ */
        function templateRow(t, mine) {
            const on = t.code === templateCode;
            const tm = timing(t);
            const crew = rosterFor(templateDateFor(t, new Date()), t.code).filter(a => a.cashierId !== ME_CASHIER);
            const tag = mine ? '<span class="sm-td-sub text-cyan-300 whitespace-nowrap">វេនរបស់ខ្ញុំ</span>'
                : on ? '<span class="sm-td-sub text-amber-300 whitespace-nowrap">ជំនួសវេន</span>' : '';
            return `<button onclick="pickTemplate('${t.code}')" type="button" role="radio" aria-checked="${on}"
                class="w-full text-left flex items-center gap-4 px-5 py-4 transition-colors ${on ? 'bg-white/[0.05]' : 'hover:bg-white/[0.03]'}">
                <span class="w-5 h-5 rounded-full border-2 ${on ? 'border-cyan-400' : 'border-slate-600'} inline-flex items-center justify-center flex-shrink-0">
                    ${on ? '<span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>' : ''}</span>
                <span class="min-w-0 flex-1 grid grid-cols-1 md:grid-cols-[200px_minmax(0,1fr)] gap-x-6 gap-y-0.5 items-center">
                    <span>
                        <span class="sm-value ${on ? 'text-white' : 'text-slate-200'} block">${t.name}</span>
                        <span class="sm-td-sub sm-figure text-slate-400 block">${t.start}–${t.end} · ${templateHours(t)} ម៉ោង</span>
                    </span>
                    <span class="min-w-0">
                        <span class="sm-td-sub ${tm.tone} block">${tm.text}</span>
                        <span class="sm-td-sub text-slate-500 block truncate">${crew.length ? crew.map(a => `${personName(a.cashierId)} ${a.register}`).join(' · ') : 'មិនមានអ្នកផ្សេងក្នុងវេននេះ'}</span>
                    </span>
                </span>
                ${tag}
            </button>`;
        }

        function notifyManagerBlocked(t) {
            if (!t) return;
            logPosEvent('shift_blocked', {
                cashierId: ME_CASHIER,
                register: reg(),
                templateCode: t.code,
                reason: 'over_12h',
                workedHours: workedToday(),
                date: templateDateFor(t, new Date())
            });
            showToast('បានជូនដំណឹងអ្នកគ្រប់គ្រងអំពីបញ្ហាកំណត់ម៉ោងរួចរាល់', 'info');
        }

        function shiftPanel() {
            const mine = myRosterToday();
            const t = chosenTemplate();
            const me = personById(ME_CASHIER);
            const hour = new Date().getHours();
            const hello = hour < 11 ? 'អរុណសួស្តី' : hour < 17 ? 'ទិវាសួស្តី' : 'សាយណ្ហសួស្តី';
            const m = mine.find(x => x.template.code === templateCode);
            const cover = t && !m;
            const status = mine.length
                ? `<p class="sm-td text-slate-300"><i class="fas fa-calendar-check text-slate-500 mr-2"></i>វេនរបស់អ្នកថ្ងៃនេះ៖ <span class="text-white font-semibold">${mine.map(x => `${x.template.name} ${x.template.start}–${x.template.end} · ${x.register}`).join(' · ')}</span></p>`
                : `<p class="sm-td text-slate-300"><i class="fas fa-calendar-xmark text-amber-300 mr-2"></i><span class="text-white font-semibold">ថ្ងៃនេះអ្នកមិនមានវេនក្នុងកាលវិភាគទេ</span></p>
                   <p class="sm-td-sub text-slate-400 mt-1 ml-6">បើមកជំនួសវេនអ្នកណាម្នាក់ សូមជ្រើសរើសវេនខាងក្រោម។ អ្នកគ្រប់គ្រងត្រូវអនុម័ត ហើយកាលវិភាគនឹងកត់ត្រាថា «ជំនួស»។</p>`;

            const over = t && (workedToday() + templateHours(t) > 12);
            const cap = over ? capFor(ME_CASHIER, templateDateFor(t, new Date()), t.start) : null;
            const busy = regBusy();
            const bShift = regBusyShift();
            const bPast = bShift && bShift.end && new Date() > shiftEndDate({ date: bShift.date, start: bShift.start, end: bShift.end });

            return `<div class="os-panel rounded-xl overflow-hidden">
                <div class="px-5 py-4 flex items-center gap-3 border-b border-white/[0.08]">
                    ${avatarHtml(me.id, 'w-11 h-11')}
                    <div class="min-w-0 flex-1">
                        <p class="sm-value text-white leading-tight">${me.name}</p>
                        <p class="sm-td-sub text-slate-400">${hello} · អ្នកគិតលុយ</p>
                    </div>
                </div>
                <div class="px-5 py-4 border-b border-white/[0.08]">${status}</div>
                ${busy ? `<div class="px-5 py-3.5 bg-amber-500/10 border-b border-amber-500/20 space-y-2">
                    <div class="flex items-center gap-2 text-amber-200">
                        <i class="fas fa-triangle-exclamation text-amber-400"></i>
                        <span class="sm-value text-white">បញ្ជរ ${reg()} កំពុងបើកវេន</span>
                    </div>
                    <p class="sm-td-sub text-amber-200/90">
                        ${bPast
                            ? `បញ្ជរ ${reg()} កំពុងប្រើដោយ ${personName(bShift.cashierId)} (វេនចប់ម៉ោង ${bShift.end})។ សូមរង់ចាំ ${personName(bShift.cashierId)} បិទវេន ឬប្តូរទៅបញ្ជរទំនេរ។`
                            : `បញ្ជរ ${reg()} កំពុងប្រើដោយ ${personName(bShift ? bShift.cashierId : '')}។`}
                    </p>
                    <div class="flex flex-wrap items-center gap-2 pt-1">
                        ${freeRegisters().map(r => `
                            <button type="button" onclick="switchRegister('${r}')" class="h-8 px-2.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white sm-td-sub font-semibold transition">
                                <i class="fas fa-arrow-right-arrow-left mr-1"></i> ប្តូរទៅបញ្ជរ ${r}
                            </button>
                        `).join('')}
                        <button type="button" onclick="render()" class="h-8 px-2.5 rounded-lg bg-white/10 hover:bg-white/15 text-slate-200 sm-td-sub font-medium transition">
                            <i class="fas fa-rotate mr-1"></i> រង់ចាំ / ពិនិត្យឡើងវិញ
                        </button>
                    </div>
                </div>` : ''}
                ${over ? (cap ? `<div class="px-5 py-3.5 bg-amber-500/10 border-b border-amber-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <p class="sm-value text-amber-200"><i class="fas fa-clock text-amber-400 mr-1.5"></i>អ្នកបានធ្វើការ ${fmtHoursDuration(cap.workedHours)} ថ្ងៃនេះ</p>
                        <p class="sm-td-sub text-amber-300/80">អាចបើកវេនខ្លីដល់ម៉ោង ${cap.capTime} (នៅសល់ ${fmtHoursDuration(cap.remainHours)}) · ត្រូវការអ្នកគ្រប់គ្រងអនុម័ត</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="notifyManagerBlocked(chosenTemplate())" class="h-9 px-3 rounded-lg bg-white/10 hover:bg-white/15 text-slate-200 sm-td-sub font-medium transition">
                            ជូនដំណឹងអ្នកគ្រប់គ្រង
                        </button>
                        <button type="button" onclick="goCount(true)" class="h-9 px-3.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 sm-td-sub font-semibold transition">
                            <i class="fas fa-hourglass-half mr-1"></i> បើកវេនខ្លី ដល់ ${cap.capTime}
                        </button>
                    </div>
                </div>` : `<div class="px-5 py-3.5 bg-rose-500/10 border-b border-rose-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <p class="sm-value text-rose-200"><i class="fas fa-ban text-rose-400 mr-1.5"></i>លើសកំណត់ច្បាប់ 12 ម៉ោងក្នុងមួយថ្ងៃ</p>
                        <p class="sm-td-sub text-rose-300/80">អ្នកបានធ្វើការ ${fmtHoursDuration(workedToday())} ថ្ងៃនេះ (នៅសល់តិចជាង 2 ម៉ោង មិនអាចបើកវេនបានទេ)</p>
                    </div>
                    <button type="button" onclick="notifyManagerBlocked(chosenTemplate())" class="h-9 px-3 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 sm-td-sub font-medium transition">
                        ជូនដំណឹងអ្នកគ្រប់គ្រង
                    </button>
                </div>`) : ''}
                <p class="px-5 pt-4 pb-2 sm-eyebrow text-slate-400">ជ្រើសរើសវេនដែលត្រូវបើក</p>
                <div role="radiogroup" class="divide-y divide-white/[0.06] border-y border-white/[0.06]">
                    ${shiftTemplates().map(x => templateRow(x, mine.some(y => y.template.code === x.code))).join('')}
                </div>
                <div class="px-5 py-4 flex flex-wrap items-center justify-between gap-3 bg-black/10">
                    <div class="min-w-0">
                        <p class="sm-td-sub text-slate-400">នឹងបើក</p>
                        <p class="sm-value text-white">${t ? `${t.name} · ${reg()}` : '—'}${cover ? ' <span class="sm-td-sub text-amber-300 font-medium ml-1">ជំនួសវេន</span>' : ''}${isShortShift ? ` <span class="sm-td-sub text-amber-300 font-medium ml-1">(វេនខ្លី ដល់ម៉ោង ${shortShiftCap})</span>` : ''}</p>
                        <p id="limitNote" class="sm-td-sub text-rose-300"></p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        ${mine.length ? '' : `<button onclick="handleLogout()" type="button" class="sm-td h-12 px-4 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 font-medium inline-flex items-center gap-2 transition-colors">
                            មិនមែនទេ · ចាកចេញ</button>`}
                        <button onclick="goCount(false)" type="button" ${t && !over && !busy ? '' : 'disabled'}
                            class="sm-value h-12 px-6 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold inline-flex items-center gap-2 transition-colors disabled:opacity-40">
                            រាប់ប្រាក់បាតថត <i class="fas fa-arrow-right text-[13px]"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function sidePanel() {
            const f = issuedFloat();
            const last = lastShiftFor(reg());
            const ct = chosenTemplate();
            const slot = ct ? { date: templateDateFor(ct, new Date()), template: ct } : rosterSlotNow();
            const team = slot ? rosterFor(slot.date, slot.template.code) : [];
            const sec = (title, body) => `<div class="px-5 py-4">
                    <p class="sm-eyebrow text-slate-400">${title}</p>
                    <div class="mt-2">${body}</div>
                </div>`;
            return `<div class="os-panel rounded-xl divide-y divide-white/[0.08]">`
                + sec('ប្រាក់បាតថតដែលត្រូវទទួល', `
                    <p class="text-[24px] font-bold text-white sm-figure leading-tight">${fmtUSD(f.usd)} <span class="sm-value text-slate-300 font-medium">+ ${fmtKHR(f.khr)}</span></p>
                    <p class="sm-td-sub text-slate-500 mt-1">${f.movement ? `ចេញដោយ ${personName(f.by)} ម៉ោង ${fmtTime(f.movement.createdAt)}` : 'ចំនួនស្តង់ដារ · រាប់ជាមួយអ្នកគ្រប់គ្រង'}</p>`)
                + sec(`បញ្ជរ ${reg()}`, last
                    ? `<div class="flex items-center gap-3">${avatarHtml(last.cashierId, 'w-8 h-8')}
                        <div class="min-w-0"><p class="sm-td text-slate-200 truncate">វេនមុន៖ ${personName(last.cashierId)} · ${last.templateName}</p>
                        <p class="sm-td-sub text-slate-500">${last.closedAt ? `បិទ ${fmtDate(last.closedAt)} ${fmtTime(last.closedAt)}` : 'មិនទាន់បិទ'} · ${SHIFT_STATUS[last.status].label}</p></div></div>`
                    : '<p class="sm-td text-slate-400">មិនទាន់មានវេនលើបញ្ជរនេះទេ</p>')
                + sec(slot ? `ក្រុមការងារ${slot.template.name}` : 'ក្រុមការងារ', team.length
                    ? `<div class="space-y-2">${team.map(a => `<div class="flex items-center gap-2.5">${avatarHtml(a.cashierId, 'w-7 h-7')}
                        <span class="sm-td text-slate-200 flex-1 truncate">${personName(a.cashierId)}${a.cashierId === ME_CASHIER ? ' <span class="text-slate-500">· ខ្ញុំ</span>' : ''}</span>
                        <span class="sm-td-sub text-slate-400">${a.register}</span></div>`).join('')}</div>`
                    : '<p class="sm-td text-amber-300">គ្មានអ្នកគិតលុយក្នុងកាលវិភាគ</p>')
                + `<div class="px-5 py-4 sm-td-sub text-slate-400 space-y-1.5">
                    <p><i class="fas fa-user-lock w-5 text-slate-500"></i>មួយថតប្រាក់ មួយអ្នកទទួលខុសត្រូវ</p>
                    <p><i class="fas fa-mug-hot w-5 text-slate-500"></i>ពេលសម្រាក ចាក់សោរបញ្ជរ មិនបាច់បិទវេន</p>
                    <p><i class="fas fa-scale-balanced w-5 text-slate-500"></i>អតិបរមា 12 ម៉ោងក្នុងមួយថ្ងៃ</p>
                </div></div>`;
        }

        function renderOverview() {
            document.getElementById('stage').innerHTML = `
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 items-start fade-up">
                    <div class="xl:col-span-2">${shiftPanel()}</div>
                    ${sidePanel()}
                </div>`;
            const over = chosenTemplate() && !isShortShift && workedToday() + templateHours(chosenTemplate()) > 12;
            const noteEl = document.getElementById('limitNote');
            if (noteEl) {
                noteEl.textContent = over ? 'លើស 12 ម៉ោងក្នុងមួយថ្ងៃ ដែលជាកំណត់ច្បាប់ · មិនអាចបើកវេនធម្មតាបានទេ' : '';
            }
        }

        function pickTemplate(code) {
            templateCode = code;
            isShortShift = false;
            shortShiftCap = '';
            render();
        }

        function goCount(short = false) {
            if (!chosenTemplate()) return showToast('សូមជ្រើសរើសវេន', 'warning');
            if (short) {
                const cap = capFor(ME_CASHIER, templateDateFor(chosenTemplate(), new Date()), chosenTemplate().start);
                if (!cap) return showToast('មិនអាចបើកវេនខ្លីបានទេ (សល់តិចជាង 2 ម៉ោង)', 'error');
                isShortShift = true;
                shortShiftCap = cap.capTime;
            } else {
                if (workedToday() + templateHours(chosenTemplate()) > 12) return showToast('លើស 12 ម៉ោងក្នុងមួយថ្ងៃ · មិនអាចបើកវេនបន្ថែមបានទេ', 'error');
                isShortShift = false;
                shortShiftCap = '';
            }
            if (regBusy()) return showToast(`បញ្ជរ ${reg()} កំពុងបើកវេនដោយអ្នកផ្សេង`, 'error');
            stage = 'count';
            render();
            window.scrollTo(0, 0);
        }

        /* ===== ជំហាន 2៖ រាប់ប្រាក់បាតថត ===== */

        function noteTile(currency, note) {
            const map = currency === 'usd' ? countUSD : countKHR;
            const q = map[note] || 0;
            const label = currency === 'usd' ? '$' + note : note.toLocaleString('en-US') + ' ៛';
            return `<div class="rounded-xl border ${q ? 'border-cyan-600/50 bg-[#111a2b]' : 'border-white/10 bg-[#111a2b]'} p-3">
                <div class="flex items-baseline justify-between gap-2">
                    <span class="sm-value text-white sm-figure">${label}</span>
                    <span data-sub="${currency}-${note}" class="sm-td-sub sm-figure ${q ? 'text-cyan-200' : 'text-slate-600'}">${q ? (currency === 'usd' ? fmtUSD(note * q) : fmtKHR(note * q)) : '—'}</span>
                </div>
                <div class="flex items-center gap-1.5 mt-2.5">
                    <button onclick="bump('${currency}', ${note}, -1)" type="button" aria-label="បន្ថយ ${label}"
                        class="w-11 h-11 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300"><i class="fas fa-minus text-xs"></i></button>
                    <input id="${currency}In-${note}" type="number" inputmode="numeric" min="0" value="${q || ''}" placeholder="0"
                        oninput="setCount('${currency}', ${note}, this.value)" onfocus="this.select()" aria-label="ចំនួនសន្លឹក ${label}"
                        class="os-num sm-value flex-1 min-w-0 h-11 rounded-xl bg-[#0b1220] border border-white/10 text-white text-center focus:outline-none focus:border-cyan-500">
                    <button onclick="bump('${currency}', ${note}, 1)" type="button" aria-label="បន្ថែម ${label}"
                        class="w-11 h-11 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white"><i class="fas fa-plus text-xs"></i></button>
                </div>
            </div>`;
        }

        function renderCount() {
            const t = chosenTemplate();
            document.getElementById('stage').innerHTML = `
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 fade-up">
                    <div class="xl:col-span-2 space-y-5">
                        <div class="flex items-center justify-between gap-3">
                            <button onclick="stage='overview'; render()" type="button" class="sm-td px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200 inline-flex items-center gap-2">
                                <i class="fas fa-arrow-left"></i> ត្រឡប់
                            </button>
                            <p class="sm-td-sub text-slate-400 text-right">${t.name} ${t.start}–${t.end} · ${reg()} · រាប់ជាមួយអ្នកគ្រប់គ្រង</p>
                        </div>
                        <section>
                            <p class="sm-value text-slate-200 mb-2.5"><i class="fas fa-money-bill-wave text-emerald-300 mr-1.5"></i>ក្រដាសប្រាក់ដុល្លារ</p>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">${USD_NOTES.map(n => noteTile('usd', n)).join('')}</div>
                        </section>
                        <section>
                            <p class="sm-value text-slate-200 mb-2.5"><i class="fas fa-money-bill-1 text-amber-300 mr-1.5"></i>ក្រដាសប្រាក់រៀល</p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${KHR_NOTES.map(n => noteTile('khr', n)).join('')}</div>
                        </section>
                    </div>
                    <aside class="xl:sticky xl:top-4 self-start os-panel rounded-xl p-5 space-y-4" id="summary"></aside>
                </div>`;
            renderSummary();
        }

        function bump(currency, note, delta) {
            const map = currency === 'usd' ? countUSD : countKHR;
            map[note] = Math.max((map[note] || 0) + delta, 0);
            renderCount();
        }

        function setCount(currency, note, value) {
            const map = currency === 'usd' ? countUSD : countKHR;
            map[note] = Math.max(parseInt(value, 10) || 0, 0);
            const el = document.querySelector(`[data-sub="${currency}-${note}"]`);
            const q = map[note];
            if (el) {
                el.textContent = q ? (currency === 'usd' ? fmtUSD(note * q) : fmtKHR(note * q)) : '—';
                el.className = `sm-td-sub sm-figure ${q ? 'text-cyan-200' : 'text-slate-600'}`;
            }
            renderSummary();
        }

        function mismatch() {
            const f = issuedFloat();
            return { dUSD: totalUSD() - f.usd, dKHR: totalKHR() - f.khr };
        }

        function blocker() {
            if (!chosenTemplate()) return 'សូមជ្រើសរើសវេន';
            if (!isShortShift && workedToday() + templateHours(chosenTemplate()) > 12) return 'លើស 12 ម៉ោងក្នុងមួយថ្ងៃ ដែលជាកំណត់ច្បាប់';
            if (regBusy()) return `បញ្ជរ ${reg()} កំពុងបើកវេនដោយអ្នកផ្សេង`;
            if (!(totalUSD() + totalKHR())) return 'សូមរាប់ប្រាក់បាតថតជាមុនសិន';
            const m = mismatch();
            const off = Math.abs(m.dUSD) >= 0.005 || Math.abs(m.dKHR) >= 0.5;
            if (off && mismatchNote.trim().length < 5) return 'សូមពន្យល់ភាពខុសគ្នានៃប្រាក់បាតថត';
            return '';
        }

        function renderSummary() {
            const host = document.getElementById('summary');
            if (!host) return;
            const f = issuedFloat();
            const m = mismatch();
            const counted = totalUSD() + totalKHR() > 0;
            const off = counted && (Math.abs(m.dUSD) >= 0.005 || Math.abs(m.dKHR) >= 0.5);
            const why = blocker();
            const tone = d => Math.abs(d) < 0.5 ? 'text-emerald-300' : d > 0 ? 'text-amber-300' : 'text-rose-300';
            const prev = document.getElementById('mismatchNote');
            if (prev) mismatchNote = prev.value;
            host.innerHTML = `
                <p class="sm-card-title text-white">សង្ខេបប្រាក់បាតថត</p>
                <div class="grid grid-cols-[1fr_auto_auto] gap-x-5 gap-y-2 items-baseline sm-td sm-figure">
                    <span></span><span class="sm-td-sub text-slate-500 text-right">ដុល្លារ</span><span class="sm-td-sub text-slate-500 text-right">រៀល</span>
                    <span class="text-slate-400">ត្រូវទទួល</span><span class="text-right text-slate-200">${fmtUSD(f.usd)}</span><span class="text-right text-slate-200">${fmtKHR(f.khr)}</span>
                    <span class="text-slate-400">រាប់បាន</span><span class="text-right text-white font-semibold">${fmtUSD(totalUSD())}</span><span class="text-right text-white font-semibold">${fmtKHR(totalKHR())}</span>
                    <span class="col-span-3 border-t border-white/10"></span>
                    <span class="text-slate-400">ខុសគ្នា</span>
                    <span class="text-right font-semibold ${counted ? tone(m.dUSD * 100) : 'text-slate-600'}">${counted ? fmtSigned(m.dUSD, fmtUSD) : '—'}</span>
                    <span class="text-right font-semibold ${counted ? tone(m.dKHR) : 'text-slate-600'}">${counted ? fmtSigned(m.dKHR, fmtKHR, 0.5) : '—'}</span>
                </div>
                ${counted && !off ? '<p class="sm-td-sub text-emerald-300 flex items-center gap-2"><i class="fas fa-circle-check"></i>ត្រឹមត្រូវនឹងប្រាក់ដែលបានចេញ</p>' : ''}
                ${off ? `<div>
                    <p class="sm-td-sub text-amber-300 mb-1.5"><i class="fas fa-triangle-exclamation mr-1"></i>ចំនួនមិនស្មើ · សូមពន្យល់</p>
                    <textarea id="mismatchNote" rows="2" oninput="mismatchNote = this.value; renderButton()"
                        placeholder="ឧ. ខ្វះក្រដាស 500 ៛ · អ្នកគ្រប់គ្រងនឹងបំពេញបន្ថែម..."
                        class="sm-td w-full px-3 py-2.5 rounded-xl bg-[#0b1220] border border-white/10 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 resize-none">${escapeText(mismatchNote)}</textarea>
                </div>` : ''}
                <div id="startBtn"></div>`;
            renderButton();
        }

        function renderButton() {
            const why = blocker();
            const host = document.getElementById('startBtn');
            if (!host) return;
            host.innerHTML = `
                <button onclick="startShift()" type="button" ${why ? 'disabled' : ''}
                    class="w-full h-14 rounded-lg sm-card-title font-bold inline-flex items-center justify-center gap-2 transition ${why
                        ? 'bg-white/5 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}">
                    <i class="fas fa-user-shield"></i> អ្នកគ្រប់គ្រងបញ្ជាក់ ហើយចាប់ផ្តើមវេន
                </button>
                <p class="sm-td-sub text-center mt-2 ${why ? 'text-amber-300' : 'text-slate-500'}">${why || 'អ្នកគ្រប់គ្រងវាយលេខសម្ងាត់លើអេក្រង់នេះ'}</p>`;
        }

        /* ===== ជំហាន 3៖ អ្នកគ្រប់គ្រងបញ្ជាក់ និងបើកវេន ===== */

        async function startShift() {
            const why = blocker();
            if (why) return showToast(why, 'warning');
            const t = chosenTemplate();
            const f = issuedFloat();
            const note = mismatchNote.trim();

            const ok = await showManagerOverride({
                title: isShortShift ? 'បញ្ជាក់វេនខ្លី និងបើកវេន' : 'បញ្ជាក់ប្រាក់បាតថត និងបើកវេន',
                lines: [
                    ['វេន', `${t.name} ${t.start}–${isShortShift ? shortShiftCap + ' (វេនខ្លី)' : t.end}`],
                    ['បញ្ជរ · អ្នកគិតលុយ', `${reg()} · ${personName(ME_CASHIER)}`],
                    ['ប្រាក់ដែលបានចេញ', `${fmtUSD(f.usd)} · ${fmtKHR(f.khr)}`],
                    ['រាប់បាន', `${fmtUSD(totalUSD())} · ${fmtKHR(totalKHR())}`]
                ],
                reason: note || (isShortShift ? 'បើកវេនខ្លី ព្រោះជិតដល់កំណត់ 12 ម៉ោង' : 'ប្រាក់បាតថតត្រឹមត្រូវ'),
                excludeIds: [ME_CASHIER],
                confirmText: 'អនុម័ត និងបើកវេន',
                dark: true
            });
            if (!ok) return;

            const shift = openShiftRecord({
                register: reg(),
                cashierId: ME_CASHIER,
                template: t,
                floatUSD: totalUSD(),
                floatKHR: totalKHR(),
                floatIssuedUSD: f.usd,
                floatIssuedKHR: f.khr,
                floatNote: note,
                approverId: ok.approverId,
                short: isShortShift,
                end: isShortShift ? shortShiftCap : undefined,
                plannedEnd: isShortShift ? t.end : undefined
            });
            const now = isoLocal(new Date());
            const move = f.movement || {
                id: newId('MV'), type: 'float', register: reg(), usd: f.usd, khr: f.khr,
                reason: '', ref: '', createdBy: ok.approverId, createdAt: now
            };
            saveMovement(Object.assign({}, move, {
                shiftId: shift.id, status: 'confirmed', confirmedBy: ME_CASHIER, confirmedAt: now,
                receivedUSD: totalUSD(), receivedKHR: totalKHR(), note
            }));
            // ជំនួសវេន ឬកែសម្រួលកាលវិភាគ
            const rosterList = rosterFor(shift.date, t.code);
            const myEntry = rosterList.find(a => a.cashierId === ME_CASHIER);
            if (!myEntry) {
                const list = rosterList.filter(a => a.register !== reg());
                list.push({ cashierId: ME_CASHIER, register: reg(), cover: true, by: ok.approverId, ...(isShortShift ? { until: shortShiftCap } : {}) });
                saveRoster(shift.date, t.code, list);
            } else if (isShortShift) {
                myEntry.until = shortShiftCap;
                saveRoster(shift.date, t.code, rosterList);
            }
            if (isShortShift) {
                logPosEvent('shift_short', { shiftId: shift.id, register: reg(), cashierId: ME_CASHIER, approverId: ok.approverId, until: shortShiftCap, plannedEnd: t.end });
            }
            logPosEvent('shift_opened', { shiftId: shift.id, register: reg(), cashierId: ME_CASHIER,
                approverId: ok.approverId, note, ...(isShortShift ? { short: true, until: shortShiftCap } : {}) });
            setTerminalLock(false);
            clearCart();
            showToast(`បានបើក ${t.name} · ${shift.id}`, 'success');
            setTimeout(() => { location.href = '../terminal/pos-terminal.html'; }, 600);
        }

        function render() {
            const lbl = document.getElementById('regLabel');
            lbl.textContent = `${reg()} · ${lbl.dataset.date || ''}`;
            renderSteps();
            if (stage === 'overview') renderOverview(); else renderCount();
        }

        function tick() {
            const now = new Date();
            document.getElementById('liveClock').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
            const busy = regBusy();
            if (wasRegBusy && !busy) {
                wasRegBusy = false;
                showToast(`បញ្ជរ ${reg()} ទំនេរហើយ`, 'success');
                render();
            } else {
                wasRegBusy = busy;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initDarkMode === 'function') initDarkMode();
            if (currentShift()) {
                location.replace('../terminal/pos-terminal.html');
                return;
            }
            const now = new Date();
            const mine = myRosterToday();
            const current = templateAt(now);
            const urlTemplate = new URLSearchParams(location.search).get('template');
            const urlT = urlTemplate && shiftTemplates().find(x => x.code === urlTemplate);
            
            let pick = null;
            if (urlT) {
                pick = urlT;
            } else {
                // 1. Cashier's assigned shift for current window (not past)
                const myCurrent = mine.find(m => current && m.template.code === current.code && timing(m.template).state !== 'past');
                // 2. Cashier's next upcoming shift today
                const myUpcoming = mine.find(m => timing(m.template).state !== 'past');
                // 3. Current active shift (even if not assigned)
                const activeCurrent = (current && timing(current).state !== 'past') ? current : null;
                // 4. Next upcoming shift on schedule
                const upcomingT = shiftTemplates().find(t => timing(t).state !== 'past');
                
                pick = (myCurrent && myCurrent.template) || (myUpcoming && myUpcoming.template) || activeCurrent || upcomingT || shiftTemplates()[0];
            }
            templateCode = pick ? pick.code : (shiftTemplates()[0] ? shiftTemplates()[0].code : '');
            wasRegBusy = regBusy();
            const me = personById(ME_CASHIER);
            document.getElementById('regLabel').dataset.date = fmtKhDate(now);
            document.getElementById('meChip').innerHTML = `${avatarHtml(me.id, 'w-8 h-8')}<span class="sm-badge text-slate-200 hidden md:!inline">${me.name}</span>`;
            tick();
            setInterval(tick, 2000);
            render();
        });

        window.addEventListener('bms-theme-change', () => {
            render();
        });
    </script>
</body>
</html>
